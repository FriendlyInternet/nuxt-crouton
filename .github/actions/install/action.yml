name: Install
description: >
  Shared pnpm + Node + node_modules-cache install for pipeline jobs (#3199, epic #3197).
  Prints the time the install step took so before/after is measurable from the job log.
inputs:
  node-version:
    description: Node version
    required: false
    default: "22"
  cache-node-modules:
    description: Restore/save node_modules keyed on lockfile (set "false" if store linking is faster)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        # per-job dest — the default ~/setup-pnpm collides between self-hosted runners (#1255)
        dest: ${{ runner.temp }}/setup-pnpm
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Cache node_modules
      id: nm-cache
      if: ${{ inputs.cache-node-modules == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          **/node_modules
        key: nm-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', '.npmrc', 'pnpm-workspace.yaml') }}
    - name: pnpm install
      shell: bash
      run: |
        set -euo pipefail
        start=$(date +%s)
        # Do NOT add --ignore-scripts: workspace postinstalls/rebuilds are needed.
        pnpm install --frozen-lockfile --prefer-offline
        end=$(date +%s)
        echo "install-seconds=$((end-start)) node_modules_cache_hit=${{ steps.nm-cache.outputs.cache-hit || 'n/a' }}"
        echo "### Install: $((end-start))s (node_modules cache hit: ${{ steps.nm-cache.outputs.cache-hit || 'n/a' }})" >> "$GITHUB_STEP_SUMMARY"
