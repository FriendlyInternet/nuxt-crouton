name: On PR close

# ONE listener for "a pull request closed" (#2893, epic #2889). Before this, closing a PR started
# six workflows. One run, one job per concern:
#
#   job                  was
#   clear-blocked        clear-blocked-on-pr-close.yml  (#2054)
#   teardown-preview     teardown-pr-preview.yml        (#2020)
#   cleanup-epic-branch  cleanup-epic-branches.yml      (PR path, #2788)
#   close-linked-issues  schedule-waves.yml             (PR path, #283)
#   release-traffic      traffic-release.yml            (#2786)
#   owner-quiz           NEW (#3715) → owner-quiz.yml (reusable; also dispatchable by hand)
#   postmortem           NEW (#3425) → postmortem.yml (reusable; also dispatchable by hand)
#
# `release-traffic` calls release-waiting.yml (the one serialised `releaseWaiting` walk, #3086) —
# unless `close-linked-issues` closed an issue itself: that close starts on-issue-close.yml, which
# walks instead, so one merge walks once.
#
# Code that removes `status:blocked` by name, each tied to a kind of hold (#3086):
#   on-pr-close.yml `clear-blocked`            review hold (held PR closed unmerged)
#   on-comment.yml (owner `ok` un-drafts)       review hold
#   on-comment.yml (pi design-hold resume)      worker question / design hold
#   scripts/traffic-control.mjs releaseOne      queue (traffic wait)
#   scripts/lib/pr-merge-gate-io.mjs finish     review hold (owner-ok gate merge)
#   scripts/plan-held.mjs (owner override)      owner park / plan-review hold
# plus two close-time strippers of every `status:*` label: on-issue-close.yml `strip-status` and
# scripts/epic-auto-close.mjs. scripts/status-blocked-removers.test.mjs fails if a new remover
# lacks the `status:blocked remover (#3086)` marker.
#
# Token rule unchanged: jobs whose writes must cascade use the Harness App
# token; the cleanups use GITHUB_TOKEN. Permissions live at job level.
# scripts/workflow-listeners.test.mjs fails CI if any other workflow listens for PR close.

on:
  pull_request:
    types: [closed]

jobs:
  clear-blocked:
    # Held PR closed WITHOUT merging (superseded, abandoned): the issue resolved from the BRANCH
    # NAME (`work-<N>`), never from body prose, so an unrelated PR can't strip a real hold.
    # Removing a label raises no `labeled` event and triggers nothing (#572).
    if: |
      !github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'work-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const head = context.payload.pull_request.head.ref
            const m = head.match(/^work-(\d+)$/)
            if (!m) { core.info(`head ${head} is not a work-<issue> branch — nothing to clear.`); return }
            const issue_number = Number(m[1])
            try {
              // status:blocked remover (#3086): review hold (held PR closed unmerged)
              await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: 'status:blocked' })
              core.info(`Cleared status:blocked from #${issue_number} (PR #${context.payload.pull_request.number} closed unmerged).`)
            } catch (e) {
              // 404 = the label wasn't set (non-UI PR, or already cleared) — the normal case.
              core.info(`No status:blocked to clear on #${issue_number} (${e.status || e.message}).`)
            }

  teardown-preview:
    # Delete the preview Worker + D1 + KV of EVERY PR that is no longer open (scripts/preview-sweep.mjs),
    # not only of the PR that closed: GitHub starts no run for a PR closed while in conflict, so
    # that PR's previews are picked up by the next close. Red when something it tried to delete is
    # still there; it is its own job, so that never stops the other PR-close jobs.
    # Fork PRs never got a preview (no secrets), so they don't start a sweep.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
      - name: Delete previews of PRs that are no longer open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-sweep.mjs

  cleanup-epic-branch:
    # The epic→main merge half of branch cleanup (#613/#2788): keep the branch while its epic is
    # still OPEN; the close half lives in on-issue-close.yml.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'epic/') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { shouldKeepEpicBranch } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/epic-branch-keep.mjs`)
            const branch = context.payload.pull_request.head.ref
            let epicState
            const n = Number(/^epic\/(\d+)-/.exec(branch)?.[1])
            if (n) {
              try {
                epicState = (await github.rest.issues.get({ ...context.repo, issue_number: n })).data.state
              } catch (e) { core.warning(`Could not read epic #${n}: ${e.message}`) }
            }
            if (shouldKeepEpicBranch(branch, epicState)) {
              core.info(`Keeping ${branch}: its epic is still open (or state unknown).`)
              return
            }
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${branch}` })
              core.info(`🧹 Deleted epic branch ${branch} (epic closed).`)
            } catch (e) {
              // Already gone (e.g. "delete branch on merge" beat us) — not an error.
              core.warning(`Could not delete ${branch}: ${e.message}`)
            }

  close-linked-issues:
    # A merged PR closes its `Closes #NN` issues (GitHub only auto-closes on the default branch,
    # not on an epic branch). App token: the close must cascade into on-issue-close.yml's release.
    # Output `closed`: how many issues it closed itself — release-traffic skips its walk when > 0.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      closed: ${{ steps.close.outputs.closed }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: close
        env:
          OWNER_LOGIN: ${{ vars.PIPELINE_OWNER || 'pmcp' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { closeLinkedIssues } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/wave-release.mjs`)
            core.setOutput('closed', String(await closeLinkedIssues({ github, context, core })))
      - name: Tick Merged for v1 PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLOW_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // #3501: GitHub (not automerge-epic-subpr) merges a v1 PR, so the "Merged" tick happens here, whoever merged it.
            const { isV1Base } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pipeline-version.mjs`)
            const pr = context.payload.pull_request
            if (!isV1Base(pr.base.ref)) return
            const { issueFromPrBody } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/flow-checklist.mjs`)
            const closes = issueFromPrBody(pr.body || '')
            if (!closes) { core.info('v1 PR without a Closes line — no tick.'); return }
            require('node:child_process').execFileSync('node', ['scripts/flow-checklist.mjs', String(closes), 'merged', '--link', pr.html_url],
              { env: { ...process.env, GH_TOKEN: process.env.FLOW_TOKEN, GITHUB_REPOSITORY: `${context.repo.owner}/${context.repo.repo}` }, stdio: 'inherit' })

  owner-quiz:
    # (#3715) A product epic (or a work-<N> ticket) merged to main → a 3–5 question owner quiz on
    # the epic. owner-quiz.yml decides whether it is product work (app:* / pkg:*) and posts once per
    # PR. Never blocks anything, never touches a label.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (startsWith(github.event.pull_request.head.ref, 'epic/') ||
       startsWith(github.event.pull_request.head.ref, 'work-'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/owner-quiz.yml
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit

  postmortem:
    # (#3425) An epic → main PR merged → the pipeline writes the epic's postmortem, once.
    # postmortem.yml decides (every sub-issue closed, no trusted marker yet) and never blocks.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'epic/')
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/postmortem.yml
    with:
      head_ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  release-traffic:
    # (#2786) A pipeline PR (`work-<n>`) closing frees a slot: re-check every ticket parked by the
    # start-of-run traffic check, through the one serialised walk (release-waiting.yml, #3086).
    # Skipped ONLY when close-linked-issues succeeded and closed >= 1 issue itself (that close
    # starts on-issue-close.yml, which walks). An unmerged close, a merge whose issue stays open,
    # a failed close job or an empty output still walk here. `always()`: close-linked-issues is
    # skipped on an unmerged close.
    needs: close-linked-issues
    if: >-
      always() &&
      !github.event.pull_request.head.repo.fork &&
      startsWith(github.event.pull_request.head.ref, 'work-') &&
      !(needs.close-linked-issues.result == 'success' &&
        needs.close-linked-issues.outputs.closed != '' &&
        needs.close-linked-issues.outputs.closed != '0')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-waiting.yml
    secrets: inherit
