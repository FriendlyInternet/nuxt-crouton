name: Deploy App (reusable, Cloudflare Workers)

# Reusable deploy pipeline for any crouton app on Cloudflare Workers (#114).
#
# Per-app callers stay tiny — they just say which app + environment and pass
# secrets (see deploy-three-demo.yml for the reference caller). All the real work
# lives in the app's own `cf:deploy` / `cf:staging` scripts (build → deploy →
# auto-provision id-less D1/KV → sync ids back into wrangler.jsonc → remote D1
# migrate), so the pipeline has ONE source of truth: package.json. CI only adds
# the environment, the workspace layer builds, and the PR staging-URL comment.
#
# Domain convention (#133): production → friendlyinter.net, staging → pmcp.dev.
#
# No Pages "strip env from redirected config" step is needed: the cloudflare_module
# preset strips `env` from the generated .output config itself, and cf:staging
# re-injects it via scripts/inject-wrangler-env.mjs.

on:
  workflow_call:
    inputs:
      app:
        description: App/POC directory name (e.g. velo, blog)
        required: true
        type: string
      workspace:
        description: "Workspace dir holding the app: 'apps' (launched, default) or 'pocs' (preview)."
        required: false
        default: apps
        type: string
      environment:
        description: 'production | staging'
        required: false
        default: staging
        type: string
      production-url:
        description: Public production URL (used as BETTER_AUTH_URL at build time)
        required: false
        default: ''
        type: string
      staging-url:
        description: Public staging URL (used as BETTER_AUTH_URL at build time)
        required: false
        default: ''
        type: string
      node-version:
        required: false
        default: '22'
        type: string
      review-pr:
        description: >-
          PR number to wire the preview-review bridge to (staging only, #607).
          When set, the staging Worker is given the `croutonReview` runtime config
          (repo + this PR + the Nuxt Harness App creds) so in-page overlay comments
          POST to this PR as nuxt-harness[bot]. Empty = bridge left unconfigured.
        required: false
        default: ''
        type: string
      skip-staging-smoke:
        description: >-
          ESCAPE HATCH for the Rung 3 pre-prod confidence gate (#1107): skip the
          live-staging smoke that normally blocks a production deploy while staging
          is red. Only for "staging is down and prod needs a hotfix" — using it
          prints a loud warning on the run.
        required: false
        default: false
        type: boolean
      require-worker-secrets:
        description: >-
          Fail the deploy if WORKER_SECRETS_JSON resolves empty (#1094). Guards the
          mis-scoping trap: an Environment-scoped WORKER_SECRETS_JSON silently
          resolves empty on this call path (see the secrets block below), which
          would otherwise deploy a Worker with no secrets. Callers set this from
          the app's deploy.config.json `secrets.required`.
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      # Optional: a JSON object of { "NAME": "value", … } pushed to the Worker as
      # secrets on every deploy (wrangler secret bulk). MUST be a *repository-level*
      # Actions secret, NOT an *Environment* secret: this workflow is reached via
      # `secrets: inherit` from caller jobs that declare no `environment:`, so an
      # Environment-scoped secret is never in scope and resolves EMPTY with no error
      # (the sync step below then silently skips — or fails, when the app sets
      # `secrets.required` in deploy.config.json). One bundle serves both envs;
      # env-specific values (e.g. BETTER_AUTH_URL) are handled by the deploy itself
      # or a one-time manual `wrangler secret bulk`. Omit it to manage Worker
      # secrets manually (they persist across deploys).
      WORKER_SECRETS_JSON:
        required: false
      # Optional repo-level secret used only to derive the throwaway review login's
      # password (#608). Absent → a fixed fallback salt is used (fine: staging is
      # throwaway + isolated and the creds are posted publicly on the PR anyway).
      REVIEW_SEED_SECRET:
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} (${{ inputs.environment }})
    # Routed to the self-hosted box behind the AGENT_RUNNER toggle (#654/#658 — wrangler
    # deploy is cross-platform Node; verified from macOS by the #654 proof run). The fork
    # guard implements the runbook §5 policy: deploy-pocs.yml calls this on `pull_request`
    # of pocs/**, so a fork PR must never reach the box — it routes back to GitHub-hosted
    # structurally (fork PRs also get no secrets, but the guard keeps their code off our
    # hardware in the first place). Delete the AGENT_RUNNER repo var to fall back.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.AGENT_RUNNER || 'ubuntu-latest' }}
    # GitHub deployment environment — kept as production/staging so any
    # environment-scoped secrets/protection from the existing setup still apply
    # (the Workers target is staging/prod independently, via inputs.environment).
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    permissions:
      contents: read
      pull-requests: write   # for the staging-URL PR comment
    # Serialize (don't cancel — a cancel mid-migration is unsafe) deploys to the
    # same app+env so concurrent runs can't race on auto-provisioning / sync / D1.
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@v4

      # Hosted runners ship jq; a self-hosted mac starts bare (runbook §2a installs
      # node/pnpm/gh/wrangler but jq wasn't on the list). Self-heals via Homebrew —
      # already on the runner PATH through its `.path` file. No-op when jq exists.
      - name: Ensure jq (self-hosted macOS)
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null 2>&1 || brew install jq

      # dest is keyed per app+env: on the self-hosted mini several app deploys run
      # in parallel and the default shared ~/setup-pnpm races (ENOTEMPTY rmdir,
      # #1254/#1255). The deploy-<app>-<env> concurrency group above guarantees one
      # writer per dest; the dest set is bounded (apps × envs), so no disk creep. (#1258)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ inputs.app }}-${{ inputs.environment }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs['node-version'] }}
          cache: 'pnpm'

      # ── Rung 3 pre-prod confidence gate (#1107, epic #632) ──────────────────
      # Before anything expensive: smoke the app's LIVE STAGING URL and refuse to
      # deploy production while it's red. "Verified on staging first" was only a
      # skill checklist until now — this enforces it. The smoke recomputes the
      # deterministic review login the last push-to-main staging deploy seeded
      # (KEY=main; same derivation as the "Seed review login" step below) and runs
      # scripts/smoke-deployed.mjs — node built-ins only, so it works before
      # `pnpm install` (the screenshot part self-skips without playwright).
      # Gates the deliberate manual click (#318), never automates it. Escape
      # hatch: the skip-staging-smoke input (loud warning, next step).
      - name: Pre-prod confidence gate — smoke live staging
        if: ${{ inputs.environment == 'production' && !inputs['skip-staging-smoke'] }}
        env:
          STAGING_URL: ${{ inputs['staging-url'] }}
          APP: ${{ inputs.app }}
          WORKSPACE: ${{ inputs.workspace }}
          REVIEW_SEED_SECRET: ${{ secrets.REVIEW_SEED_SECRET }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::error::No staging-url configured for $APP — cannot verify staging before production (#1107). Set stagingUrl in $WORKSPACE/$APP/deploy.config.json, or dispatch with skip-staging-smoke=true (deliberate escape hatch)."
            exit 1
          fi
          # Same deterministic creds the staging seed step derives on push to main.
          SALT="${REVIEW_SEED_SECRET:-crouton-review-seed}"
          EMAIL="review+${APP}-main@example.com"
          PW="$(printf '%s' "${SALT}:${APP}:main" | sha256sum | cut -c1-24)"
          MANIFEST="$WORKSPACE/$APP/deploy.config.json"
          if node scripts/smoke-deployed.mjs --url "$STAGING_URL" --email "$EMAIL" --password "$PW" --app "$APP" --manifest "$MANIFEST"; then
            echo "### ✅ Pre-prod gate ($APP): staging smoke green on $STAGING_URL — proceeding to production" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Pre-prod gate REFUSED ($APP): the staging smoke is red on $STAGING_URL. Fix staging (merge to main redeploys it), verify the smoke is green, then re-dispatch. Genuine emergency with staging down → re-dispatch with skip-staging-smoke=true (#1107)."
            exit 1
          fi

      - name: Pre-prod gate SKIPPED (escape hatch)
        if: ${{ inputs.environment == 'production' && inputs['skip-staging-smoke'] }}
        run: |
          echo "::warning::skip-staging-smoke=true — deploying PRODUCTION without verifying the live staging (#1107 escape hatch). Do this only when staging itself is down and prod needs a hotfix."
          echo "### ⚠️ Pre-prod gate SKIPPED via skip-staging-smoke — staging was NOT verified before this production deploy" >> "$GITHUB_STEP_SUMMARY"

      # --ignore-scripts: skip every workspace postinstall (guarded `nuxt prepare`)
      # during a whole-monorepo install; the app's own prepare runs below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Best-effort: the deployed smoke's SCREENSHOT wants a Playwright browser; the
      # smoke itself passes without one (evidence, not a gate — #1126). On the
      # self-hosted runner this downloads once into the persistent ms-playwright
      # cache and is a no-op afterwards; on hosted runners it costs ~30s. Never
      # fails the deploy.
      - name: Ensure Playwright browser (smoke screenshots)
        run: npx playwright install chromium 2>&1 | tail -2 || true

      # --ignore-scripts above also skips native-module build steps. @nuxt/content
      # (the docs app) needs better-sqlite3's native binding at BUILD time to process
      # collections into the local DB (the dump that's loaded into D1 at runtime).
      # Rebuild it so the build doesn't fail with "Could not locate the bindings file".
      # No-op for apps that don't have it in their graph.
      - name: Rebuild native build deps skipped by --ignore-scripts
        run: pnpm rebuild better-sqlite3 2>/dev/null || true

      # Ensure EVERY @fyit/* dist is present before the app build. Content-addressed
      # cache + build-ALL-on-miss (warm-packages action, #1222) — replaces the old
      # per-caller subset build, which could miss a package the app transitively
      # extends (e.g. @fyit/crouton itself wasn't in a POC's layer-packages → the
      # 0.06s "Could not load @fyit/crouton" that killed the quotes-POC deploy). It
      # also subsumes the #745 cross-app cache-collision class: every entry contains
      # ALL dist, so no caller can restore a set missing a package it needs.
      # The `layer-packages` input that fed that old subset build is gone (#1787) —
      # it outlived its reader by 500-odd commits. Nothing selects packages anymore.
      - name: Warm @fyit package builds
        uses: ./.github/actions/warm-packages

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.workspace }}/${{ inputs.app }}/node_modules/.cache
            ${{ inputs.workspace }}/${{ inputs.app }}/.nuxt/cache
          key: nuxt-build-${{ inputs.app }}-${{ hashFiles(format('{0}/{1}/**', inputs.workspace, inputs.app), 'packages/**/*.ts') }}
          restore-keys: |
            nuxt-build-${{ inputs.app }}-

      # Rolldown's tsconfig generation needs an explicit prepare before build
      # (see deploy-learnings); cf:deploy/cf:staging only run `nuxt build`.
      - name: Prepare Nuxt (generate tsconfig)
        run: npx nuxt prepare
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}

      # The one real step: run the SAME script a developer runs locally. It builds
      # with NITRO_PRESET=cloudflare_module, deploys (auto-provisioning id-less
      # D1/KV on first run), syncs the provisioned ids back into wrangler.jsonc,
      # and applies remote D1 migrations.
      - name: Deploy (build → provision → sync ids → migrate)
        id: deploy
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}
        env:
          # BETTER_AUTH_* are only needed by the prerender pass at build time.
          BETTER_AUTH_SECRET: prerender-placeholder
          BETTER_AUTH_URL: ${{ inputs.environment == 'production' && inputs['production-url'] || inputs['staging-url'] }}
          # REVIEW OVERLAY (#2070) — set HERE, not in each app's cf:staging script.
          # The flag existed only in the CLI's scaffold template (scaffold-app.ts), so the
          # three apps that predate it never had it: 0 of 3. The bridge-wiring steps below
          # would then push their secrets to a Worker serving no overlay, the deploy would
          # succeed, and every "walk the preview" ask had nothing behind it (#2037 sat
          # unrunnable for weeks on exactly this). One place, so it cannot drift per app.
          # Gated on `review-pr`: an ordinary staging deploy is the trunk preview and must
          # stay overlay-free — and the bridge needs a PR to post to anyway.
          NUXT_PUBLIC_CROUTON_REVIEW: ${{ (inputs.environment == 'staging' && inputs['review-pr'] != '') && 'true' || '' }}
        run: |
          set -o pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ "${{ inputs.environment }}" = "production" ]; then
            pnpm run cf:deploy | tee deploy.log
          elif [ -n "$PR_NUM" ]; then
            # PER-PR PREVIEW (#2020). `cf:staging` targets the app's ONE staging Worker and its
            # configured stagingUrl, so running it from a PR published over shared staging: two
            # PRs clobbered each other, a merge to main overwrote both, and the PR comment still
            # claimed the result was isolated. Same build, then the config is rewritten to a
            # PR-scoped Worker with id-less bindings (wrangler auto-provisions fresh D1/KV, the
            # way the app's own first deploy does) and no custom-domain route.
            echo "PR preview for #$PR_NUM — rewriting the built config"
            NITRO_PRESET=cloudflare_module npx nuxt build
            node scripts/inject-wrangler-env.mjs
            PREVIEW_OUT="$(node "$GITHUB_WORKSPACE/scripts/pr-preview-wrangler.mjs" \
              .output/server/wrangler.json "${{ inputs.app }}" "$PR_NUM")"
            PREVIEW_DB="$(printf '%s\n' "$PREVIEW_OUT" | sed -n 's/^db=//p')"
            npx wrangler deploy --config .output/server/wrangler.json | tee deploy.log
            # Fresh DB every time, so migrations are the whole schema — not incremental.
            # --config is REQUIRED here (#2078). The PR-scoped database name exists ONLY in the
            # rewritten built config; the committed wrangler.jsonc carries <app>-db /
            # <app>-staging-db and structurally cannot know about <app>-pr<n>-db. Without it
            # wrangler read the committed file and died with "Couldn't find a D1 DB with the name
            # or binding '<app>-pr<n>-db'", so EVERY per-PR preview since #2020 served an
            # unmigrated, empty database. pr-preview-wrangler.mjs makes migrations_dir absolute
            # first, so passing --config cannot re-create #138's doubled path (a green step that
            # migrates nothing) — the silent version of the same bug.
            if [ -z "$PREVIEW_DB" ]; then
              echo "::error::pr-preview-wrangler produced no db name — the preview would have NO schema."
              exit 1
            fi
            # Expose the preview DB so the seed + review-login steps target IT, not shared
            # staging (#2169 — the seed-side sibling of #2167's secret targeting).
            echo "preview_db=$PREVIEW_DB" >> "$GITHUB_OUTPUT"
            # The deploy above just PROVISIONED that database, but the built config still
            # carries no `database_id` — it is stripped on purpose so wrangler auto-provisions
            # (#2020). Remote D1 operations need the id, so resolve it by name now that it
            # exists. Without this the migrate fails "missing a database_id" (#2085).
            node "$GITHUB_WORKSPACE/scripts/pr-preview-db-id.mjs" .output/server/wrangler.json
            npx wrangler d1 migrations apply "$PREVIEW_DB" \
              --config .output/server/wrangler.json --remote
            (pnpm db:seed:staging || true)
          else
            pnpm run cf:staging | tee deploy.log
          fi
          # Surface the deployed URL for the PR comment, seed-login + review steps.
          # Prefer the configured custom-domain URL (staging-url/production-url input):
          # the workflow already knows it, and it's the actual deploy target (the route
          # in wrangler.jsonc env.staging). The log-grep only matches *.workers.dev,
          # which a custom-domain deploy NEVER emits — so grepping left the URL empty,
          # which in turn skipped the seed-login + PR-comment steps (gated on url != '').
          # Fall back to the log-grep only when no URL was configured (#293).
          if [ "${{ inputs.environment }}" = "production" ]; then
            URL="${{ inputs['production-url'] }}"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            # #2020: a preview must NEVER advertise the shared staging URL — that link would
            # show whatever deployed last, which is the bug. Leave URL empty so the
            # workers.dev fallback below (the hostname wrangler actually published) wins.
            URL=""
          else
            URL="${{ inputs['staging-url'] }}"
          fi
          # The workers.dev URL wrangler ACTUALLY published (empty for a real custom-domain deploy).
          WORKERS_URL=$(grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1 || true)
          # #1369: a configured custom-domain URL is only REAL if wrangler bound its route. A POC
          # scaffolded without --domain has NO route in wrangler.jsonc, so <app>.pmcp.dev never
          # resolves (HTTP 000) even though the Worker serves fine at *.workers.dev. Trusting the
          # configured URL blindly then advertised a dead link AND pointed the login-seed + smoke at
          # it (they masked the failure) — a green-but-broken "Potemkin" preview. So: use the
          # configured URL only if it RESOLVES; otherwise fall back to the workers.dev URL wrangler
          # published. Every downstream step (comment, seed-login, smoke) reads steps.deploy.outputs.url,
          # so this one check makes them all point at the reachable deploy.
          if [ -n "$URL" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$URL" 2>/dev/null || echo 000)
            # "Reachable" = the deployed app ANSWERS: 2xx/3xx, or 401 (its auth wall). Anything
            # else means the configured URL isn't actually serving — 000 (no DNS) OR a Cloudflare
            # error for a domain with no bound route (404/522/530/1xxx). The earlier ==000-only
            # check missed those CF codes, so a dead <name>.pmcp.dev alias survived (#1369, the
            # snippets dogfood). Fall back to the workers.dev URL wrangler actually published.
            case "$code" in
              2??|3??|401) : ;;  # serving → keep the configured URL
              *)
                if [ -n "$WORKERS_URL" ]; then
                  echo "::warning::Configured URL $URL returned HTTP $code (not serving — likely no bound route). Using the deployed $WORKERS_URL instead (#1369)."
                  URL="$WORKERS_URL"
                fi ;;
            esac
          elif [ -n "$WORKERS_URL" ]; then
            URL="$WORKERS_URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${URL:-<url not parsed>}"

      # (Optional) explicit Worker secrets from the WORKER_SECRETS_JSON bundle —
      # an OVERRIDE for known/shared values (e.g. a deliberate production secret).
      # The "Ensure BETTER_AUTH_SECRET" step below covers the common case, so this
      # is only for values you want to pin. Runs first so an explicit BETTER_AUTH_SECRET
      # wins over the auto-generated one. Secrets persist across deploys (no-op re-upload).
      #
      # IMPORTANT — scoping: WORKER_SECRETS_JSON MUST be a *repository-level* Actions
      # secret, NOT an *Environment* secret. This job is reached via `secrets: inherit`
      # from callers (deploy-apps.yml / deploy-pocs.yml) whose calling jobs declare no
      # `environment:`, so Environment-scoped secrets are never in scope to inherit and
      # resolve to EMPTY (they silently skip). Repository-level secrets inherit
      # correctly. Apps that depend on the bundle set `secrets.required` in their
      # deploy.config.json → require-worker-secrets makes an empty resolution FAIL
      # loudly here instead of deploying a Worker with no secrets (#1094).
      - name: Sync explicit Worker secrets (optional override)
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}
        env:
          SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
        run: |
          if [ -z "$SECRETS_JSON" ]; then
            if [ "${{ inputs['require-worker-secrets'] }}" = "true" ]; then
              echo "::error::WORKER_SECRETS_JSON resolved EMPTY but ${{ inputs.app }} declares secrets.required in deploy.config.json. Most likely cause: the secret is stored as an *Environment* secret — it must be a *repository-level* Actions secret (Environment scopes are unreachable on this secrets:inherit path and resolve empty with no error, #1094)."
              exit 1
            fi
            echo "No WORKER_SECRETS_JSON provided — the Ensure BETTER_AUTH_SECRET step below covers auth."
            exit 0
          fi
          if ! printf '%s' "$SECRETS_JSON" | jq -e 'type == "object" and length > 0' >/dev/null 2>&1; then
            echo "::error::WORKER_SECRETS_JSON is set but is not a non-empty JSON object — refusing to deploy with a broken secrets bundle (#1094)."
            exit 1
          fi
          printf '%s' "$SECRETS_JSON" > "$RUNNER_TEMP/worker-secrets.json"
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          else
            npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" --env staging
          fi
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      # ── Preview-review bridge wiring (#607, part of #488) ───────────────────────
      # The live-preview comment loop turns the overlay ON at build (NUXT_PUBLIC_CROUTON_REVIEW)
      # but the bridge (`POST /api/_feedback`, installed by @fyit/crouton-devtools via
      # @fyit/crouton-feedback — it was `/api/_review` before the #960 extraction) also needs RUNTIME config to
      # know which PR to post to and how to auth — which no deploy ever set, so every overlay
      # comment 4xx'd "Review bridge not configured". These two steps inject it on staging,
      # PR-tied deploys: routing (repo + PR) + the Nuxt Harness App creds (so the bridge mints
      # an installation token at request time and posts as nuxt-harness[bot]). Pushed as Worker
      # secrets (persist on the live Worker; no redeploy needed). Skipped when not staging,
      # not PR-tied, or the App creds are absent — so the bridge simply stays off.
      - name: Mint Harness App installation id (for review bridge)
        id: review-app-token
        if: ${{ inputs.environment == 'staging' && inputs.review-pr != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Wire preview-review bridge config (staging, PR-tied)
        if: ${{ inputs.environment == 'staging' && inputs.review-pr != '' && steps.review-app-token.outputs.installation-id != '' }}
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}
        env:
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.review-pr }}
          APP_ID: ${{ secrets.HARNESS_APP_ID }}
          INSTALLATION_ID: ${{ steps.review-app-token.outputs.installation-id }}
          PRIVATE_KEY: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
        run: |
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg pr "$PR" \
            --arg appId "$APP_ID" \
            --arg inst "$INSTALLATION_ID" \
            --arg key "$PRIVATE_KEY" \
            '{
              NUXT_CROUTON_REVIEW_REPOSITORY: $repo,
              NUXT_CROUTON_REVIEW_PR: $pr,
              NUXT_CROUTON_REVIEW_GITHUB_APP_ID: $appId,
              NUXT_CROUTON_REVIEW_GITHUB_APP_INSTALLATION_ID: $inst,
              NUXT_CROUTON_REVIEW_GITHUB_APP_PRIVATE_KEY: $key
            }' > "$RUNNER_TEMP/review-secrets.json"
          # Target the Worker the deploy published. A per-PR preview (#2020) is a SEPARATE
          # top-level Worker, so `--env staging` would write the bridge secrets to the SHARED
          # staging Worker and the preview's /api/_feedback stays "GitHub sink not configured"
          # (#2175 — the annotation sibling of #2167's auth-secret targeting). Point at the
          # preview's own config in that case; a dispatch review_pr (no PR event) stays --env staging.
          BRIDGE_TARGET="--env staging"
          if [ -n "${{ github.event.pull_request.number }}" ] && [ -f .output/server/wrangler.json ]; then
            BRIDGE_TARGET="--config .output/server/wrangler.json"
          fi
          npx wrangler secret bulk "$RUNNER_TEMP/review-secrets.json" $BRIDGE_TARGET
          rm -f "$RUNNER_TEMP/review-secrets.json"
          echo "✓ Wired preview-review bridge → PR #$PR on $REPOSITORY (posts as nuxt-harness[bot])"

      # ── PROVE the overlay is actually there (#2070, corrected in #2073) ────────
      # Wiring the bridge's secrets says nothing about whether the deployed build SERVES
      # the overlay — and it didn't, silently: deploy green, secrets set, no overlay,
      # every "walk the preview" link inert. Same class as #2045's blank screenshot: an
      # artifact that looks like a deliverable and isn't. So probe the live URL and FAIL,
      # rather than hand over a preview that can't be reviewed.
      #
      # #2073 — the FIRST version of this probe checked `/api/_review`, a route that does
      # not exist anywhere in the repo (the real handler is `/api/_feedback`, registered by
      # @fyit/crouton-feedback). It would have failed on a perfectly good preview too, which
      # is the "run the rule over the corpus, not just its tests" lesson in miniature: a
      # gate authored from an imagined interface refuses correct builds. Both assertions
      # below were run against a real app before landing.
      #
      # TWO independent signals, because each catches a different half:
      #   • POST /api/_feedback   — the module is INSTALLED (the app must consume
      #                             @fyit/crouton-devtools; velo/kassa/triage did not).
      #                             POST, not GET: the handler is method-scoped, so a GET
      #                             falls through to 404 even when it's registered.
      #   • croutonReview in HTML — the review FLAG reached the build
      #                             (`runtimeConfig.public.croutonReview = true`, set only
      #                             when NUXT_PUBLIC_CROUTON_REVIEW === 'true').
      - name: Verify the review overlay is live
        if: ${{ inputs.environment == 'staging' && inputs['review-pr'] != '' }}
        env:
          URL: ${{ steps.deploy.outputs.url || inputs['staging-url'] }}
        run: |
          set -o pipefail
          [ -z "$URL" ] && { echo "::error::review deploy has no URL to probe"; exit 1; }
          fail=0

          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                    -X POST -H 'content-type: application/json' -d '{}' \
                    "$URL/api/_feedback" || echo 000)"
          if [ "$code" = "404" ] || [ "$code" = "000" ]; then
            echo "::error::No feedback endpoint at $URL (POST /api/_feedback → $code)."
            echo "::error::The app does not install the overlay — add '@fyit/crouton-devtools'"
            echo "::error::to its nuxt.config modules + dependencies (#2073)."
            fail=1
          else
            echo "✓ feedback endpoint live (POST /api/_feedback → $code)"
          fi

          if curl -s --max-time 30 "$URL/" | grep -q 'croutonReview'; then
            echo "✓ review flag present in the served HTML"
          else
            echo "::error::The review flag did not reach the build at $URL."
            echo "::error::NUXT_PUBLIC_CROUTON_REVIEW must be 'true' at BUILD time (#2070)."
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            echo "::error::This preview cannot be reviewed — do not hand out the link."
            exit 1
          fi

      # Guarantee a new app can AUTHENTICATE on first deploy with ZERO per-app setup.
      # A freshly provisioned Worker has no secrets, so member login 500s with
      # "[crouton/auth] BETTER_AUTH_SECRET is required". If the Worker lacks one,
      # generate a strong secret and set it. Worker secrets persist across deploys,
      # so this runs exactly once per Worker and is a no-op afterwards — it NEVER
      # rotates an existing secret (which would invalidate live sessions). If the
      # secret list can't be read (e.g. an app whose wrangler.jsonc has no `name`),
      # we skip generation rather than risk clobbering. BETTER_AUTH_URL isn't needed:
      # better-auth infers it from the request for email/password login.
      - name: Ensure BETTER_AUTH_SECRET (auto-generate if missing)
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -o pipefail
          # Target the Worker the deploy actually published. Prod → default env; a per-PR
          # preview (#2020) is a SEPARATE top-level Worker (<app>-pr<n>) built into the
          # rewritten .output config, so `--env staging` would set the secret on the SHARED
          # staging Worker and leave the preview with none — "BETTER_AUTH_SECRET is required"
          # on every preview login (#2167). Point at the preview's own config in that case;
          # prod + normal-staging targeting is unchanged.
          ENV_FLAG=""
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ "$ENVIRONMENT" = "production" ]; then
            ENV_FLAG=""
          elif [ -n "$PR_NUM" ] && [ -f .output/server/wrangler.json ]; then
            ENV_FLAG="--config .output/server/wrangler.json"
          else
            ENV_FLAG="--env staging"
          fi
          if ! existing=$(npx wrangler secret list $ENV_FLAG 2>/dev/null); then
            echo "::warning::Could not list Worker secrets for ${{ inputs.app }} ($ENVIRONMENT) — skipping auto-generate to avoid clobbering an existing BETTER_AUTH_SECRET."
            exit 0
          fi
          if echo "$existing" | grep -q 'BETTER_AUTH_SECRET'; then
            echo "✓ BETTER_AUTH_SECRET already present on the Worker — leaving it untouched."
          else
            echo "::notice::No BETTER_AUTH_SECRET on ${{ inputs.app }} ($ENVIRONMENT) — generating one (persists; override anytime via a repo-level WORKER_SECRETS_JSON)."
            printf '%s' "$(openssl rand -hex 32)" | npx wrangler secret put BETTER_AUTH_SECRET $ENV_FLAG
          fi

      # Seed the app's COLLECTION fixtures + package demo data into the staging D1 so the
      # preview isn't an empty shell (#1370): the generated seed.json rows (#298) + the demo
      # team `test1` (seed:org:test1) the review login below attaches to. Runs BEFORE the
      # review-login step for exactly that reason — the login lands in a populated team, not a
      # phantom one. Idempotent (crouton-seed upserts by stable id → a redeploy re-seed is a
      # no-op); best-effort — warns, never reds the deploy. Skipped cleanly when the app doesn't
      # depend on @fyit/crouton-cli (crouton-seed unresolvable via pnpm exec). Staging only.
      - name: Seed collection + demo data (staging only, #1370)
        if: ${{ inputs.environment != 'production' }}
        working-directory: ${{ inputs.workspace }}/${{ inputs.app }}
        run: |
          # Per-PR preview seeds its OWN DB (#2169); non-preview staging falls back to the
          # shared staging DB exactly as before (preview_db is empty off the preview path).
          DB="${{ steps.deploy.outputs.preview_db }}"; [ -n "$DB" ] || DB="${{ inputs.app }}-staging-db"
          if pnpm exec crouton-seed --db "$DB" --remote; then
            echo "✓ seeded $DB (collection fixtures + demo team)"
          else
            echo "::warning::content seed skipped/failed for ${{ inputs.app }} — crouton-seed unresolvable or errored; the preview may be empty (#1370)."
          fi

      # Seed a throwaway, loginable test account on the (isolated, staging-only)
      # preview so a reviewer can open the URL and be inside the app in one step —
      # no register → create-team wall (#608). Drives the app's own HTTP auth on the
      # deployed Worker (no raw SQL). Idempotent: deterministic creds per preview, so
      # a redeploy reprints the SAME working login instead of piling up users; an
      # existing user is detected and reused. Best-effort — a seed hiccup never fails
      # the deploy. Staging only; production seeds nothing.
      - name: Seed review login (staging only)
        id: seed
        if: ${{ inputs.environment != 'production' && steps.deploy.outputs.url != '' }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          APP: ${{ inputs.app }}
          WORKSPACE: ${{ inputs.workspace }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REVIEW_SEED_SECRET: ${{ secrets.REVIEW_SEED_SECRET }}
          # Per-PR preview: attach the review login's team membership to the preview's OWN
          # DB (#2169), not shared staging — else the account exists but has no team/data.
          PREVIEW_DB: ${{ steps.deploy.outputs.preview_db }}
        run: |
          set -o pipefail
          # Stable per-preview key: the PR number when this is a PR, else the ref.
          if [ -n "$PR_NUMBER" ]; then KEY="pr${PR_NUMBER}"; else KEY="$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9' '-')"; fi
          EMAIL="review+${APP}-${KEY}@example.com"
          # Deterministic password so redeploys reprint the same working login.
          SALT="${REVIEW_SEED_SECRET:-crouton-review-seed}"
          PW="$(printf '%s' "${SALT}:${APP}:${KEY}" | sha256sum | cut -c1-24)"
          echo "::add-mask::$PW"
          # Attach the review login to the SEEDED demo team (#832) so the advertised
          # login lands in the team the content seed populated (test1 → seed:org:test1),
          # not an empty fresh org. Staging-only step → production is untouched.
          # #1369: DON'T mask the seed with `|| true` and then advertise the creds anyway — that
          # printed a working-looking login for a user that was never created (the seed POSTed to a
          # dead URL → failed silently → 401 on login). Only surface the creds when the seed actually
          # succeeded; otherwise emit a loud warning and NO login (a broken preview must look broken).
          SEED_DB="${PREVIEW_DB:-${APP}-staging-db}"
          if node scripts/seed-review-login.mjs --url "$DEPLOY_URL" --email "$EMAIL" --password "$PW" \
               --seed-team test1 --db "$SEED_DB"; then
            echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
            echo "password=$PW" >> "$GITHUB_OUTPUT"
            # One-click link: crouton-auth prefills the login form from ?email=&password=
            # and never auto-submits (#1153 made the prefill actually apply). Optional
            # per-app landing path so the link drops the reviewer on the surface worth
            # reviewing instead of '/': `reviewLogin.landing` in deploy.config.json
            # (same config block #1185 proposes for a fixed email/password).
            LANDING="$(node -p "(require('./$WORKSPACE/$APP/deploy.config.json').reviewLogin||{}).landing||''" 2>/dev/null || echo '')"
            LOGIN_URL="$(node -e 'const [u,e,p,l]=process.argv.slice(1); const q=new URLSearchParams({email:e,password:p}); if(l) q.set("redirect",l); process.stdout.write(`${u}/auth/login?${q}`)' "$DEPLOY_URL" "$EMAIL" "$PW" "$LANDING")"
            echo "login_url=$LOGIN_URL" >> "$GITHUB_OUTPUT"
            {
              echo "### 🔑 Review test login (${APP})"
              echo "- **One-click:** [open ${APP} signed-in]($LOGIN_URL) — the form arrives prefilled; click Sign in."
              echo "- **URL:** $DEPLOY_URL"
              echo "- **Email:** \`$EMAIL\`"
              echo "- **Password:** \`$PW\`"
              echo "_Disposable account on an isolated, throwaway staging DB._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Review-login seed FAILED for ${APP} at ${DEPLOY_URL} — not advertising a login that doesn't work (#1369)."
            echo "### ⚠️ Review login unavailable (${APP}) — the seed step failed; no working login for this preview." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Capture the review surfaces so the flow can SHOW the change (#2173) ──────────
      # Deploy-side on purpose: THIS env boots the app; the pi worker's often can't ("could not
      # typecheck the touched app"). Logs into the live preview, drives the app to each DECLARED
      # review surface (deploy.config.json `reviewSurfaces`, else reviewLogin.landing), validates
      # the shot isn't blank/error, and commits the PNG(s) to writeups/ui-proposals/ — where the
      # #2172 sign-off gate looks. The push (App token) re-runs CI so that gate re-evaluates and
      # finds the evidence; a ui-proposals-only change matches NO app watchPaths, so it does NOT
      # re-deploy (no loop). Never fails the deploy — no capture ⇒ the gate withholds (honest).
      - name: Mint token for review-capture push
        id: capture-token
        if: ${{ inputs.environment == 'staging' && github.event.pull_request.number != '' && steps.seed.outputs.email != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - name: Capture + commit review-surface evidence (#2173)
        if: ${{ inputs.environment == 'staging' && github.event.pull_request.number != '' && steps.seed.outputs.email != '' && steps.capture-token.outputs.token != '' }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EMAIL: ${{ steps.seed.outputs.email }}
          PASSWORD: ${{ steps.seed.outputs.password }}
          APP: ${{ inputs.app }}
          WORKSPACE: ${{ inputs.workspace }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN_PUSH: ${{ steps.capture-token.outputs.token }}
        run: |
          set -o pipefail
          [ -n "$DEPLOY_URL" ] || { echo "no deploy url — skipping capture"; exit 0; }
          npx playwright install chromium >/dev/null 2>&1 || true
          # Capture to a temp dir so the commit is done in a CLEAN clone, never the dirty deploy
          # workspace (build output / sync:ids-modified wrangler.jsonc would otherwise ride along).
          OUT="$RUNNER_TEMP/uip"; rm -rf "$OUT"; mkdir -p "$OUT"
          node scripts/capture-review-surfaces.mjs \
            --url "$DEPLOY_URL" --email "$EMAIL" --password "$PASSWORD" \
            --manifest "$WORKSPACE/$APP/deploy.config.json" --pr "$PR_NUMBER" --out "$OUT" || true
          shopt -s nullglob; PNGS=("$OUT"/*.png)
          if [ ${#PNGS[@]} -eq 0 ]; then
            echo "no valid captures — the sign-off gate will withhold (nothing to show)"; exit 0
          fi
          BR="$RUNNER_TEMP/uip-branch"; rm -rf "$BR"
          git clone --depth=1 --branch "$HEAD_REF" \
            "https://x-access-token:${GH_TOKEN_PUSH}@github.com/${REPO}.git" "$BR" 2>/dev/null || {
              echo "::warning::could not clone $HEAD_REF for capture commit — skipping (non-fatal)"; exit 0; }
          mkdir -p "$BR/writeups/ui-proposals"
          cp "$OUT"/*.png "$BR/writeups/ui-proposals/"
          cd "$BR"
          git config user.name "nuxt-harness[bot]"
          git config user.email "295566920+nuxt-harness[bot]@users.noreply.github.com"
          git add writeups/ui-proposals/*.png
          if git commit -q -m "chore(review): capture ${APP} review surface(s) for PR #${PR_NUMBER} (#2173)"; then
            git push origin "HEAD:${HEAD_REF}" && echo "✓ committed ${#PNGS[@]} capture(s) → the sign-off gate can now show them"
          else
            echo "captures unchanged — nothing to commit"
          fi

      # Prove the DEPLOYED preview actually works — log in with the seeded account, run
      # any app-declared CRUD + public read, and screenshot it (#293). This is the
      # acceptance typecheck/boot can't give: auth + a data round-trip on the real Worker
      # (D1 + secrets + better-auth). On PR previews it's report-only by DEFAULT — a
      # brittle smoke must never red a previously-green deploy across velo/fanfare/triage;
      # an app opts into gating with `"smoke": { "required": true }` in its
      # deploy.config.json. On push to main (the shared staging) a failure GATES by
      # default — see the "Gate on smoke result" step (#1106). Login proof + CRUD
      # use plain fetch (always available); the screenshot is best-effort (skips cleanly
      # when no browser is present on the runner).
      - name: Verify deployed preview (smoke)
        id: smoke
        if: ${{ inputs.environment != 'production' && steps.deploy.outputs.url != '' }}
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EMAIL: ${{ steps.seed.outputs.email }}
          PW: ${{ steps.seed.outputs.password }}
          APP: ${{ inputs.app }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          MANIFEST="$WORKSPACE/$APP/deploy.config.json"
          if node scripts/smoke-deployed.mjs --url "$URL" --email "$EMAIL" --password "$PW" --app "$APP" --manifest "$MANIFEST"; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "### ✅ Deployed-preview smoke ($APP) — passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "### ❌ Deployed-preview smoke ($APP) — failed (see step log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke screenshot
        if: ${{ always() && steps.smoke.outputs.result != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.app }}
          path: screenshots/${{ inputs.app }}-smoke.png
          if-no-files-found: ignore

      # Gate the deploy on the smoke — two regimes (#1106, epic #632 Rung 2):
      #   • PR / dispatch previews: report-only unless the app opts IN
      #     (smoke.required: true). A brittle smoke must never block PR iteration.
      #   • push to main (the shared *.pmcp.dev staging): gate by DEFAULT. A green
      #     workflow over a broken deployed staging is the silent failure
      #     report-failed-deploy.yml exists to catch — and it only reacts to RED
      #     runs, so a report-only failure here would vanish as a ::warning::.
      #     A known-brittle app can opt OUT with smoke.gateOnMain: false.
      #   A smoke "fail" is always a real broken deploy: skipped checks
      #   (no creds / no manifest) pass, they don't fail (see smoke-deployed.mjs).
      - name: Gate on smoke result
        if: ${{ steps.smoke.outputs.result == 'fail' }}
        env:
          APP: ${{ inputs.app }}
          WORKSPACE: ${{ inputs.workspace }}
          EVENT: ${{ github.event_name }}
        run: |
          CONFIG="$WORKSPACE/$APP/deploy.config.json"
          REQUIRED=$(jq -r '.smoke.required // false' "$CONFIG" 2>/dev/null || echo false)
          if [ "$REQUIRED" = "true" ]; then
            echo "::error::Deployed-preview smoke failed and $APP sets smoke.required=true."
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            GATE_ON_MAIN=$(jq -r '.smoke.gateOnMain // true' "$CONFIG" 2>/dev/null || echo true)
            if [ "$GATE_ON_MAIN" = "true" ]; then
              echo "::error::Deployed smoke failed on the shared staging after merge to main — failing the run so report-failed-deploy.yml opens an issue (#1106). A known-brittle smoke can opt out with smoke.gateOnMain=false in $APP/deploy.config.json."
              exit 1
            fi
            echo "::warning::Deployed smoke failed post-merge, but $APP sets smoke.gateOnMain=false (report-only)."
            exit 0
          fi
          echo "::warning::Deployed-preview smoke failed (report-only; set smoke.required=true in $APP/deploy.config.json to gate)."

      # On PRs, post/update a sticky comment with the isolated staging URL.
      - name: Comment staging URL on PR
        if: ${{ inputs.environment != 'production' && github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}'
            const app = '${{ inputs.app }}'
            const email = `${{ steps.seed.outputs.email }}`
            const password = `${{ steps.seed.outputs.password }}`
            const loginUrl = `${{ steps.seed.outputs.login_url }}`
            const marker = `<!-- deploy-staging:${app} -->`
            // Disposable test login (#608) — only present when the seed step ran + produced creds.
            // Leads with the one-click link (the form arrives prefilled — #1153 fixed the apply,
            // it never auto-submits) and keeps the raw creds as the paste-in fallback.
            const oneClick = loginUrl ? `\n\n🔑 **[Open ${app} signed-in](${loginUrl})** — prefilled login, one click on Sign in.` : ''
            const login = (email && password)
              ? `${oneClick}\n\n<details><summary>…or paste the creds</summary>\n\n\`\`\`\nEmail:    ${email}\nPassword: ${password}\n\`\`\`\n</details>\n_Disposable account on this isolated, throwaway staging DB._`
              : ''
            const pr = context.issue.number
            const body = `${marker}\n🚀 **${app}** preview for this PR: ${url}${login}\n\n<sub>🤖 \`${app}-pr${pr}\` — a Worker of its own, with its own auto-provisioned D1 + KV. Not shared staging; nothing else deploys over it, and it is deleted when this PR closes (#2020).</sub>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
