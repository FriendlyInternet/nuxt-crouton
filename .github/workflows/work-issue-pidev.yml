name: Work issue (pi.dev · single-use worker)

# WS1 of epic #1685 (issue #1686) — the SINGLE-USE worker half of the event-driven pipeline.
# Derived from decompose-on-issue-pidev.yml: the App-token push path (#1004), the pi step, the
# artifact-gate (#461) and the telemetry capture are preserved VERBATIM. What differs:
#   • Trigger — the `work-this` label on a LEAF issue (not `delegate*`), applied by a human or,
#     later, by the decomposer via the Harness App token (nuxt-harness[bot] → passes the guard).
#   • Task — the prompt IMPLEMENTS that one leaf and opens a PR; NO /task-decompose, NO in-process
#     subagent tree. Each run is one-shot — which is what pi-claude-cli can actually drive.
# ⚠️ CLEANUP PENDING (#1686): many inherited comments/vars below still say "decompose"/"decompose-pi"
#   and describe the tree flow — they are stale here. Functional edits (trigger, if, prompt) are done;
#   the comment sweep + on-box test (label a leaf → PR on pi-claude-cli) are the remaining WS1 items.
# ── original decompose-flow header follows (context for the shared machinery) ──

# WS4 (#1004) of #669 — the code-writing pipeline on pi.dev. A twin of
# `decompose-on-issue.yml` with ONE thing swapped: the agent step
# (anthropics/claude-code-action → pi). It is LIVE: while `vars.AGENT_HARNESS == 'pi'`
# (the current setting) THIS flow — not the claude one — works our `delegate` issues.
#
# HOW A RUN STARTS (the `on:` block and the job `if` below are authoritative — if this
# prose ever disagrees with them, they win and this comment is the thing that's wrong):
#   • `delegate` label — added after creation, OR already present at creation. Only
#     while `vars.AGENT_HARNESS == 'pi'`; otherwise `decompose-on-issue.yml` takes it
#     and this flow yields (#1077 WS7 — one variable flips the harness back).
#   • `delegate-pi` label — always, regardless of AGENT_HARNESS.
#   • `delegate-hard` label — always; escalates to the METERED Claude lane (#1496).
#   • `workflow_dispatch` — an explicit run on any issue number.
#
#   ⚠️ ASYMMETRY: only `delegate` has an `action == 'opened'` clause. `delegate-pi` and
#   `delegate-hard` match `labeled` ONLY — so creating an issue with either one ALREADY
#   applied fires nothing. Add those two as a separate step after the issue exists.
#
# HISTORY — this file was born dormant (dispatch-only, default-OFF, no funded key) and
# every one of those locks has since been removed. Do NOT reintroduce that framing:
# superseded by #1017 (`delegate-pi` trigger), #1077 (the AGENT_HARNESS=pi flip), and
# #1421/#1423 (the funded zai/GLM-5.2 lane). Stale dormancy prose here cost a session
# once — it reads as authoritative while sitting directly above code that refutes it.
#
# WHAT'S DIFFERENT FROM THE CLAUDE FLOW (the WS4 plumbing):
#   • PUSH PATH (#1004 piece 1, the load-bearing change): unlike the reports-only
#     a11y flow (which gets NO git creds), a code-writing run MUST push (epic branch
#     + sub-issues + the worker's PR). Those pushes have to CASCADE — re-trigger the
#     downstream wave/automerge CI — which a GITHUB_TOKEN push does NOT (#572/#626).
#     So we mint a Harness App token and hand it to pi as GH_TOKEN + the git remote.
#   • NO id-token — pi auths via a provider key, not OIDC (drop `id-token: write`).
#   • ARTIFACT-GATE reused VERBATIM — it is harness-agnostic (GITHUB_TOKEN-based
#     PASS/FAIL); we just feed it pi's conclusion. The rich "why" classification
#     reads CLAUDE_EXEC_FILE, which pi doesn't emit yet (#1004 piece 3 / WS3) — the
#     gate degrades to the conclusion-based message, PASS/FAIL is unaffected.
#
# WS4 plumbing is now COMPLETE (#1004) — all three pieces present and LIVE:
#   • Piece 1 — PUSH PATH: the Harness App token (below).
#   • Piece 2 — BOT-ACTOR GUARD: the first job step (re-expresses claude-code-action's
#     `allowed_bots`). ARMED on every label-triggered run; it still no-ops under
#     `workflow_dispatch`, where the actor is the human dispatcher.
#   • Piece 3 — EXEC-LOG ADAPTER: the artifact-gate reads pi's plain-text run log
#     (`steps.pi.outputs.exec_log`) and classifies the failure cause (billing / error /
#     underspecified) — parity with the claude flow's structured-log "why".
#
# TWO LOAD-BEARING pi FACTS (verified on the mac-mini this WS):
#   • NO TURN-CAP FLAG. `pi --help` exposes only model-cycling "Limit" options, not a
#     claude-style `--max-turns`. The ONLY cost/safety bound is the job `timeout-minutes`
#     (45, below) — do NOT assume a per-turn cap exists.
#   • SINGLE-MODEL. pi runs the whole orchestrator→decomposer→worker pipeline on ONE
#     `--model`; it cannot reproduce the Claude harness's per-role tiering (#824 — e.g.
#     planning on Opus). Choose the one model deliberately via the `model` input.
#
# PROMOTED past dispatch-only (#1017): now also fires when a human applies the `delegate-pi`
# label to an issue (mirrors the claude `delegate` flow). The bot-actor guard below is now LIVE
# on that path; on success the run posts a `🤖 pi: done → PR #N` breadcrumb back on the issue.
# Manual `workflow_dispatch` (harness=pi) still works for an explicit run on any issue number.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Leaf issue number to implement (e.g. 660)."
        required: true
        type: string
      model:
        description: "Model for pi. Default claude-sonnet-5 on the Claude SUBSCRIPTION (provider=pi-claude-cli)."
        required: false
        default: "claude-sonnet-5"
        type: string
      provider:
        description: "pi provider. Default pi-claude-cli = Claude SUBSCRIPTION via the mini's `claude` login. zai = GLM Coding Plan; anthropic = metered PI_PROVIDER_KEY."
        required: false
        default: "pi-claude-cli"
        type: choice
        options: ["pi-claude-cli", "zai", "anthropic"]
  # Single-use trigger (#1685/#1686): a human OR the decomposer (via the Harness App token, so
  # it's nuxt-harness[bot]-actored and passes the bot-actor guard + cascades) applies `work-this`
  # to a LEAF issue → this one-shot worker implements it and opens a PR. We fire on EVERY labeled
  # event but the job `if` gates to the EXACT `work-this` label, so a worker later adding
  # `status:in-progress` does NOT re-fire this workflow (the #535 lesson).
  issues:
    types: [labeled]

jobs:
  work-pi:
    # Fire on: a manual dispatch, OR the EXACT `work-this` label freshly applied to a leaf
    # issue. The exact-label check is what stops a re-fire loop when the worker adds its own
    # labels (status:in-progress) mid-run (#535). Anything else → no run.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'work-this')
    runs-on: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    # No `id-token` — pi uses a provider key, not OIDC. The write scopes are for the
    # Harness App token minted below, which pi uses to push/PR/comment.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # ── PUSH PATH (#1004 piece 1) — mint a Harness App token so pi's pushes CASCADE ──
      # Same app as automerge-epic-subpr.yml. A GITHUB_TOKEN push would NOT re-trigger
      # downstream workflows (#572); an App-installation token does.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}   # writes the App token into the git remote → pushes cascade

      # ── BOT-ACTOR GUARD (#1004 piece 2) — re-expresses claude-code-action's `allowed_bots` ──
      # The claude flow passes `allowed_bots: "nuxt-harness[bot]"`; pi has no such built-in, so we
      # assert it ourselves before pi runs. DORMANT under `workflow_dispatch` — the actor is the
      # human dispatcher, so the `if` skips it. On the `issues: labeled` path only the Harness App's
      # label-add (`nuxt-harness[bot]`) may drive the pipeline; any OTHER bot actor — e.g.
      # `claude[bot]`/`github-actions[bot]` re-firing from a worker's own `status:in-progress`
      # label change — is rejected here, breaking the bot re-fire loop (#457/#535). Humans pass.
      # The decision is the pure, unit-tested `botActorAllowed` (WS4 of #1685); this step is I/O
      # only — so the SHIPPED guard IS the tested function. Contract: scripts/pipeline-loop-guard.test.mjs.
      # (Placed after checkout so the script is available; the token minted above is unused if we exit.)
      - name: Bot-actor guard
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          ACTOR: ${{ github.actor }}
        run: node scripts/pipeline-loop-guard.mjs bot-guard "$ACTOR"

      # ── WS2 pipeline context (#1695) — read epic_branch/depth/epic OFF the issue body ──
      # The single-use worker has no Agent-prompt channel; the parent wrote the context into a
      # `<!-- pipeline: epic=.. depth=.. epic_branch=.. -->` block on the issue. Fetch the body via
      # github-script (the API — these self-hosted runners don't guarantee the `gh` CLI at step
      # level) so it works for BOTH the label trigger and a manual dispatch (where the body isn't in
      # the event payload), write it to a file, then parse with the tested helper — exposing
      # epic_branch as a step output so the pi prompt branches deterministically, not by grepping.
      - name: Fetch issue body
        id: body
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ inputs.issue || github.event.issue.number }}')
            const { data } = await github.rest.issues.get({ ...context.repo, issue_number })
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/issue-body.txt`, data.body || '')
      - id: ctx
        run: |
          EPIC_BRANCH="$(node scripts/pipeline-context.mjs read epic_branch < "$RUNNER_TEMP/issue-body.txt")"
          echo "epic_branch=${EPIC_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pipeline context: epic_branch='${EPIC_BRANCH:-<none → main>}'"

      - uses: pnpm/action-setup@v4
        with:
          # per-job dest — the default ~/setup-pnpm collides between the two
          # self-hosted runners on the mac mini box (ENOTEMPTY, #1255)
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Warm @fyit/* dist so the agent's `crouton init`/generate/migrate doesn't cold-build
      # ~30 packages one-at-a-time mid-run (the #1213/#1247 tax — ~15-20 min). Content-addressed
      # cache + build-all on miss; a warm cache makes this ~seconds. (#1222)
      - name: Warm @fyit package builds
        uses: ./.github/actions/warm-packages

      # Timestamp the run start so the artifact-gate distinguishes "produced this run"
      # from pre-existing comments/PRs.
      - id: t0
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Before pi runs: (1) record any pre-existing dirt (diagnostic), and (2) stash the
      # edited-file-ledger parser in RUNNER_TEMP. pi checks out a work branch off the epic branch
      # mid-run, which may not contain scripts/ — so the finish step reads the parser from the
      # stashed copy, not the (possibly-switched) working tree. (#1764/#1782, Pattern B.)
      - id: baseline
        run: |
          SCRATCH='decompose-pidev-(prompt|exec)-[0-9]+\.(txt|log)|pi-telemetry-out'
          git status --porcelain 2>/dev/null | grep -vE "$SCRATCH" | cut -c4- > "$RUNNER_TEMP/pre-pi-dirty.txt" || true
          echo "pre-pi non-scratch dirty paths: $(wc -l < "$RUNNER_TEMP/pre-pi-dirty.txt" | tr -d ' ')"
          cp scripts/pi-edited-files.mjs "$RUNNER_TEMP/pi-edited-files.mjs"
          # pi-commit-plan.mjs imports ./pi-edited-files.mjs relatively, so stash it alongside (#1849).
          cp scripts/pi-commit-plan.mjs "$RUNNER_TEMP/pi-commit-plan.mjs"

      # ── The agent: pi.dev (replaces claude-code-action) ──────────────────────────
      # GH_TOKEN = the App token → pi's `gh`/git operations (sub-issues, epic branch,
      # the worker PR) act as the Harness App and cascade. ANTHROPIC_API_KEY = the
      # funded metered key (NOT a subscription — subscription OAuth must not back CI).
      - id: pi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Everything on the Claude SUBSCRIPTION (#1669). delegate-hard still escalates,
          # but now by MODEL (sonnet → opus) on the same subscription provider — no metered
          # lane. NO ANTHROPIC_API_KEY: pi-claude-cli uses the mini's `claude` login.
          PI_MODEL: ${{ inputs.model || (github.event.label.name == 'delegate-hard' && 'claude-opus-4-6') || 'claude-sonnet-5' }}
          PI_PROVIDER: ${{ inputs.provider || 'pi-claude-cli' }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # WS2 (#1695): the integration branch parsed off the issue's pipeline block (empty → main).
          EPIC_BRANCH: ${{ steps.ctx.outputs.epic_branch }}
        run: |
          set -uo pipefail
          command -v pi >/dev/null 2>&1 || npm i -g @earendil-works/pi-coding-agent
          # The Harness App identity for any commits pi makes (so they're attributable
          # and not a masquerading human — the #862 lesson).
          git config user.name  "nuxt-harness[bot]"
          git config user.email "nuxt-harness[bot]@users.noreply.github.com"
          LOG="decompose-pidev-exec-${{ github.run_id }}.log"
          START=$(date +%s)
          # Front-load the CANONICAL operating contract (#1022) so pi does not stall-and-ask
          # while headless (the #839 failure) and follows the same non-negotiable rules a Claude
          # task-worker does. The contract text lives in ONE place — .claude/agents/pi-operating-
          # contract.md — and is `cat` into the prompt verbatim here AND in decompose-on-issue-
          # pidev.yml, so the two flows can't drift (they were byte-identical hand-maintained
          # copies before). That file is PURE PROSE by contract: no frontmatter/headers — raw-injected.
          PROMPT_FILE="decompose-pidev-prompt-${{ github.run_id }}.txt"
          cat .claude/agents/pi-operating-contract.md > "$PROMPT_FILE"
          # SINGLE-USE WORKER (#1686): implement this ONE leaf — no decompose, no sub-issues,
          # no subagents. printf (single-quoted format, %s for ISSUE) — never backticks (they'd
          # command-substitute inside the shell).
          # The integration branch is parsed OFF the issue's WS2 pipeline block by the `ctx` step
          # (#1695) and passed in as EPIC_BRANCH — the worker no longer greps the body itself. When
          # empty, branch off main. printf uses %s for every value (single-quoted format) — never
          # backticks (they'd command-substitute in the shell).
          BRANCH_INSTR="branch off main and target the PR at main"
          if [ -n "${EPIC_BRANCH:-}" ]; then
            BRANCH_INSTR="branch off the integration branch '${EPIC_BRANCH}' and target the PR THERE (not main)"
          fi
          printf 'IMPLEMENT this ONE leaf issue end-to-end. Do NOT decompose it, do NOT create sub-issues, do NOT spawn subagents — it is already a leaf. Read issue #%s (gh issue view %s), then %s. For a scaffold/generate task, RUN the crouton generator (e.g. crouton config / generate_collection) — its output IS committed for you, so do NOT hand-write generated files. Author only the inputs (schema, config) with the edit/write tools (never shell redirects or heredocs) so they are captured. Run the touched app typecheck ONCE to sanity-check (pnpm --filter <app> typecheck), but do NOT loop trying to make typecheck fully green — a harness acceptance gate typechecks the result and reports failures, so stop after your change plus one check instead of grinding on it. Do NOT run git commit and do NOT open a pull request — the workflow commits your inputs AND the generator output and opens the PR, so you never need to. If you are genuinely blocked, do NOT guess: post a top-level comment on the issue explaining the blocker and add the status:blocked label, then stop. Making no file changes and no hold is a FAILED run.\n' "$ISSUE" "$ISSUE" "$BRANCH_INSTR" >> "$PROMPT_FILE"
          # Confirmed on the mac-mini (#888): pin provider + load skills via --skill.
          # GHA runs `run:` steps with bash -e; `set -uo pipefail` above does not clear it.
          # So the instant `pi | tee` fails (pipefail), -e aborts the script BEFORE
          # RC/conclusion/exec_log are written — the artifact-gate then has no exec_log to
          # read and posts the generic "no deliverable" instead of naming the cause (the
          # #1299 billing case). Disable errexit around JUST this pipeline; PIPESTATUS[0]
          # still carries pi's real exit code. (NB: a trailing `|| true` does NOT work — it
          # runs `true` as its own pipeline, clobbering PIPESTATUS[0] to 0 and masking the
          # failure as success. Verified empirically, #1299.)
          set +e
          # --approve: trust the project so pi loads the lean .pi/settings.json CI profile AND the
          # .pi/extensions/ completion-enforcer (#1782/#1764). Without it the untrusted runner path
          # silently falls back to the global 28-extension profile (incl pi-ask-user) + ~2min startup.
          # --session-dir: write pi's session to a PER-RUN isolated dir so the finish step reads it
          # deterministically. ~/.pi/agent/sessions is shared across all 5 self-hosted runners, so a
          # "find the newest session" heuristic grabs the wrong run's session under concurrency (#1764).
          PI_SESSION_DIR="$RUNNER_TEMP/pi-session"; mkdir -p "$PI_SESSION_DIR"
          pi --print --approve --session-dir "$PI_SESSION_DIR" --provider "$PI_PROVIDER" --model "$PI_MODEL" --skill .claude/skills \
            "$(cat "$PROMPT_FILE")" 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          echo "wall=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "conclusion=$([ "$RC" -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
          # Piece 3 (exec-log adapter): hand the plain-text run log to the artifact-gate so it can
          # classify WHY a run produced nothing (pi emits no structured execution_file like claude).
          echo "exec_log=$LOG" >> "$GITHUB_OUTPUT"

      # ── FINISH — commit pi's EDITED-FILE LEDGER (Pattern B), never `git add -A` ──────────
      # pi narrates the commit and stops without emitting it (#1764), so the HARNESS owns the
      # commit. But NOT via `git add -A`: that blanket-adds tool/runtime junk (the #1786 `.pi/npm/`
      # leak — the identical failure as SWE-agent/mini-swe-agent#528's env-pinned pyproject.toml
      # and openai/codex#8548). Instead we commit EXACTLY the files pi wrote, parsed from its
      # session log's edit/write tool-calls (scripts/pi-edited-files.mjs) — the same "commit only
      # the agent's edited set" strategy Aider (fnames → per-file `git add`) and claude-code-action
      # (`commit_files` with an explicit files[]) use. New needed files are IN the set (pi created
      # them); `.pi/npm/`, node_modules, logs, lockfile churn are excluded BY CONSTRUCTION (pi
      # never edited them) — no reliance on .gitignore foreseeing them. Files a generator wrote via
      # `bash` (not an edit tool) are NOT in the ledger; they are REPORTED, never silently committed.
      - id: finish
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          EPIC_BRANCH: ${{ steps.ctx.outputs.epic_branch }}
          SINCE: ${{ steps.t0.outputs.ts }}
        run: |
          set -uo pipefail
          BASE="main"; [ -n "${EPIC_BRANCH:-}" ] && BASE="$EPIC_BRANCH"
          git config user.name  "nuxt-harness[bot]"
          git config user.email "nuxt-harness[bot]@users.noreply.github.com"
          ROOT="$(git rev-parse --show-toplevel)"

          # 1) Read THIS run's pi session (per-run --session-dir). The ledger = files pi HAND-EDITED
          #    (edit/write tools). Generator output (crouton config/generate_collection, produced via
          #    a bash/MCP tool) is NOT a write-tool path, so it never appears in the ledger — which is
          #    exactly why the old "commit only the ledger" DROPPED the generated collection (#1830).
          SESSION="$(ls -t "$RUNNER_TEMP/pi-session"/*.jsonl 2>/dev/null | head -1)"
          if [ -n "$SESSION" ] && [ -f "$SESSION" ]; then echo "pi session: $SESSION"
          else echo "::warning::no pi session in $RUNNER_TEMP/pi-session (#1764)"; fi

          # 2) CLASSIFY the working tree into two buckets (#1849): inputs = the ledger (schema/config
          #    pi authored), generated = every OTHER real change (the collection the CLI produced),
          #    MINUS the shared junk denylist. Both are committed — as two commits, so history stays
          #    granular (blame→schema, bisect→generator). `-uall` expands untracked DIRECTORIES to
          #    files, or the generated collection would be an invisible collapsed `dir/` entry.
          git status --porcelain -uall 2>/dev/null | sed 's/^...//; s/^.* -> //' | sort -u > "$RUNNER_TEMP/changed.txt" || true
          PLAN="$(node "$RUNNER_TEMP/pi-commit-plan.mjs" "${SESSION:-/nonexistent}" "$ROOT" "$RUNNER_TEMP/changed.txt" 2>/dev/null || echo '{"inputs":[],"generated":[]}')"
          printf '%s' "$PLAN" | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));const t=process.env.RUNNER_TEMP;require("fs").writeFileSync(t+"/inputs.txt",(p.inputs||[]).join("\n"));require("fs").writeFileSync(t+"/generated.txt",(p.generated||[]).join("\n"))'
          NIN="$(grep -c . "$RUNNER_TEMP/inputs.txt" 2>/dev/null || true)"; NIN=${NIN:-0}
          NGEN="$(grep -c . "$RUNNER_TEMP/generated.txt" 2>/dev/null || true)"; NGEN=${NGEN:-0}
          echo "commit plan (#1849) — inputs=$NIN generated=$NGEN"
          [ "$NIN"  -gt 0 ] && grep . "$RUNNER_TEMP/inputs.txt"    | sed 's/^/  input:     /'
          [ "$NGEN" -gt 0 ] && grep . "$RUNNER_TEMP/generated.txt" | sed 's/^/  generated: /'

          # 3) Capture BOTH buckets' content before the re-base checkout (which discards the working
          #    tree), then recreate work-<issue> off origin/$BASE — never depends on which branch pi
          #    left the tree on (#1741).
          CONTENT="$RUNNER_TEMP/commit-content"; rm -rf "$CONTENT"; mkdir -p "$CONTENT"
          cat "$RUNNER_TEMP/inputs.txt" "$RUNNER_TEMP/generated.txt" 2>/dev/null | while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -f "$p" ] && { mkdir -p "$CONTENT/$(dirname "$p")"; cp "$p" "$CONTENT/$p"; }
          done

          git fetch origin "$BASE" --quiet 2>/dev/null || true
          git checkout -f -B "work-${ISSUE}" "origin/${BASE}" 2>&1 | tail -1
          BR="work-${ISSUE}"
          TITLE="$(gh issue view "$ISSUE" --json title -q .title 2>/dev/null)"; [ -z "$TITLE" ] && TITLE="chore: implement #${ISSUE}"

          stage_bucket() { while IFS= read -r p; do [ -z "$p" ] && continue; [ -f "$CONTENT/$p" ] && { mkdir -p "$(dirname "$p")"; cp "$CONTENT/$p" "$p"; git add -- "$p"; }; done < "$1"; }

          # 4a) Commit 1 — the inputs pi authored (the "why": schema/config). Blame-able, small.
          stage_bucket "$RUNNER_TEMP/inputs.txt"
          if [ "$NIN" -gt 0 ] && ! git diff --cached --quiet; then
            git commit -q -m "$TITLE" -m "🤖 pi worker — hand-authored inputs (schema/config). Refs #${ISSUE} (#1764/#1849)"
            echo "commit 1: $NIN input file(s) — $TITLE"
          fi
          # 4b) Commit 2 — the generated/derived output (the "what the machine produced"). Separate
          #     commit so a generator regression bisects cleanly and doesn't drown the decision.
          stage_bucket "$RUNNER_TEMP/generated.txt"
          if [ "$NGEN" -gt 0 ] && ! git diff --cached --quiet; then
            git commit -q -m "generate: derived output for #${ISSUE}" -m "🤖 pi worker — generator/CLI output (e.g. crouton generate), committed separately from the inputs (#1849). Refs #${ISSUE}"
            echo "commit 2: $NGEN generated file(s)"
          fi
          N=$((NIN + NGEN))
          [ "$N" -eq 0 ] && echo "nothing to commit (no real changes vs ${BASE})"

          # 5) Push the branch. The PR opens in step 7 — AFTER the acceptance verdict is posted, so
          #    automerge sees it the instant it evaluates (no race).
          HAVE_COMMITS=0
          if [ "$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo 0)" -gt 0 ]; then
            git push -u --force origin "HEAD:${BR}" 2>&1 | tail -2; HAVE_COMMITS=1
          else
            echo "no commits ahead of ${BASE} — no PR to open"
          fi

          # 6) ACCEPTANCE GATE (#1849) — VERIFY the result, don't assert it. Typecheck the touched app,
          #    but fail ONLY on type errors INSIDE it: a Nuxt app's typecheck also surfaces PRE-EXISTING
          #    errors across the whole workspace graph (`../other-poc/…`), which are not this task's
          #    fault and MUST NOT false-block (the #1855 lesson — gadget had 0 own-errors but 8 in other
          #    pocs). A real broken deliverable (app-local errors) FAILS, and the PR opens as a DRAFT,
          #    which automerge already skips (#339) — no commit-status scope needed. NEUTRAL (non-block)
          #    when the app has no typecheck to run.
          ACCEPT="neutral"; ACCEPT_MSG="could not typecheck the touched app — not verified"
          if [ "$HAVE_COMMITS" = "1" ]; then
            APP_DIR="$(grep -hE '^(apps|pocs)/[^/]+/' "$RUNNER_TEMP/inputs.txt" "$RUNNER_TEMP/generated.txt" 2>/dev/null | sed -E 's#^((apps|pocs)/[^/]+)/.*#\1#' | sort -u | head -1)"
            if [ -n "$APP_DIR" ] && [ -f "$APP_DIR/package.json" ]; then
              PKG="$(node -p "require('./$APP_DIR/package.json').name || ''" 2>/dev/null || true)"
              HAS_TC="$(node -e "process.exit(require('./$APP_DIR/package.json').scripts?.typecheck?0:1)" 2>/dev/null && echo 1 || echo 0)"
              TC_EXIT=""; : > "$RUNNER_TEMP/acc.log"
              # Prefer the app's own typecheck script; else fall back to `nuxt typecheck` (any Nuxt app
              # can run it even without a package script — the #1859 case: a scaffolded poc had none).
              if [ "$HAS_TC" = "1" ] && [ -n "$PKG" ]; then
                echo "acceptance: pnpm --filter $PKG typecheck ($APP_DIR)"
                if pnpm --filter "$PKG" typecheck > "$RUNNER_TEMP/acc.log" 2>&1; then TC_EXIT=0; else TC_EXIT=$?; fi
              elif [ -f "$APP_DIR/nuxt.config.ts" ] || [ -f "$APP_DIR/nuxt.config.js" ]; then
                echo "acceptance: nuxt typecheck ($APP_DIR) [no typecheck script — fallback]"
                if ( cd "$APP_DIR" && npx nuxt typecheck ) > "$RUNNER_TEMP/acc.log" 2>&1; then TC_EXIT=0; else TC_EXIT=$?; fi
              fi
              if [ -n "$TC_EXIT" ]; then
                # OWN = `error TS` inside the app (no `../` escape); ANY = all TS errors (proves it RAN).
                OWN="$(grep -aE 'error TS[0-9]' "$RUNNER_TEMP/acc.log" 2>/dev/null | grep -avE '(^|[[:space:](])\.\./' | grep -c . || true)"; OWN=${OWN:-0}
                ANY="$(grep -acE 'error TS[0-9]' "$RUNNER_TEMP/acc.log" 2>/dev/null || true)"; ANY=${ANY:-0}
                if [ "$OWN" -gt 0 ]; then
                  ACCEPT="fail"; ACCEPT_MSG="${OWN} type error(s) in ${APP_DIR}"
                  echo "::error::acceptance failed for #${ISSUE} — $ACCEPT_MSG"
                  grep -aE 'error TS[0-9]' "$RUNNER_TEMP/acc.log" | grep -avE '(^|[[:space:](])\.\./' | head -15 || true
                elif [ "$TC_EXIT" = "0" ] || [ "$ANY" -gt 0 ]; then
                  # exit 0 (clean) OR non-zero only from PRE-EXISTING errors elsewhere (proof it ran).
                  ACCEPT="pass"; ACCEPT_MSG="${APP_DIR} typechecks clean"; [ "$ANY" -gt 0 ] && ACCEPT_MSG="${ACCEPT_MSG} (ignored pre-existing error(s) elsewhere)"
                else
                  # non-zero with NO TS errors at all ⇒ the typecheck failed to RUN — don't false-pass.
                  ACCEPT="neutral"; ACCEPT_MSG="typecheck could not run for ${APP_DIR} — not verified"
                fi
              fi
            fi
            echo "acceptance verdict: $ACCEPT — $ACCEPT_MSG"
          fi

          # 7) Open the PR. On a FAILED acceptance, open it as a DRAFT (automerge skips drafts, #339) —
          #    creating it draft-from-the-start avoids a race where automerge lands it before we convert.
          if [ "$HAVE_COMMITS" = "1" ]; then
            EXISTING="$(gh pr list --head "$BR" --base "$BASE" --json number -q '.[0].number' 2>/dev/null || true)"
            DRAFT_FLAG=""; [ "$ACCEPT" = "fail" ] && DRAFT_FLAG="--draft"
            if [ -z "$EXISTING" ]; then
              gh pr create $DRAFT_FLAG --base "$BASE" --head "$BR" \
                --title "$(git log -1 --format=%s)" \
                --body "$(printf 'Closes #%s\n\n🤖 Opened by the pi worker finish step (two-commit split + acceptance gate, #1764/#1849).' "$ISSUE")" 2>&1 | tail -3
            else
              # Re-dispatch: toggle the existing PR's draft state to match the new verdict.
              if [ "$ACCEPT" = "fail" ]; then gh pr ready "$EXISTING" --undo 2>&1 | tail -1 || true
              else gh pr ready "$EXISTING" 2>&1 | tail -1 || true; fi
              echo "PR #${EXISTING} already open for ${BR} (draft=$([ "$ACCEPT" = fail ] && echo yes || echo no))"
            fi
          fi

          # 8) RUN RECORD (#1849) — FACTUAL note on the PR: what landed by bucket + junk excluded +
          #    the acceptance verdict. From the commit + git + the typecheck exit, NOT pi's narration.
          PRNUM="$(gh pr list --head "$BR" --base "$BASE" --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -n "$PRNUM" ]; then
            cat "$RUNNER_TEMP/inputs.txt" "$RUNNER_TEMP/generated.txt" 2>/dev/null | sort -u | grep . > "$RUNNER_TEMP/committed.txt" || true
            EXCL="$(comm -23 <(sort -u "$RUNNER_TEMP/changed.txt" | grep .) "$RUNNER_TEMP/committed.txt" 2>/dev/null | grep -c . || true)"
            case "$ACCEPT" in
              pass) ACC_LINE="✅ **acceptance: passed** — ${ACCEPT_MSG}" ;;
              fail) ACC_LINE="🔴 **acceptance: FAILED** — ${ACCEPT_MSG}. Held: automerge won't land a red result — fix, then re-dispatch." ;;
              *)    ACC_LINE="⚠️ **acceptance: not verified** — ${ACCEPT_MSG}" ;;
            esac
            REC="$RUNNER_TEMP/run-record.md"
            {
              echo "> 🤖 **pi worker — run record** · _facts from the commit + git + typecheck, not pi's narration (#1849)_"
              echo
              echo "**Committed ${N} file(s)** onto \`${BR}\` → \`${BASE}\`:"
              echo "- 📝 inputs (hand-authored — schema/config): **${NIN}**"
              [ "$NIN" -gt 0 ] && grep . "$RUNNER_TEMP/inputs.txt" | head -20 | sed 's#^#  - `#; s#$#`#'
              echo "- ⚙️ generated (CLI/MCP output — e.g. \`crouton generate\`): **${NGEN}**"
              [ "$NGEN" -gt 0 ] && grep . "$RUNNER_TEMP/generated.txt" | head -20 | sed 's#^#  - `#; s#$#`#'
              [ "$NGEN" -gt 20 ] && echo "  - …and $((NGEN-20)) more"
              echo "- 🗑️ changed but excluded as junk (node_modules/.nuxt/.pi/…): **${EXCL}**"
              echo
              echo "$ACC_LINE"
            } > "$REC"
            gh pr comment "$PRNUM" --body-file "$REC" 2>&1 | tail -1 || true
          fi

          # 7) Verdict for the artifact-gate: pi wrote files but nothing landed on the branch = fail.
          AHEAD="$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo 0)"
          if [ "$N" -gt 0 ] && [ "$AHEAD" -eq 0 ]; then
            echo "::error::pi wrote $N file(s) but nothing landed on the branch (#1764)"
            echo "still_dirty=1" >> "$GITHUB_OUTPUT"
          else
            echo "still_dirty=0" >> "$GITHUB_OUTPUT"
          fi

      # ── Artifact-gate (#461) — PASS/FAIL logic reused from decompose-on-issue.yml ────────
      # Harness-agnostic: PASS/FAIL is GitHub-state via GITHUB_TOKEN (comment / linked
      # PR / sub-issues / status:blocked). Piece 3 (#1004) feeds it pi's PLAIN-TEXT run
      # log (`PI_EXEC_LOG`) instead of claude's structured execution_file, so the failure
      # "why" is cause-aware (billing / error / underspecified) — parity with the claude
      # flow. PASS/FAIL is unchanged either way.
      - name: Artifact-gate — fail if the agent produced nothing
        if: always()
        uses: actions/github-script@v7
        env:
          PI_EXEC_LOG: ${{ steps.pi.outputs.exec_log }}
          CLAUDE_CONCLUSION: ${{ steps.pi.outputs.conclusion }}
          # #1764: '1' only when the deterministic finish step could NOT persist pi's edits
          # (a git/tooling failure) — lets the gate name that cause instead of "underspecified".
          PI_LEFT_DIRTY: ${{ steps.finish.outputs.still_dirty }}
          ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
          TRIGGER: ${{ github.event_name }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER)
            const since = '${{ steps.t0.outputs.ts }}'
            const sinceMs = new Date(since).getTime()

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, since,
            })
            const newComment = comments.length > 0

            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              ...context.repo, issue_number,
            })
            const prRefs = timeline.filter(e =>
              e.event === 'cross-referenced' &&
              e.source && e.source.issue && e.source.issue.pull_request
            )
            const linkedPR = prRefs.some(e => new Date(e.created_at).getTime() >= sinceMs)
            // NOTE (#1019): we deliberately do NOT treat a pre-existing cross-referenced PR as
            // a pass. On #839 an UNRELATED epic PR (#846) merely cross-referenced the issue and
            // false-greened a no-op run. A fresh-work run must yield a FRESH deliverable (a PR
            // opened this run / sub-issues created this run / a sign-off held this run) or a
            // genuinely closed issue — not a stale link. `alreadyLinkedPR` is intentionally unused.

            const issue = await github.rest.issues.get({ ...context.repo, issue_number })
            const blocked = issue.data.labels.some(l => (typeof l === 'string' ? l : l.name) === 'status:blocked')
            const alreadyClosed = issue.data.state === 'closed'

            let createdSubIssues = false
            try {
              const subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                ...context.repo, issue_number, per_page: 100,
              })
              createdSubIssues = subs.some(s => new Date(s.created_at).getTime() >= sinceMs)
            } catch (e) { core.warning(`sub-issue check skipped: ${e.message}`) }

            const signoffHeld = blocked && newComment
            if (linkedPR || signoffHeld || alreadyClosed || createdSubIssues) {
              core.info(`Artifact-gate OK for #${issue_number}: linkedPR=${linkedPR} signoffHeld=${signoffHeld} alreadyClosed=${alreadyClosed} createdSubIssues=${createdSubIssues}`)
              // Result-comment-back (#1017) — only on a label-triggered run (a human is watching the
              // issue). This comment posts as the Harness App (nuxt-harness[bot]) — an unmistakable
              // bot account — so it uses the agent-pipeline provenance header, NOT the @pmcp disclaimer.
              if (process.env.TRIGGER === 'issues') {
                const freshPR = prRefs
                  .filter(e => new Date(e.created_at).getTime() >= sinceMs)
                  .map(e => e.source.issue.number)[0]
                const what = freshPR
                  ? `done → PR #${freshPR}`
                  : (createdSubIssues ? 'decomposed → sub-issues created (see the tree)'
                    : signoffHeld ? 'held for sign-off (`status:blocked` + a review)'
                    : 'produced a deliverable — see the run')
                await github.rest.issues.createComment({
                  ...context.repo, issue_number,
                  body: `> 🤖 **pi.dev harness** · agent pipeline (CI · mac-mini) · _via the \`${context.payload.label?.name || 'delegate'}\` label_\n\n${what}`,
                })
              }
              return
            }

            // ── CHILD deliverables (#1074) ─────────────────────────────────────────────
            // When the labeled issue is ALREADY decomposed, the correct behaviour is
            // "resume the tree, work the remaining open leaf" — the fresh deliverable
            // lands on a CHILD issue, invisible to the checks above (the #1050 false-fail:
            // pi merged a real PR on child #1053 and this gate still went red). Scan the
            // sub-issue tree for the same fresh-since-t0 signals. Only runs when the
            // primary checks found nothing. Kept in sync with decompose-on-issue.yml.
            let childDeliverable = ''
            try {
              const subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                ...context.repo, issue_number, per_page: 100,
              })
              for (const s of subs) {
                if (s.state === 'closed' && s.closed_at && new Date(s.closed_at).getTime() >= sinceMs) {
                  childDeliverable = `child #${s.number} closed this run`; break
                }
                const tl = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  ...context.repo, issue_number: s.number,
                })
                if (tl.some(e => e.event === 'cross-referenced' && e.source && e.source.issue &&
                    e.source.issue.pull_request && new Date(e.created_at).getTime() >= sinceMs)) {
                  childDeliverable = `PR linked to child #${s.number} this run`; break
                }
                const childBlocked = (s.labels || []).some(l => (typeof l === 'string' ? l : l.name) === 'status:blocked')
                if (childBlocked) {
                  const cc = await github.paginate(github.rest.issues.listComments, {
                    ...context.repo, issue_number: s.number, since,
                  })
                  if (cc.length > 0) { childDeliverable = `child #${s.number} held for sign-off this run`; break }
                }
              }
            } catch (e) { core.warning(`child-deliverable check skipped: ${e.message}`) }
            if (childDeliverable) {
              core.info(`Artifact-gate OK for #${issue_number} via child deliverable: ${childDeliverable}`)
              if (process.env.TRIGGER === 'issues') {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number,
                  body: `> 🤖 **pi.dev harness** · agent pipeline (CI · mac-mini) · _via the \`${context.payload.label?.name || 'delegate'}\` label_\n\nresumed the existing tree → ${childDeliverable}`,
                })
              }
              return
            }

            // ── Classify WHY there was no deliverable (#1004 piece 3) ──────────────────
            // pi emits no structured execution_file like claude-code-action — it emits the
            // plain-text run log we tee'd to PI_EXEC_LOG. Grep it for the known causes so the
            // failure comment names the actual problem + fix (mirrors decompose-on-issue.yml's
            // billing/error/underspecified buckets). The most likely first-run cause is an
            // out-of-credit PI_PROVIDER_KEY, so detect that explicitly.
            const fs = require('fs')
            let why = '', action = '', detail = ''
            const failed = process.env.CLAUDE_CONCLUSION === 'failure'
            try {
              const logFile = process.env.PI_EXEC_LOG
              if (logFile && fs.existsSync(logFile)) {
                const log = fs.readFileSync(logFile, 'utf8')
                const tail = log.length > 600 ? log.slice(-600) : log
                // GLM Coding Plan quota (z.ai) — checked FIRST: its 429 is distinct from an
                // Anthropic billing failure and must not fall through to the generic SDK-error
                // bucket (the #1451/#1492 misdiagnosis). z.ai emits `429 {"code":"1308",
                // "message":"Usage limit reached for 5 hour. Your limit will reset at <ts>"}`.
                const glmReset = (log.match(/reset at ([0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:]+)/i) || [])[1]
                if (/\b1308\b|usage limit reached/i.test(log)) {
                  why = 'the GLM Coding Plan quota was reached mid-run'
                    + (glmReset ? ` (the plan window resets at ${glmReset})` : ' (z.ai 5-hour / weekly window)')
                  action = 'wait for that window to reset then re-dispatch on GLM (free), '
                    + 'or escalate this one leaf to the metered `provider=anthropic` lane to unblock now — '
                    + 'this is NOT a code/SDK bug, nothing is broken'
                } else if (/credit balance is too low|insufficient.*(credit|balance|quota)|billing/i.test(log)) {
                  why = 'the Anthropic key (`PI_PROVIDER_KEY`) is out of credit'
                  action = 'top up the account, then re-dispatch' // NB: not "enable auto-reload" — owner declined it (#1327); the pi-key-canary workflow tracks key health
                } else if (process.env.PI_LEFT_DIRTY === '1') {
                  // #1764: pi edited files but the DETERMINISTIC finish step still could not
                  // persist them — a git/tooling failure, not the narrate-then-stop fault (which
                  // the finish step handles). Name it accurately, not "underspecified".
                  why = 'the deterministic finish step could not persist pi\'s edits (a git/tooling failure, not the narrate-then-stop fault) — the working tree is still dirty (#1764)'
                  action = 'open the run log — the finish step logged the git error; this is NOT an underspecified issue (see #1764)'
                } else if (failed) {
                  why = 'the pi agent step errored before it built anything'
                  action = 'open the run log, fix the SDK/tooling error, then re-dispatch'
                  if (tail.trim()) detail = tail.trim()
                } else {
                  why = 'pi finished without opening a PR, creating sub-issues, or holding for sign-off'
                  action = 'the issue is likely underspecified — add a concrete description + acceptance criteria, then re-dispatch'
                }
              }
            } catch (e) { core.warning(`artifact-gate: could not read pi run log: ${e.message}`) }

            // #1764 fallback — an uncommitted tree is a definite cause even if the log is unreadable.
            if (!why && process.env.PI_LEFT_DIRTY === '1') {
              why = 'the deterministic finish step could not persist pi\'s edits — the working tree is still dirty (#1764)'
              action = 'open the run log for the finish step git error; not an underspecified issue (see #1764)'
            }

            // Fallback when the log is unreadable but the step itself failed.
            if (!why && failed) {
              why = 'the pi agent step failed before producing anything (likely out of credit, or an API/tooling error)'
              action = 'open the run log — if it says "credit balance is too low", top up `PI_PROVIDER_KEY`; otherwise fix the logged error, then re-dispatch'
            }

            // Readable-on-mobile (epic #1336, .github/CI-MESSAGE-STYLE.md): lead with the problem
            // + the one fix; the gate name / #461 / run link live in the footer; depth collapses.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const foot = `\n\n<sub>🤖 pi.dev harness (CI · mac-mini) · artifact-gate #461 fails a no-op run so it isn't mistaken for done · <a href="${runUrl}">run log</a></sub>`
            const det = detail ? `\n\n<details><summary>log tail</summary>\n\n\`\`\`\n${detail}\n\`\`\`\n</details>` : ''
            const body = why
              ? `🔴 **@pmcp — this run produced nothing: ${why}.**\n\n**Fix:** ${action}.${det}${foot}`
              : `🔴 **@pmcp — this run produced nothing** — no PR, no sub-issues, no sign-off hold.\n\n**Fix:** re-dispatch; if it recurs the issue is underspecified — add a description + acceptance criteria.${foot}`

            await github.rest.issues.createComment({ ...context.repo, issue_number, body })
            core.setFailed(`Artifact-gate: pi.dev run on #${issue_number} produced no deliverable.`)

      # ── Telemetry convergence capture (#944) — REAL data from this pi run ──────────
      # Proves the "one feed → both consumers" loop on a live run: locate this run's pi
      # subagent telemetry (~/.pi/agent/sessions/.../subagent-artifacts) and run the
      # adapter to emit BOTH a Loop Station WS2 trace AND the #883 ledger-row slice.
      # Non-fatal + artifact-only on purpose: it must never fail the headline code-writing
      # proof, and committing rows to the ledger file from CI is a separate follow-up — here
      # we surface them as an artifact + in the log so the convergence is verifiable.
      - name: Capture pi telemetry → WS2 trace + #883 ledger slice (artifacts; non-fatal)
        if: always()
        env:
          SINCE: ${{ steps.t0.outputs.ts }}
        run: |
          set +e
          mkdir -p pi-telemetry-out
          SESS_ROOT="$HOME/.pi/agent/sessions"
          # The most-recently-modified subagent-artifacts dir MODIFIED DURING THIS RUN (#1019):
          # `-newermt "$SINCE"` scopes to dirs touched at/after the run-start timestamp, so we
          # never mis-attribute a PRIOR run's telemetry (the #839 stale-row bug). `-newermt`
          # works on both BSD find (the mac-mini) and GNU find (ubuntu fallback).
          TELE_DIR="$(find "$SESS_ROOT" -type d -name subagent-artifacts -newermt "$SINCE" 2>/dev/null \
            | xargs -I{} stat -f '%m {}' {} 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)"
          if [ -z "$TELE_DIR" ]; then
            TELE_DIR="$(find "$SESS_ROOT" -type d -name subagent-artifacts -newermt "$SINCE" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)"
          fi
          if [ -n "$TELE_DIR" ] && [ -d "$TELE_DIR" ]; then
            echo "pi telemetry dir: $TELE_DIR"
            node .claude/skills/loop-station/pi-telemetry.mjs "$TELE_DIR"          > pi-telemetry-out/pi-trace.jsonl  2>/dev/null
            node .claude/skills/loop-station/pi-telemetry.mjs "$TELE_DIR" --ledger > pi-telemetry-out/ledger-rows.jsonl 2>/dev/null
            echo "── #883 ledger-row slice from THIS pi run (model · cost · turns · wall) ──"
            cat pi-telemetry-out/ledger-rows.jsonl || true
          else
            echo "no pi subagent telemetry found — a decompose-only run (sub-issues, no worker) writes none. Skipping."
          fi

      - name: Upload pi telemetry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-telemetry-${{ github.run_id }}
          path: pi-telemetry-out/
          if-no-files-found: ignore
