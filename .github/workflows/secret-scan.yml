# layer: harness
name: Secret scan

# #2376 — this repo is PUBLIC, and three working logins sat in it for months (#2356):
# gitleaks' default rules catch API keys and tokens, not a password written as a plain
# value. `.gitleaks.toml` adds the rules for that, plus allowlists for test fixtures,
# translations and documented examples. Scans only the commits a PR (or a push to main)
# adds — the history still holds the old, now-dead passwords — and redacts every value,
# so a finding never re-publishes the secret in these public logs.
#
# Report-only until the repo variable SECRET_SCAN_ENFORCE is 'true'; then a finding fails
# the check. A deliberate, harmless line can carry an inline `gitleaks:allow` + reason.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned release + checksum (no third-party action: gitleaks-action needs a paid
      # licence for organisation repos; the CLI itself is MIT).
      - name: Install gitleaks
        run: |
          V=8.28.0
          SHA=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          ENFORCE: ${{ vars.SECRET_SCAN_ENFORCE }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "Scanning ${RANGE}"
          /tmp/gitleaks git . --no-banner --redact -c .gitleaks.toml \
            --log-opts="--no-merges ${RANGE}" \
            --report-format json --report-path findings.json --exit-code 0
          COUNT="$(jq 'length' findings.json)"
          if [ "$COUNT" = "0" ]; then
            echo "### ✅ Secret scan: nothing found in ${RANGE}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LEVEL=warning; [ "$ENFORCE" = "true" ] && LEVEL=error
          jq -r --arg lvl "$LEVEL" '.[] | "::\($lvl) file=\(.File),line=\(.StartLine),title=Possible secret (\(.RuleID))::Commit \(.Commit[0:7]): \(.Description). Remove it, or mark a deliberate line with `gitleaks:allow` + reason (#2376)."' findings.json
          {
            echo "### ⚠️ Secret scan: ${COUNT} possible secret(s) in ${RANGE}"
            echo ""
            echo "| File | Line | Rule | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| `\(.File)` | \(.StartLine) | \(.RuleID) | \(.Commit[0:7]) |"' findings.json
            echo ""
            echo "Values are redacted. A real secret is already public once pushed: rotate it, then remove it."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENFORCE" = "true" ]; then exit 1; fi
          echo "Report-only (SECRET_SCAN_ENFORCE is not 'true') — not failing the check."
