# layer: stack
name: Sync Changelogs

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        # `docs`, NOT `apps/docs` — #164 relocated the docs site to the top level on
        # 2026-06-15 and this was missed, so every run failed for seven weeks (#1943).
        working-directory: docs

    steps:
      # Push with the Harness App, not GITHUB_TOKEN — this job commits to `main`, which
      # the ruleset rejects for a GITHUB_TOKEN push (#1133). See loop-station-inventory.yml.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0 # full history so the commit-back rebases cleanly

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # per-job dest — the default ~/setup-pnpm collides between the two
          # self-hosted runners on the mac mini box (ENOTEMPTY, #1255)
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Run changelog sync
        run: npx tsx scripts/sync-changelogs.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/changelog-releases.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/changelog-releases.json
          git commit -m "chore(docs): sync changelog releases [skip ci]"
          # Rebase onto any concurrent main movement, then push — same loop the
          # loop-station jobs use. A bare `git push` loses the race whenever a PR
          # merges during the run ("! [rejected] main -> main (fetch first)", #1943);
          # this job rewrites the whole data file, so a race is likely, not rare.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying…"; sleep $((2 ** i))
          done
          exit 1
