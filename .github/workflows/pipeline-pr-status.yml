name: Pipeline PR status

# Always-on status for the agent pipeline (#337, epic #336). Deterministic, NO LLM:
# keep exactly ONE "sticky" status comment on each pipeline PR (head branch
# `claude/issue-*`), edited in place across runs — never a new comment per run — plus a
# single roll-up line on the parent epic so the whole tree's health reads at a glance.
#
# The sticky is found by a hidden HTML marker and updated; the epic roll-up by its own
# marker on the epic issue. Both are idempotent, so the high-frequency `check_suite`
# firing just refreshes the same two comments (no spam).
#
# Scope: only PRs whose HEAD branch is pipeline-authored — `claude/issue-*` (the claude
# pipeline) OR `work-*` (the pi worker, #1815). Human PRs are never touched. Uses
# GITHUB_TOKEN (it only writes comments; nothing here needs to cascade to another workflow,
# so no App token is required).

on:
  # ⚠️ `check_suite` and `status` are NEARLY DEAD TRIGGERS here (#1884) — keep them for
  # App-generated suites, but they do NOT fire for our own CI. Every check on a pipeline PR is
  # created by GitHub Actions under GITHUB_TOKEN, and events triggered by GITHUB_TOKEN never
  # start a new workflow run (the same recursion guard that stops a GITHUB_TOKEN push from
  # cascading, #572/#626). So the only trigger that ever fired was `pull_request: opened`, and
  # since the pi worker pushes exactly once there is no `synchronize` either: the sticky was
  # written ~10s after the PR opened and FROZE there. Every worker PR carried a permanent
  # "⏳ CI running · 2/11 checks passed" while it was in fact green and mergeable — the one
  # surface meant to say "ready" saying the opposite, forever.
  #
  # `workflow_run` is the trigger that DOES fire for Actions-generated completions, so it is
  # what actually refreshes the sticky. Add a workflow here when it becomes a gate worth
  # reflecting; an unlisted one simply doesn't trigger a refresh (the next listed one will).
  workflow_run:
    workflows: ["CI", "E2E", "Frontend Review (PR)", "A11y (PR)", "Red-Team (PR)", "Packages guard"]
    types: [completed]
  check_suite:
    types: [completed]
  status: {}
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Refresh the epic's live card on the build-progress transitions PR/check events miss —
  # a child issue closing (schedule-waves closes it when its sub-PR merges) advances the
  # done/total count (#1838). Scoped to closed/reopened so we don't fire on every repo label change.
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Key by head SHA (PR/check events) or issue number (issues events) so concurrent refreshes for
# the SAME target collapse to one (each run recomputes full state, so the latest wins); distinct
# targets never cancel each other.
#
# ⚠️ `cancel-in-progress` MUST stay false here (#1989). This group is keyed by the very SHA this
# workflow reports ON, and a cancelled run leaves a check-run named `status` attached to that SHA.
# Both readers treat `cancelled` as red — this file's own `ciState()` (:92) and, fatally,
# `automerge-epic-subpr.yml`'s RED list (:89) — so self-cancellation marked the commit red and
# every pipeline sub-PR silently stopped auto-merging into its epic, while a 🔴 ping told the
# owner to go fix code that was never broken (observed on PR #1987).
# The other cancelling workflows (a11y, frontend-review, red-team, simplify-review,
# skill-freshness-pr) key on the PR *number*, so their cancelled run belongs to the superseded
# SHA and is harmless — do NOT "align" this one back to them.
# Queueing instead is safe: each run recomputes full state, so the last to finish still wins.
concurrency:
  group: pipeline-status-${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.event.pull_request.head.sha || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          OWNER_LOGIN: ${{ vars.PIPELINE_OWNER || 'pmcp' }}
        with:
          script: |
            const { owner, repo } = context.repo
            const OWNER = process.env.OWNER_LOGIN || 'pmcp'
            const PR_STICKY = '<!-- crouton-pipeline-status -->'
            const EPIC_ROLLUP = '<!-- crouton-epic-rollup -->'
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16) + 'Z'

            // Upsert a marker-tagged comment: edit the existing one in place, else create.
            async function upsert(issue_number, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 })
              const existing = comments.find(c => (c.body || '').includes(marker))
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body })
              }
            }

            // Aggregate every check-run + commit-status for a SHA into one verdict.
            async function ciState(ref) {
              let success = 0, pending = 0, failure = 0
              const failing = [] // #1909 — the ping must say WHICH checks, not just how many
              const runs = await github.paginate(github.rest.checks.listForRef,
                { owner, repo, ref, per_page: 100 })
              for (const r of runs) {
                if (r.status !== 'completed') { pending++; continue }
                if (['success', 'neutral', 'skipped'].includes(r.conclusion)) success++
                else { failure++; failing.push({ name: r.name, id: r.id }) } // failure, cancelled, timed_out, action_required, stale
              }
              try {
                const combined = (await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref })).data
                for (const s of combined.statuses || []) {
                  if (s.state === 'pending') pending++
                  else if (s.state === 'success') success++
                  else { failure++; failing.push({ name: s.context }) } // error, failure — a commit status carries no annotations
                }
              } catch (e) { core.warning(`combined status for ${ref}: ${e.message}`) }
              const total = success + pending + failure
              let icon = '⏳', word = 'pending'
              if (total === 0) { icon = '⏳'; word = 'queued' }
              else if (failure > 0) { icon = '❌'; word = 'failing' }
              else if (pending > 0) { icon = '⏳'; word = 'running' }
              else { icon = '✅'; word = 'passing' }
              return { icon, word, success, pending, failure, total, failing }
            }

            // One sticky status note on the pipeline PR.
            async function updatePr(pr) {
              const st = await ciState(pr.head.sha)
              const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name))
              const fix = labels.map(l => /^ci-fix-attempts:(\d+)$/.exec(l)).find(Boolean) // forward-compat with #338
              const parts = [`${st.success}/${st.total} checks passed`]
              if (st.pending) parts.push(`${st.pending} running`)
              if (st.failure) parts.push(`${st.failure} failing`)
              const body =
                `${PR_STICKY}\n` +
                `### ${st.icon} CI ${st.word}\n` +
                `${parts.join(' · ')}.` +
                (fix ? ` · 🔧 auto-fix ×${fix[1]}` : '') + `\n\n` +
                `<sub>🤖 agent pipeline (#337) · \`${pr.head.ref}\` → \`${pr.base.ref}\` · ` +
                `<a href="${pr.html_url}/checks">checks</a> · updated ${now}</sub>`
              await upsert(pr.number, PR_STICKY, body)
              if (st.word === 'failing') await pingOnRed(pr, st)
              const epicMatch = /^epic\/(\d+)-/.exec(pr.base.ref)
              if (epicMatch) await updateEpic(Number(epicMatch[1]))
            }

            // One-shot @mention on a fresh failure — the ONLY loud signal (#1815). A red pipeline
            // PR won't auto-merge into its epic (automerge-epic-subpr.yml leaves it open), so it
            // needs the owner. Keyed by head SHA so a re-fired check_suite for the SAME commit
            // never re-pings; a new failing commit (new SHA) does. Mentions don't fire on comment
            // EDITS, so this is a distinct create guarded by the SHA marker (never the sticky).
            async function pingOnRed(pr, st) {
              const marker = `<!-- ci-fail-ping:${pr.head.sha} -->`
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number: pr.number, per_page: 100 })
              // Already pinged this SHA? The @MENTION stays one-shot (a mention doesn't re-fire on
              // an edit, so re-creating would be pure spam) — but the BODY is refreshed below if
              // more checks have gone red since (#2029). Checks finish minutes apart: on PR #2025
              // the ping fired naming one failure and `Type Check Apps` went red 42s later, so the
              // owner was left reading a permanently understated count while the sticky comment
              // said three. A stale loud signal is worse than a quiet accurate one.
              const existing = comments.find(c => (c.body || '').includes(marker))
              // Name the failing checks (#1909) AND quote what actually went wrong (#2015).
              // Names alone still meant leaving the notification, opening the checks tab, picking
              // a job and scrolling a log — on a phone that is the entire task.
              //
              // `CI Gate` is the AGGREGATE (`if: always()` over 14 needs). It is never an
              // independent cause; naming it beside the real failure doubles the apparent problem
              // and sends the reader to a log that only says "not every job succeeded". Drop it
              // whenever something else is red — but keep it when it is the ONLY red check, since
              // that means something genuinely different (a needed job cancelled or stuck).
              const ROLLUP = 'CI Gate'
              const all = st.failing || []
              const causes = all.length > 1 ? all.filter(f => f.name !== ROLLUP) : all
              const names = causes.slice(0, 5)
              const more = causes.length - names.length
              const list = names.length
                ? names.map(f => `\`${f.name}\``).join(', ') + (more > 0 ? ` +${more} more` : '')
                : 'see the checks tab'

              // The distilled failure: a step's `::error::` output becomes a check-run annotation,
              // which is already the short form of the log. Two per check, truncated — enough to
              // diagnose, collapsed so the notification itself stays scannable.
              //
              // FILTER BY LEVEL (#2029). `listAnnotations` returns `notice`/`warning`/`failure`
              // together, in creation order — and CI emits its noise first (the Node-20
              // deprecation notice, "no files found for playwright-report/"). Taking the first two
              // of ANY level therefore quoted two things that did not fail, under a heading that
              // said "what failed". Fetch a page, keep the failures. Fall back to any level only
              // when a check produced no failure annotation at all, and say so, so a reader is
              // never told a warning is the cause.
              const excerpts = []
              for (const f of names) {
                if (!f.id) continue // a commit status has no annotations
                try {
                  const anns = (await github.rest.checks.listAnnotations(
                    { owner, repo, check_run_id: f.id, per_page: 50 })).data
                  const hard = anns.filter(a => a.annotation_level === 'failure')
                  const use = hard.length ? hard : anns
                  const label = hard.length ? f.name : `${f.name} (no error annotation — showing context)`
                  for (const a of use.slice(0, 2)) {
                    const msg = String(a.message || '').trim().slice(0, 400)
                    if (msg) excerpts.push(`${label}: ${msg}`)
                  }
                } catch (e) { core.warning(`annotations for ${f.name}: ${e.message}`) }
              }
              const why = excerpts.length
                ? `\n\n<details><summary>what failed</summary>\n\n\`\`\`\n${excerpts.join('\n\n')}\n\`\`\`\n</details>`
                : ''
              const body =
                `${marker}\n` +
                `🔴 **@${OWNER} — CI failed on this pipeline PR** (${causes.length} failing ` +
                `check${causes.length === 1 ? '' : 's'}): ${list}.${why}\n\n` +
                `**What's needed:** read the failure, then either push a fix to \`${pr.head.ref}\` ` +
                `or reply here saying why it isn't yours. A red sub-PR won't auto-merge into its ` +
                `epic, so it sits until one of those happens — **it does not mean the work is ` +
                `finished and waiting on your approval**.\n\n` +
                `[Checks](${pr.html_url}/checks) · \`${pr.head.ref}\` → \`${pr.base.ref}\`.\n\n` +
                `<sub>🤖 agent pipeline (CI) · failure notify (#1815/#1909)</sub>`
              if (existing) {
                if ((existing.body || '').trim() === body.trim()) return // nothing new to say
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
                core.info(`Refreshed the red ping on #${pr.number} (${causes.length} failing now).`)
                return
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
              core.info(`Pinged @${OWNER} on red #${pr.number} (${pr.head.sha.slice(0, 7)}).`)
            }

            // A live flow-status CARD on the epic (#1838) — stage + child tree + current activity,
            // computed deterministically from sub-issue state + each child's work-<n> PR. Replaces
            // the old thin count line. Renders even with 0 children (the sign-off / decompose stages).
            async function updateEpic(epicNumber) {
              let subs = []
              try {
                subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                  { owner, repo, issue_number: epicNumber, per_page: 100 })
              } catch (e) { core.warning(`sub-issues for #${epicNumber}: ${e.message}`) }

              let epic
              try { epic = (await github.rest.issues.get({ owner, repo, issue_number: epicNumber })).data }
              catch (e) { core.warning(`epic #${epicNumber}: ${e.message}`); return }
              const names = x => (x.labels || []).map(l => (typeof l === 'string' ? l : l.name))
              const epicBlocked = names(epic).includes('status:blocked')
              const title = (epic.title || '').replace(/^(Epic|Initiative):\s*/i, '').trim()

              const total = subs.length
              const done = subs.filter(s => s.state === 'closed').length

              // Newest work-<n> PR for a child (bounded — a handful of children per epic).
              async function childPr(n) {
                try {
                  const prs = await github.paginate(github.rest.pulls.list,
                    { owner, repo, state: 'all', head: `${owner}:work-${n}`, per_page: 10 })
                  return prs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null
                } catch { return null }
              }

              // Child tree lines.
              const lines = []
              for (const s of subs) {
                let icon = '⏳', note = 'queued'
                if (s.state === 'closed') { icon = '✅'; note = '' }
                else if (names(s).includes('status:blocked')) { icon = '⏸️'; note = 'held' }
                else {
                  const pr = await childPr(s.number)
                  if (pr && pr.merged_at) { icon = '✅'; note = `PR #${pr.number} merged` }
                  else if (pr && pr.state === 'open') { icon = '🔨'; note = `PR #${pr.number}` }
                }
                lines.push(`- ${icon} #${s.number} ${s.title}${note ? ` — ${note}` : ''}`)
              }

              // Stage: 0 children + blocked ⇒ sign-off · 0 + open ⇒ decomposing · some open ⇒ build ·
              // all closed ⇒ assembled/review.
              const stages = ['sign-off', 'build', 'assemble', 'review']
              const curIdx = total === 0 ? (epicBlocked ? 0 : 0) : (done < total ? 1 : 2)
              const bar = stages.map((s, i) => i === curIdx ? `**${s}** ◀` : i < curIdx ? `${s} ✓` : s).join(' → ')

              let head, activity
              if (total === 0) {
                head = epicBlocked ? `## 🎨 Awaiting your sign-off — ${title}` : `## ⏳ Decomposing — ${title}`
                activity = epicBlocked ? '_now: waiting for your `lgtm` / answer on the design_' : '_now: the decomposer is planning this epic_'
              } else if (done < total) {
                head = `## 🔨 Building — ${title}  (${done}/${total})`
                activity = `_now: ${total - done} of ${total} in flight — reply here or on a PR to steer_`
              } else {
                head = `## ✅ Assembled — ${title}  (${total}/${total})`
                activity = '_now: all children merged — the epic→main PR opens for your review next_'
              }

              const body =
                `${EPIC_ROLLUP}\n` +
                `${head}\n\n` +
                `\`${bar}\`\n\n` +
                (lines.length ? lines.join('\n') + '\n\n' : '') +
                `${activity}\n\n` +
                `<sub>🤖 agent pipeline · live status (#1838) · updated ${now}</sub>`
              await upsert(epicNumber, EPIC_ROLLUP, body)
            }

            // ── issues event (#1838): a child closed/reopened → refresh its epic's card ──
            // Resolve the epic: the issue itself if it has sub-issues, else its parent via the
            // WS2 pipeline block (`<!-- pipeline: epic=N … -->`) in the body.
            if (context.eventName === 'issues') {
              const issue = context.payload.issue
              let epicNum = null
              try {
                const own = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                  { owner, repo, issue_number: issue.number, per_page: 1 })
                if (own.length) epicNum = issue.number
              } catch (e) { /* not an epic */ }
              if (!epicNum) {
                const m = /epic=(\d+)/.exec(issue.body || '')
                if (m) epicNum = Number(m[1])
              }
              if (epicNum) { await updateEpic(epicNum); core.info(`Refreshed epic card #${epicNum} (issues:${context.payload.action}).`) }
              else core.info(`#${issue.number} is not a pipeline epic/child — nothing to do.`)
              return
            }

            // Resolve candidate PR numbers from whatever event fired.
            const prNumbers = new Set()
            if (context.eventName === 'pull_request') {
              prNumbers.add(context.payload.pull_request.number)
            } else {
              // `workflow_run` first — it is the only one of the three that actually fires for
              // our Actions-generated checks (#1884). It also carries `pull_requests`, but that
              // array is empty for a run from a fork, so resolve by head SHA like the others.
              const sha = context.payload.workflow_run?.head_sha
                || context.payload.check_suite?.head_sha
                || context.payload.sha
              if (sha) {
                const assoc = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: sha, per_page: 100 })
                assoc.forEach(p => prNumbers.add(p.number))
              }
            }
            if (!prNumbers.size) { core.info('No associated PRs — nothing to do.'); return }

            for (const pull_number of prNumbers) {
              let pr
              try { pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data } catch { continue }
              if (pr.state !== 'open') continue
              // Pipeline-authored branches: the old claude pipeline (`claude/issue-*`) AND the pi
              // pipeline (`work-*`). The pi branches were silently skipped before #1815, so no pi
              // worker PR ever got a status note — the main reason the owner saw no signal at all.
              const isPipeline = pr.head.ref.startsWith('claude/issue-') || pr.head.ref.startsWith('work-')
              if (!isPipeline) {
                core.info(`#${pull_number} head ${pr.head.ref} is not a pipeline branch — skipping.`); continue
              }
              await updatePr(pr)
              core.info(`Updated sticky status for #${pull_number}.`)
            }
