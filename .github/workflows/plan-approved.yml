name: Build from approved plan (pi.dev)

# #2757 (epic #2754) — the plan reviewer (plan-review.yml, #2756) labels an issue `plan:approved`;
# this dispatches the BUILD run with that plan's comment id, so the worker implements exactly the
# approved plan (work-issue-pidev.yml, input `plan`). The label is applied by the Harness App, so
# it cascades; a human label is ignored here (only the reviewer's approval starts a build).
#
# Workflow-change: new workflow closing the plan → review → build loop (#2757).

on:
  issues:
    types: [labeled]

jobs:
  build:
    if: ${{ github.event.label.name == 'plan:approved' && github.actor == 'nuxt-harness[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Dispatch the build with the approved plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HANDOFF_FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The plan the reviewer approved = the newest plan comment (a sent-back plan is replaced).
          # Read + dispatch are ONE hand-off: a limit / 5xx on either is saved and replayed (#3306).
          node scripts/handoff-exec.mjs plan-build "$(jq -nc --argjson i "$ISSUE" '{issue:$i}')"
