name: Epic postmortem
run-name: "${{ github.event_name == 'workflow_dispatch' && format('postmortem #{0}', inputs.epic) || 'Epic postmortem' }}"

# (#3425) When an epic is done, the pipeline writes its postmortem itself, following
# .claude/skills/postmortem/SKILL.md, and posts it with `<!-- postmortem:done epic=#N -->`.
# Decisions live in scripts/postmortem.mjs (pure, tested) + scripts/postmortem-run.mjs (I/O).
#
# Started by:
#   on-pr-close.yml   an epic/<N>-… → main PR merged           (workflow_call, head_ref)
#   on-issue-close.yml  a sub-issue closed (its parent is the epic) (workflow_call, closed_issue)
#   /close-epic, when the postmortem is missing (workflow_dispatch, through handoffGuard). It leaves
#     a pipeline-authored close-pending marker; `post` closes the epic once the postmortem lands.
#   the test card's `ok` (workflow_dispatch through handoffExec, #3012) — always, so the close below
#     runs on the App token.
#   by hand: dispatch with `epic` (catch-up / retry; runs even after a skipped run).
#
# AUTO-CLOSE (#3012): the `auto-close` job runs after every start (merge, sub-issue close, the card's
# `ok`, a posted postmortem) and closes the epic by itself once ALL hold: merged to main, its test
# card ok'd (or it never gets one), its postmortem posted. Decision: scripts/epic-auto-close.mjs.
#
# NEVER BLOCKS: if the model run fails or writes nothing usable, `post` still runs and posts
# `<!-- postmortem:skipped epic=#N -->` with the run link, and a waiting close still happens.
#
# ONE RUN PER EPIC: starts for one epic queue on `write`'s concurrency group. GitHub keeps only one
# waiting job per group, so a replaced run's `write` ends `cancelled` — its `post` then does nothing
# (the newer run owns the epic). `write` re-checks for a posted postmortem after the queue, so a run
# that waited behind one that posted skips the model.
#
# SPLIT BY TRUST (same as owner-quiz.yml): `write` runs the model, which has a shell, so it holds
# only a read-only token and keeps no git credentials; `post` holds the Harness App token on a
# fresh runner (so its close cascades into on-issue-close.yml) and receives only the model's text.
#
# NUMBERS (#3253): before the model, `write` computes the epic's numbers from the run records on
# `pipeline-data` (scripts/epic-numbers-run.mjs, never blocks) and lists each child's ticket steps for the
# model's steps-vs-diff check. `post` appends the numbers block (or a "didn't run" line) and stores
# `epics/<N>.json` on `pipeline-data` with the App token. DRY RUN (`dry_run`, by hand only): runs even on
# an epic that already has a postmortem, posts nothing and writes the body to the job summary.

on:
  workflow_call:
    inputs:
      epic:
        type: string
        default: ''
      head_ref:
        type: string
        default: ''
      closed_issue:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      epic:
        description: Epic issue number
        required: true
      simulate_failure:
        description: Fail the model step on purpose (to test the skipped path)
        type: boolean
        default: false
      simulate_numbers_failure:
        description: Fail the numbers step on purpose (to test that it never blocks)
        type: boolean
        default: false
      dry_run:
        description: Post nothing - write the postmortem to the job summary (works on an epic that already has one)
        type: boolean
        default: false

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      go: ${{ steps.t.outputs.go }}
      epic: ${{ steps.t.outputs.epic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - id: t
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EPIC: ${{ inputs.epic }}
          HEAD_REF: ${{ inputs.head_ref }}
          CLOSED_ISSUE: ${{ inputs.closed_issue }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          script: |
            const { target } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/postmortem-run.mjs`)
            const { EPIC: epic, HEAD_REF: headRef, CLOSED_ISSUE: closedIssue, MANUAL, DRY_RUN } = process.env
            await target({ github, context, core }, { epic, headRef, closedIssue, manual: MANUAL === 'true', dryRun: DRY_RUN === 'true' })

  write:
    needs: target
    if: needs.target.outputs.go == 'true'
    concurrency:
      group: postmortem-write-${{ needs.target.outputs.epic }}
      cancel-in-progress: false
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      EPIC: ${{ needs.target.outputs.epic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false # no token in .git/config
      # Re-check after the queue: a run that waited behind one which already posted skips the model.
      - id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          script: |
            const { alreadyPosted } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/postmortem-run.mjs`)
            await alreadyPosted({ github, context, core }, { epic: process.env.EPIC, dryRun: process.env.DRY_RUN === 'true' })
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.done != 'true'
        with:
          node-version: 22
      # (#3253) Report-only: a failure here writes numbers-failed.txt (or nothing) and the post says so.
      # The repo is public, so the anonymous fetch of pipeline-data works without git credentials.
      - name: Epic numbers (never blocks)
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_NUMBERS_FAILURE: ${{ inputs.simulate_numbers_failure }}
        run: |
          D="$RUNNER_TEMP/postmortem"; mkdir -p "$D/data"
          git fetch --depth=1 origin pipeline-data && git archive FETCH_HEAD records | tar -x -C "$D/data" \
            || echo "::warning::could not read the run records from pipeline-data"
          node scripts/epic-numbers-run.mjs "$EPIC" "$D" --records-dir "$D/data/records"
      - name: Set up pi + Claude CLI (subscription)
        if: steps.check.outputs.done != 'true'
        uses: ./.github/actions/setup-pi
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Tier from .claude/pipeline-models.json only — no model literal here (#2161). Prompt on stdin (#3331).
      # GH_TOKEN is the job's read-only token: the model can read the epic, never write to it.
      # Step timeout < job timeout: a hung model FAILS (→ skipped note, never blocks) instead of the
      # job being cancelled, which `post` reads as "a newer run owns this epic".
      - name: Write the postmortem (review model)
        if: steps.check.outputs.done != 'true'
        timeout-minutes: 25
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/postmortem"; mkdir -p "$D"
          [ "$SIMULATE_FAILURE" = "true" ] && { echo "::error::simulate_failure set — failing on purpose"; exit 1; }
          DRY=""; [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
          node scripts/postmortem-run.mjs prompt "$EPIC" "$D/postmortem.md" \
            --numbers "$D/numbers.md" --steps "$D/steps.md" $DRY > "$D/prompt.txt"
          pi --print --approve --provider claude-bridge --model "$(node scripts/resolve-pipeline-model.mjs review)" \
            --skill .claude/skills < "$D/prompt.txt" 2>&1 | tee "$D/pi.log"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postmortem-body
          path: |
            ${{ runner.temp }}/postmortem/postmortem.md
            ${{ runner.temp }}/postmortem/numbers.md
            ${{ runner.temp }}/postmortem/numbers.json
            ${{ runner.temp }}/postmortem/steps.md
            ${{ runner.temp }}/postmortem/numbers-failed.txt
          if-no-files-found: ignore

  post:
    needs: [target, write]
    if: always() && needs.target.outputs.go == 'true'
    concurrency:
      group: postmortem-post-${{ needs.target.outputs.epic }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no artifact = the model wrote nothing; post records it as skipped
        with:
          name: postmortem-body
          path: ${{ runner.temp }}/postmortem
      - name: Post the postmortem (or the skipped note) and close a waiting epic
        id: post
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EPIC: ${{ needs.target.outputs.epic }}
          WRITE_RESULT: ${{ needs.write.result }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          DATA_TOKEN: ${{ steps.app-token.outputs.token }} # stores epics/<N>.json on pipeline-data (#3253)
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { post } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/postmortem-run.mjs`)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await post({ github, context, core }, { epic: process.env.EPIC, modelFile: `${process.env.RUNNER_TEMP}/postmortem/postmortem.md`, runUrl, writeResult: process.env.WRITE_RESULT, dryRun: process.env.DRY_RUN === 'true', dataToken: process.env.DATA_TOKEN })

  auto-close:
    # (#3012) Close the epic by itself once it is on main, its test card is ok'd (or it has none)
    # and its postmortem is posted. Runs even when target said go=false (postmortem already there).
    # A cancelled `write` means a newer run owns this epic (same rule as `post`).
    needs: [target, write, post]
    if: always() && needs.target.outputs.epic != '' && needs.write.result != 'cancelled' && inputs.dry_run != true
    concurrency:
      group: epic-auto-close-${{ needs.target.outputs.epic }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Close the epic if main + test card + postmortem all hold
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EPIC: ${{ needs.target.outputs.epic }}
          VIA: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || (inputs.head_ref != '' && 'merge' || 'sub-issue') }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { runAutoClose } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/epic-auto-close.mjs`)
            await runAutoClose({ github, context, core }, { epic: process.env.EPIC, via: process.env.VIA })
