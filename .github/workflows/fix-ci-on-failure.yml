name: Fix CI on failure
run-name: "${{ github.event_name == 'workflow_dispatch' && format('fix-ci #{0}', inputs.pr) || 'Fix CI on failure (workflow run)' }}"

# Fix-bot (#338, epic #336): when a pipeline PR's CI fails, an agent wakes up, reads the
# failure, and tries a minimal fix — for a few attempts. If it still can't, it tags the
# owner and stands down (status:blocked on the issue) rather than guessing or looping
# forever; the existing resume-on-comment.yml restarts it on a human reply.
#
# Guard rails (the whole point — provably no runaway):
#   - Scope: only pipeline head branches `work-*` (pi worker,
#     #2157). Human PRs are never touched.
#   - Attempt cap: a `ci-fix-attempts:N` label on the PR, capped at FIX_BOT_MAX_ATTEMPTS (3, scripts/lib/fix-bot-dispatch.mjs). On exhaustion →
#     stop, @mention the owner, block the linked issue.
#   - Repeat red (label ≥ 1, fix-bot head) → diagnose → review (max 2 rounds) → fix from the approved diagnosis, or an owner ask (#3667, #3668). Same failure on base → `main-red`, no try (#3270). The reviewer runs in its own job (review-1/review-2) that never mints the App token; only job `fix` commits or pushes.
#   - The counter only counts while the head is the fix-bot's own commit; a stuck head pages the owner once (#3277).
#   - Shared-code stop: the agent must NOT touch packages/ (the HARD GATE) — if a fix needs
#     it, the agent stops and blocks instead (same as the auto-merge guard, #339).
#   - The label also feeds the #337 sticky status note ("🔧 Auto-fix attempts: N").
#
# Jobs (#3668): fixbot (gate, logs, base check, round-1 diagnosis) → review-1 (read-only model
# reviewer) → round-2 (route review 1; redo the diagnosis when rejected) → review-2 → fix (the ONLY
# job that commits or pushes, behind the one `fixgo` decision) → record-outcome. Logic lives in
# scripts/lib/diagnosis-review.mjs; scripts/lib/fix-ci-workflow-shape.test.mjs holds the layout.
#
# Trigger is `workflow_run` (completed) of the CI / E2E workflows — it carries the head
# branch + conclusion, and a workflow_run job runs with write perms from the default branch.

on:
  workflow_run:
    # `Deploy Apps (Cloudflare Workers)` added in #2089. The reflex is that a deploy failure is
    # infrastructure, not code, so an agent shouldn't edit in response — but the evidence says
    # otherwise: every deploy failure on 2026-08-06 was a genuine code bug (#2078 the migrate
    # config, #2085 the missing database_id, #2087 the two-dot diff), and each sat red until a
    # human read the log. A deploy that fails IS a failing check on the PR, and leaving one
    # class of red out of the loop is how it stops being a loop.
    #
    # What bounds the risk is already here and unchanged: the `ci-fix-attempts:3` cap, the
    # packages/ stop, and the pipeline-branch guard — so a genuinely transient Cloudflare blip
    # costs at most three attempts and then hands over with `status:needs-input` rather than
    # looping. The name must match the workflow's `name:` LITERALLY or this silently never
    # fires, which is the exact bug #2089 is about.
    workflows: ["CI", "E2E", "Deploy Apps (Cloudflare Workers)"]
    types: [completed]
    # #3305: start only for pipeline head branches (the job `if` below stays as the guard —
    # workflow_dispatch has no branch). `**` so `work-12/x` isn't dropped; `*` doesn't cross `/`.
    # Must cover every PIPELINE_BRANCH_PREFIXES entry (scripts/lib/pipeline-branch.test.mjs).
    branches: ['work-**']
  # #3105: started by the owner's `ok` on a RED epic → main PR (on-comment.yml approve-epic). The
  # workflow_run path above never sees an `epic/*` head, so this is the only way in for one. The
  # gate step requires the PR open and the owner's ok still standing.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to fix (a work-* PR, or an epic/* PR into main with a standing owner ok)."
        required: true
        type: string

permissions: {}

jobs:
  fixbot:
    # Pipeline branches only — human PRs are never auto-edited. `work-*` is the pi worker;
    # the old `claude/issue-*` lane was dropped (#2892). A false job `if` reports `skipped`,
    # indistinguishable from "nothing to do" (#2089) — the definition lives once, in
    # scripts/lib/pipeline-branch.mjs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'work-'))
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # NOTE: permissions MUST live at the job level — GitHub job-level `permissions` fully
    # OVERRIDES a workflow-level block, so id-token: write has to be here or
    # claude-code-action's OIDC token request fails.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # #2719: hand a refused fix back to the pi worker (workflow_dispatch from GITHUB_TOKEN).
      actions: write
    # Every value a later job reads (#3668): a step output exists only inside its own job, so each
    # one is carried here. fix-ci-workflow-shape.test.mjs checks every read is declared.
    outputs:
      rl_start: ${{ steps.rl-start.outputs.rl_start }}
      mode: ${{ steps.gate.outputs.mode }}
      proceed: ${{ steps.gate.outputs.proceed }}
      packages_allowed: ${{ steps.gate.outputs.packages_allowed }}
      packages_names: ${{ steps.gate.outputs.packages_names }}
      run_id: ${{ steps.gate.outputs.run_id }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_branch: ${{ steps.gate.outputs.head_branch }}
      base_ref: ${{ steps.gate.outputs.base_ref }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      run_url: ${{ steps.gate.outputs.run_url }}
      run_name: ${{ steps.gate.outputs.run_name }}
      attempts: ${{ steps.gate.outputs.attempts }}
      attempt_label: ${{ steps.gate.outputs.attempt_label }}
      check: ${{ steps.gate.outputs.run_name }}
      base_skip: ${{ steps.base.outputs.skip }}
      main_red: ${{ steps.base.outputs.main_red }}
      diagnosed: ${{ steps.diagcheck.outputs.diagnosed }}
    steps:
      # Default branch first (#3105): the gate imports trusted pure helpers (ownerMergeGo,
      # decideFixBotDispatch) from here, never from the PR head. The head is checked out later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # ── Gate: resolve the PR and decide fix / diagnose / gave-up (the bump is in job `fix`) ──
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER_LOGIN: ${{ vars.PIPELINE_OWNER || 'pmcp' }}
        with:
          script: |
            const { owner, repo } = context.repo
            const manual = context.eventName === 'workflow_dispatch'
            let run = context.payload.workflow_run

            // Resolve the open PR for this head branch (or, when started by hand, the PR number given).
            let pr
            if (manual) {
              pr = { number: Number(context.payload.inputs.pr) }
            } else {
              pr = (run.pull_requests || [])[0]
              if (!pr) {
                const list = await github.rest.pulls.list({ owner, repo, head: `${owner}:${run.head_branch}`, state: 'open' })
                pr = list.data[0]
              }
            }
            if (!pr) { core.info('No open PR for branch — nothing to fix.'); core.setOutput('proceed', 'false'); return }

            const full = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data
            // #2157/#3105: the decision (pipeline head, open, an epic → main PR's standing owner ok) lives in
            // scripts/lib/fix-bot-dispatch.mjs (default-branch copy, trusted). `go` is only computed for epic heads.
            const { fixBotWillTry, pickFailedRun, FIX_BOT_MAX_ATTEMPTS } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/fix-bot-dispatch.mjs`)
            let go
            if (/^epic\//.test(full.head.ref)) {
              const { ownerMergeGo } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/owner-merge-go.mjs`)
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 })
              for (const k of commits) {
                if ((k.parents || []).length > 1) continue
                const c = await github.rest.repos.getCommit({ owner, repo, ref: k.sha })
                k.files = (c.data.files || []).map(f => f.filename)
              }
              go = ownerMergeGo({ comments, commits, owner: process.env.OWNER_LOGIN || 'pmcp' })
            }
            const labels = (full.labels || []).map(l => l.name)
            // Started by hand: there is no workflow_run payload, so find the failing CI/E2E run for
            // this head (a WORKFLOW run id — a check-run id would make `gh run view` fail silently).
            let failed = null
            if (manual) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, head_sha: full.head.sha, per_page: 100 })
              failed = pickFailedRun(runs)
              if (failed) run = { id: failed.id, name: failed.name, html_url: failed.html_url, head_branch: full.head.ref, conclusion: failed.conclusion }
            }
            // #3373: the single "will the bot try?" decision (shared with status.yml's red ping).
            // #3277: the head commit decides whether the try counter still stands.
            const failures = run ? [{ workflow: run.name, conclusion: run.conclusion }] : []
            const headCommit = (await github.rest.repos.getCommit({ owner, repo, ref: full.head.sha })).data
            const d = fixBotWillTry({ head: full.head.ref, base: full.base.ref, state: full.state, go, manual, labels, failures, headCommit })
            if (d.who === 'none') {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
                '<!-- pipeline-note -->\n' + `🔴 **No failed CI run found for \`${full.head.sha.slice(0, 7)}\`** — the fix-bot has nothing to read, so it did not start.` +
                `\n\n<sub>🤖 Claude Code · fix-bot (#3105)</sub>` })
              core.setOutput('proceed', 'false'); return
            }
            if (d.who === 'owner') {
              core.info(`Not fixing #${pr.number}: ${d.reason}.`); core.setOutput('proceed', 'false'); return
            }
            const attempts = d.attempts
            // The linked issue (from the pi worker's `work-<n>` branch) is the resume surface for resume-on-comment.
            const m = /^(?:work-|epic\/)(\d+)/.exec(full.head.ref)
            const issueNumber = m ? Number(m[1]) : null
            core.setOutput('pr_number', String(pr.number))
            core.setOutput('issue_number', issueNumber ? String(issueNumber) : '')
            core.setOutput('head_sha', full.head.sha)
            core.setOutput('run_name', run.name)
            core.setOutput('run_url', run.html_url)
            core.setOutput('attempts', String(attempts))

            // #3277: the page itself is the next step (`Page the owner once`), at most once per head.
            if (d.who === 'gave-up') { core.setOutput('gave_up', 'true'); core.setOutput('proceed', 'false'); return }

            // #3667 diagnose mode: one 🩺 diagnosis per (head sha, check) — a job re-run never posts a second.
            if (d.mode === 'diagnose') {
              const { hasDiagnosis } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/diagnosis-marker.mjs`)
              const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 })
              if (hasDiagnosis(cs, { sha: full.head.sha, check: run.name })) { core.info(`Diagnosis already posted for ${run.name} on ${full.head.sha.slice(0, 7)}.`); core.setOutput('proceed', 'false'); return }
            }

            // #2163 (the #2157 packages/ follow-up): normally the fix-bot's prompt STOPS at a
            // packages/ change (the shared-code HARD GATE). But when the linked issue is a `pkg:*`
            // issue, the owner already approved shared-code work by dispatching it — so the bot MAY
            // fix packages/ (the PR still holds for a human merge behind the packages guard, #339).
            // Resolve the package name(s) from the ISSUE's labels so the prompt can unlock exactly
            // those and no others.
            let packagesAllowed = 'false', pkgNames = ''
            // An epic head is never a `pkg:*` leaf: packages/ stays off-limits for it.
            if (issueNumber && !/^epic\//.test(full.head.ref)) {
              try {
                const iss = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data
                const pkgs = (iss.labels || [])
                  .map(l => (typeof l === 'string' ? l : l.name))
                  .filter(n => /^pkg:/.test(n)).map(n => n.slice(4))
                if (pkgs.length) { packagesAllowed = 'true'; pkgNames = pkgs.join(' ') }
              } catch (e) { core.warning(`pkg-label check #${issueNumber}: ${e.message}`) }
            }

            core.setOutput('proceed', 'true')
            core.setOutput('head_branch', full.head.ref)
            core.setOutput('base_ref', full.base.ref)
            core.setOutput('attempt_label', d.attemptLabel || '')
            core.setOutput('run_id', String(run.id))
            core.setOutput('packages_allowed', packagesAllowed)
            core.setOutput('packages_names', pkgNames)
            core.setOutput('mode', d.mode)
            core.info(`Mode ${d.mode}; ${attempts}/${FIX_BOT_MAX_ATTEMPTS} tries so far for PR #${pr.number} (issue #${issueNumber}); packages_allowed=${packagesAllowed} (${pkgNames || 'none'}).`)

      # #3277: one page per stuck head. CI and E2E both red on one head start two runs; the re-list
      # right before posting sees the first run's marker (they land ≥ 22 s apart on #3192).
      - name: Page the owner once (gave up)
        if: steps.gate.outputs.gave_up == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.gate.outputs.pr_number }}
          ISSUE: ${{ steps.gate.outputs.issue_number }}
          SHA: ${{ steps.gate.outputs.head_sha }}
          RUN_NAME: ${{ steps.gate.outputs.run_name }}
          RUN_URL: ${{ steps.gate.outputs.run_url }}
          ATTEMPTS: ${{ steps.gate.outputs.attempts }}
        with:
          script: |
            const { gaveUpPosted, gaveUpMarker } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/diagnosis-review.mjs`)
            const { owner, repo } = context.repo
            const { PR, ISSUE, SHA, RUN_NAME, RUN_URL, ATTEMPTS } = process.env
            const FOOTER = `\n\n<sub>🤖 Claude Code · fix-bot (#338, #3277) · <a href="${RUN_URL}">failing run</a></sub>`
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            if (gaveUpPosted(cs, { sha: SHA })) { core.info(`Already paged for this head (${SHA.slice(0, 7)}).`); return }
            const mark = gaveUpMarker(SHA)
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body:
              '<!-- pipeline-note -->\n' + mark + '\n' + `🔴 **@pmcp — auto-fix gave up after ${ATTEMPTS} tries; \`${RUN_NAME}\` is still failing** on \`${SHA.slice(0, 7)}\`.\n\n` +
              `**Fix:** this one needs a human — take a look, then push a fix or reply to resume.` + FOOTER })
            if (!ISSUE) return
            try { await github.rest.issues.addLabels({ owner, repo, issue_number: Number(ISSUE), labels: ['status:blocked'] }) } catch (e) { core.warning(`block #${ISSUE}: ${e.message}`) }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(ISSUE), body:
              '<!-- pipeline-note -->\n' + mark + '\n' + `🔴 **@pmcp — auto-fix couldn't get CI green on PR #${PR} after ${ATTEMPTS} tries.**\n\n` +
              `**Fix:** take a look, then reply here and the pipeline resumes.` + FOOTER })

      # Mint a Harness App token so the fix PUSH is App-authored. CRUCIAL: a push made with
      # the default GITHUB_TOKEN does NOT re-trigger workflows (GitHub's loop guard), so a
      # GITHUB_TOKEN-authored fix would never re-run CI — the retry loop would stall after
      # one attempt and never verify its own fix. An App-token push fires `pull_request:
      # synchronize` → CI re-runs → workflow_run gives the fix-bot its next attempt (bounded
      # by the ci-fix-attempts cap). Same reason automerge/resume/schedule-waves use it (#626).
      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      # Allowance at run start (#3251): GET /rate_limit does not count against it. The final
      # record-outcome job reads it again; the difference is this run's approximate API spend.
      - name: Read API allowance at start
        id: rl-start
        continue-on-error: true
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          RL_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RL="$(curl -fsS -H "Authorization: Bearer $RL_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/rate_limit" | jq -c '{remaining: .resources.core.remaining, reset: .resources.core.reset, limit: .resources.core.limit}' 2>/dev/null)" || RL='{"error":"read failed"}'
          echo "rl_start=$RL" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # #2719: remember where the branch stood when this run started (job `fix` records its own
      # before it lets the fixer touch the branch).
      - name: Record pre-fix head
        if: steps.gate.outputs.proceed == 'true'
        id: prefix
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # #3336: quote the failing job's own log in a hand-back, not the aggregate CI Gate's JSON.
      # Helpers come from the default branch (trusted; the PR branch may predate them). Read BEFORE
      # the agent step so both modes get the failing lines as input (#3667); the diagnose prompt too.
      - name: Copy log helpers from the default branch
        if: steps.gate.outputs.proceed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/lib"
          for s in failed-job-logs log-tail diagnosis-marker diagnosis-review ci-fix-commit; do git show "origin/$DEFAULT_BRANCH:scripts/lib/$s.mjs" > "$RUNNER_TEMP/lib/$s.mjs"; done
          git show "origin/$DEFAULT_BRANCH:.claude/prompts/diagnose.md" > "$RUNNER_TEMP/diagnose.md"
          git show "origin/$DEFAULT_BRANCH:.claude/agents/diagnosis-reviewer.md" > "$RUNNER_TEMP/diagnosis-reviewer.md"

      # Also keeps each failed job's RAW log + the job list (#3668): the base check, the miss check and
      # the reviewer (job review-*, via the fixbot-inputs artifact) all read them.
      - name: Read the failing job logs
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ steps.gate.outputs.run_id }}
        with:
          script: |
            const fs = require('fs')
            const out = `${process.env.RUNNER_TEMP}/failed-job-logs.md`
            const raw = `${process.env.RUNNER_TEMP}/raw-logs`
            fs.mkdirSync(raw, { recursive: true })
            try {
              const { pickFailedJobs, renderFailedJobLogs } = await import(`${process.env.RUNNER_TEMP}/lib/failed-job-logs.mjs`)
              const { owner, repo } = context.repo
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: Number(process.env.RUN_ID), filter: 'latest', per_page: 100 })
              const picked = pickFailedJobs(jobs)
              fs.writeFileSync(`${raw}/jobs.json`, JSON.stringify(picked.map(j => ({ id: j.id, name: j.name }))))
              const md = await renderFailedJobLogs(picked, async job_id => {
                const res = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id })
                const text = typeof res.data === 'string' ? res.data : String(res.data || '')
                fs.writeFileSync(`${raw}/${job_id}.log`, text)
                return text
              })
              fs.writeFileSync(out, md)
            } catch (e) { core.warning(`failed-job logs: ${e.message}`) }

      # Model comes from the ONE setting, .claude/pipeline-models.json (#2161) — change it there.
      # No fallback literal on purpose: a broken config fails this step loudly instead of
      # silently running a stale model. Diagnose mode (#3667) uses the `hard` tier.
      - name: Resolve model
        if: steps.gate.outputs.proceed == 'true'
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs ${{ steps.gate.outputs.mode == 'diagnose' && 'hard' || 'default' }})"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model: $MODEL (from .claude/pipeline-models.json)"

      # #3270: the same failure on the base branch is not this PR's to fix. Newest completed base run
      # of the same workflow (any result), job by job; the decision is baseVerdict (diagnosis-review.mjs).
      - name: Same failure on base?
        id: base
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ steps.gate.outputs.run_id }}
          BASE: ${{ steps.gate.outputs.base_ref }}
          PR: ${{ steps.gate.outputs.pr_number }}
          RUN_NAME: ${{ steps.gate.outputs.run_name }}
        with:
          script: |
            const fs = require('fs')
            const { pickBaseRun, baseVerdict } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { owner, repo } = context.repo
            const { RUN_ID, BASE, PR, RUN_NAME } = process.env
            const dir = `${process.env.RUNNER_TEMP}/raw-logs`
            const fetchLog = async (id) => String((await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: id })).data || '')
            let prJobs = [], baseRun = null, branch = BASE, v
            try {
              prJobs = JSON.parse(fs.readFileSync(`${dir}/jobs.json`, 'utf8')).map(j => ({ name: j.name, raw: fs.readFileSync(`${dir}/${j.id}.log`, 'utf8') }))
              if (!prJobs.length) return
              const wf = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(RUN_ID) })).data.workflow_id
              for (const b of [BASE, ...(/^epic\//.test(BASE) ? ['main'] : [])]) {
                baseRun = pickBaseRun((await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: wf, branch: b, status: 'completed', per_page: 10 })).data.workflow_runs); branch = b
                if (baseRun) break
              }
              const baseJobs = []
              const jobs = baseRun && baseRun.conclusion !== 'success' ? await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: baseRun.id, filter: 'latest', per_page: 100 }) : []
              for (const j of jobs.filter(j => j.conclusion === 'failure' && prJobs.some(p => p.name === j.name))) baseJobs.push({ name: j.name, conclusion: j.conclusion, raw: await fetchLog(j.id) })
              v = baseVerdict({ prJobs, baseRun, baseJobs })
            } catch (e) { core.warning(`base check skipped (the fix-bot treats the failure as this PR's): ${e.message}`); return }
            core.info(`base ${branch}: ${JSON.stringify(v)}`)
            if (!v.skip) { if (v.mainRed.length) core.setOutput('main_red', v.mainRed.join(', ')); return }
            try { await github.rest.issues.removeLabel({ owner, repo, issue_number: Number(PR), name: 'main-red' }) } catch (e) { /* not there yet */ }
            await github.rest.issues.addLabels({ owner, repo, issue_number: Number(PR), labels: ['main-red'] })
            let known = 'not reported yet'
            try {
              const q = `repo:${owner}/${repo} is:issue is:open in:title "${RUN_NAME} failed on main (post-merge)"`
              const hit = (await github.rest.search.issuesAndPullRequests({ q, sort: 'created', order: 'desc', per_page: 1 })).data.items[0]
              if (hit) known = `reported in #${hit.number}`
            } catch (e) { core.warning(`post-merge issue search: ${e.message}`) }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body: '<!-- pipeline-note -->\n' +
              `🟠 \`${v.mainRed.join('`, `')}\` fails the same way on \`${branch}\` ([run](${baseRun.html_url})), so the fix-bot skips it — not this PR's fault (${known}).\n\n<sub>🤖 fix-bot (#3270)</sub>` })
            core.setOutput('skip', 'true')

      # #3668: the same line red again after an approved fix is a MISS — noted (#3669 tallies it), then
      # diagnosed again; a miss never jumps straight to another fix.
      - name: Miss check
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.mode == 'diagnose' && steps.base.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.gate.outputs.pr_number }}
          SHA: ${{ steps.gate.outputs.head_sha }}
          CHECK: ${{ steps.gate.outputs.run_name }}
        with:
          script: |
            const fs = require('fs')
            const { missOf, missMarker } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { failingLines } = await import(`${process.env.RUNNER_TEMP}/lib/log-tail.mjs`)
            const { owner, repo } = context.repo
            const { PR, SHA, CHECK } = process.env
            const dir = `${process.env.RUNNER_TEMP}/raw-logs`
            let line = ''
            try {
              for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.log'))) line = line || (failingLines(fs.readFileSync(`${dir}/${f}`, 'utf8'), { max: 1 })[0]?.text || '')
            } catch (e) { core.warning(`raw logs: ${e.message}`) }
            if (!line) { core.info('No failing line to compare.'); return }
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            const prev = missOf({ comments: cs, check: CHECK, sha: SHA, failingLine: line })
            if (!prev) { core.info('Not a miss.'); return }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body: '<!-- pipeline-note -->\n' + missMarker({ sha: SHA, check: CHECK, prev }) + '\n' +
              `🔁 **The approved fix for this line did not hold** (approved on \`${prev.slice(0, 7)}\`); diagnosing again.\n\n<sub>🤖 fix-bot · diagnosis review (#3668)</sub>` })

      # ── Diagnose mode (#3667): the same check is red again after a fix try — write a 🩺 diagnosis,
      # commit nothing. Same action + tokens as the fix step; the prompt lives in .claude/prompts/diagnose.md
      # (copied from the default branch above). Round 1 of the review loop (#3668).
      - name: Diagnose the repeat red
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.mode == 'diagnose' && steps.base.outputs.skip != 'true'
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1.0.162
        with:
          allowed_bots: "nuxt-harness[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 40 --permission-mode bypassPermissions --disallowedTools 'Bash(git push:*)' 'Bash(git commit:*)'"
          show_full_output: true
          prompt: |
            Read `${{ runner.temp }}/diagnose.md` and follow it exactly. You are the fix-bot in diagnose mode.

            Inputs:
            - PR: #${{ steps.gate.outputs.pr_number }} (base `${{ steps.gate.outputs.base_ref }}`, head `${{ steps.gate.outputs.head_branch }}`)
            - Head sha (goes in the marker): ${{ steps.gate.outputs.head_sha }}
            - Check name (URL-encode it in the marker): ${{ steps.gate.outputs.run_name }}
            - Round (goes in the marker): 1
            - Failing run: ${{ steps.gate.outputs.run_url }} (run id ${{ steps.gate.outputs.run_id }})
            - Linked issue: #${{ steps.gate.outputs.issue_number }}
            - Failing lines of the failed job(s): `${{ runner.temp }}/failed-job-logs.md`
            - The PR diff: `gh pr diff ${{ steps.gate.outputs.pr_number }}`

            No edits to tracked files, no `git commit`, no `git push`, no label changes. Post exactly ONE PR comment.

      # #3667: a silent diagnose agent would exit 0 and nobody would know — check the comment exists.
      - name: Check the diagnosis was posted
        id: diagcheck
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.mode == 'diagnose' && steps.base.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.gate.outputs.pr_number }}
          SHA: ${{ steps.gate.outputs.head_sha }}
          CHECK: ${{ steps.gate.outputs.run_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { hasDiagnosis } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-marker.mjs`)
            const { owner, repo } = context.repo
            const { PR, SHA, CHECK, RUN_URL } = process.env
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            if (hasDiagnosis(cs, { sha: SHA, check: CHECK, round: 1 })) { core.info('Diagnosis posted.'); core.setOutput('diagnosed', 'true'); return }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body:
              '<!-- pipeline-note -->\n' + `🔴 **fix-bot was asked for a diagnosis of \`${CHECK}\` on \`${SHA.slice(0, 7)}\` and posted none** — see [the run](${RUN_URL}).` })
            core.warning('No diagnosis comment found.')

      # #3668: the reviewer has no token, so this trusted step hands it everything as files: the bot's
      # round-1 diagnosis, the issues it links and the runs it cites (with their conclusions).
      - name: Prepare review 1
        if: steps.diagcheck.outputs.diagnosed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.gate.outputs.pr_number }}
          SHA: ${{ steps.gate.outputs.head_sha }}
          CHECK: ${{ steps.gate.outputs.run_name }}
          ROUND: "1"
        with:
          script: |
            const fs = require('fs')
            const { isPipelineBot, linkedRefs } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { parseDiagnosisMarker } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-marker.mjs`)
            const { owner, repo } = context.repo
            const { PR, SHA, CHECK, ROUND } = process.env
            const out = `${process.env.RUNNER_TEMP}/diagnosis-review/r${ROUND}`
            fs.mkdirSync(`${out}/issues`, { recursive: true })
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            const d = cs.filter(isPipelineBot).filter(c => { const p = parseDiagnosisMarker(c.body); return p && p.sha === SHA && p.check === CHECK && p.round === Number(ROUND) }).pop()
            if (!d) { core.warning(`No bot diagnosis for round ${ROUND}.`); return }
            fs.writeFileSync(`${out}/diagnosis.md`, d.body)
            const refs = linkedRefs(d.body)
            for (const n of refs.issues) {
              try { const i = (await github.rest.issues.get({ owner, repo, issue_number: n })).data; fs.writeFileSync(`${out}/issues/${n}.md`, `# #${n} ${i.title} (${i.state}${i.state_reason ? ', ' + i.state_reason : ''})\n\n${i.body || ''}`) } catch (e) { core.warning(`#${n}: ${e.message}`) }
            }
            const runs = []
            for (const id of refs.runs) {
              try { const r = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id })).data; runs.push({ id, name: r.name, branch: r.head_branch, sha: r.head_sha, conclusion: r.conclusion, created_at: r.created_at, url: r.html_url }) } catch (e) { runs.push({ id, error: e.message }) }
            }
            fs.writeFileSync(`${out}/runs.json`, JSON.stringify(runs, null, 2))

      # Hand the inputs to the later jobs (a step output or a file never leaves its own job).
      - name: Upload the fix-bot inputs
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixbot-inputs
          path: |
            ${{ runner.temp }}/raw-logs
            ${{ runner.temp }}/failed-job-logs.md
          if-no-files-found: warn
          overwrite: true
      - name: Upload the round-1 diagnosis
        if: steps.diagcheck.outputs.diagnosed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnosis-r1
          path: ${{ runner.temp }}/diagnosis-review/r1
          if-no-files-found: warn
          overwrite: true

      # Ship the payload-free invocation trace for the weekly usage rollup (#1064).
      - uses: ./.github/actions/loop-station-trace
        if: always()

  # ── Review 1 (#3668): an UNTRUSTED model reads the diagnosis — in its own job, which never mints the
  # App token and keeps no credential on disk (a job that minted one leaves it readable in
  # $RUNNER_TEMP for the whole job). Read-only: contents: read, every checkout persist-credentials: false.
  review-1:
    name: Review the diagnosis (round 1)
    needs: fixbot
    if: needs.fixbot.outputs.mode == 'diagnose' && needs.fixbot.outputs.base_skip != 'true' && needs.fixbot.outputs.diagnosed == 'true'
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .claude
            .github/actions/setup-pi
            .pi
            scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fixbot.outputs.head_sha }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixbot-inputs
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagnosis-r1
          path: ${{ runner.temp }}/diagnosis-review/r1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up pi
        uses: ./.github/actions/setup-pi
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Resolve review model
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs review)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "review model: $MODEL (from .claude/pipeline-models.json)"
      # Check the effect, not the setup: fail (= no verdict = reject) if any write credential is on disk.
      - name: Assert no write credential on disk
        run: |
          set -uo pipefail
          bad=0
          for d in . head; do git -C "$d" config --name-only --get-regexp '^(http\..*extraheader|includeif\.)' && { echo "::error::git credential config in $d"; bad=1; }; done
          # judge the OUTPUT: grep exits 2 when a match is found but a glob path is missing
          found="$(grep -rlE 'ghs_[A-Za-z0-9]{20,}|x-access-token|AUTHORIZATION: (basic|bearer)' "$RUNNER_TEMP/_runner_file_commands" "$RUNNER_TEMP"/git-credentials-*.config .git/config head/.git/config 2>/dev/null || true)"
          [ -n "$found" ] && { echo "::error::a GitHub credential is on disk: $found"; bad=1; }
          exit "$bad"
      - name: Review
        id: review
        continue-on-error: true
        env:
          PI_MODEL: ${{ steps.model.outputs.model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/diagnosis-review"; mkdir -p "$R/review-r1"
          awk '/^---$/ && n < 2 { n++; next } n >= 2' .claude/agents/diagnosis-reviewer.md \
            | sed -e "s#{{round}}#1#g" -e "s#{{verdict_file}}#$R/review-r1/verdict.md#g" -e "s#{{diagnosis_file}}#$R/r1/diagnosis.md#g" \
                  -e "s#{{logs_dir}}#$RUNNER_TEMP/raw-logs#g" -e "s#{{failing_file}}#$RUNNER_TEMP/failed-job-logs.md#g" \
                  -e "s#{{head_dir}}#$GITHUB_WORKSPACE/head#g" -e "s#{{context_dir}}#$R/r1#g" -e "s#{{points_file}}#(none in round 1)#g" > "$R/prompt-r1.txt"
          pi --print --approve --provider claude-bridge --model "$PI_MODEL" --skill .claude/skills < "$R/prompt-r1.txt" 2>&1 | tee "$R/pi-r1.log"
          exit "${PIPESTATUS[0]}"
      # A missing verdict file is fine: the route step reads it as a reject.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-r1
          path: ${{ runner.temp }}/diagnosis-review/review-r1
          if-no-files-found: ignore
          overwrite: true

  # ── Route review 1; when rejected, redo the diagnosis (round 2). Trusted: App token, no model review.
  round-2:
    name: Route review 1 / diagnose round 2
    needs: [fixbot, review-1]
    if: always() && needs.review-1.result != 'skipped' && needs.fixbot.outputs.proceed == 'true'
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      next1: ${{ steps.route1.outputs.next }}
      diagnosed2: ${{ steps.diagcheck2.outputs.diagnosed }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Copy helpers from the default branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lib"
          for s in failed-job-logs log-tail diagnosis-marker diagnosis-review ci-fix-commit; do cp "scripts/lib/$s.mjs" "$RUNNER_TEMP/lib/"; done
          cp .claude/prompts/diagnose.md "$RUNNER_TEMP/diagnose.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixbot-inputs
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: diagnosis-r1
          path: ${{ runner.temp }}/diagnosis-review/r1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: review-r1
          path: ${{ runner.temp }}/diagnosis-review/review-r1
      # precheck first (a fail rejects with no model verdict), then the verdict file, then the route.
      - name: Route round 1
        id: route1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.fixbot.outputs.pr_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/diagnosis-review"; L="$RUNNER_TEMP/lib/diagnosis-review.mjs"
          node "$L" route 1 "$R/r1/diagnosis.md" "$R/review-r1/verdict.md" "$RUNNER_TEMP/raw-logs" > "$R/route-r1.json"
          jq . "$R/route-r1.json"
          mkdir -p "$R/r2"; jq -r '.points[]' "$R/route-r1.json" > "$R/r2/round1-points.md"
          node "$L" render-review "$R/route-r1.json" "$SHA" "$CHECK" > "$R/review-r1.md"
          # review-r1.md's first line is the <!-- pipeline-note --> marker (renderReview).
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$R/review-r1.md"
          echo "next=$(jq -r .next "$R/route-r1.json")" >> "$GITHUB_OUTPUT"
      - name: Check out the PR head for the redo
        if: steps.route1.outputs.next == 'redo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fixbot.outputs.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Resolve model
        if: steps.route1.outputs.next == 'redo'
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs hard)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model: $MODEL (from .claude/pipeline-models.json)"
      - name: Diagnose round 2
        if: steps.route1.outputs.next == 'redo'
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1.0.162
        with:
          allowed_bots: "nuxt-harness[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 40 --permission-mode bypassPermissions --disallowedTools 'Bash(git push:*)' 'Bash(git commit:*)'"
          show_full_output: true
          prompt: |
            Read `${{ runner.temp }}/diagnose.md` and follow it exactly, including its `## Redo (round 2)` section. You are the fix-bot in diagnose mode, round 2.

            Inputs:
            - PR: #${{ needs.fixbot.outputs.pr_number }} (base `${{ needs.fixbot.outputs.base_ref }}`, head `${{ needs.fixbot.outputs.head_branch }}`)
            - Head sha (goes in the marker): ${{ needs.fixbot.outputs.head_sha }}
            - Check name (URL-encode it in the marker): ${{ needs.fixbot.outputs.run_name }}
            - Round (goes in the marker): 2
            - The reviewer's points on your round-1 diagnosis: `${{ runner.temp }}/diagnosis-review/r2/round1-points.md`
            - Your round-1 diagnosis: `${{ runner.temp }}/diagnosis-review/r1/diagnosis.md`
            - Failing run: ${{ needs.fixbot.outputs.run_url }} (run id ${{ needs.fixbot.outputs.run_id }})
            - Linked issue: #${{ needs.fixbot.outputs.issue_number }}
            - Failing lines of the failed job(s): `${{ runner.temp }}/failed-job-logs.md`
            - The PR diff: `gh pr diff ${{ needs.fixbot.outputs.pr_number }}`

            No edits to tracked files, no `git commit`, no `git push`, no label changes. Post exactly ONE new PR comment.
      - name: Check round 2 posted
        id: diagcheck2
        if: steps.route1.outputs.next == 'redo'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.fixbot.outputs.pr_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
        with:
          script: |
            const { hasDiagnosis } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-marker.mjs`)
            const { owner, repo } = context.repo
            const { PR, SHA, CHECK } = process.env
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            if (hasDiagnosis(cs, { sha: SHA, check: CHECK, round: 2 })) { core.info('Round-2 diagnosis posted.'); core.setOutput('diagnosed', 'true'); return }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body:
              '<!-- pipeline-note -->\n' + `🔴 **fix-bot was asked to redo the diagnosis of \`${CHECK}\` on \`${SHA.slice(0, 7)}\` and posted none** — no fix starts.` })
            core.warning('No round-2 diagnosis comment found.')
      - name: Prepare review 2
        if: steps.diagcheck2.outputs.diagnosed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.fixbot.outputs.pr_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
          ROUND: "2"
        with:
          script: |
            const fs = require('fs')
            const { isPipelineBot, linkedRefs } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { parseDiagnosisMarker } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-marker.mjs`)
            const { owner, repo } = context.repo
            const { PR, SHA, CHECK, ROUND } = process.env
            const out = `${process.env.RUNNER_TEMP}/diagnosis-review/r${ROUND}`
            fs.mkdirSync(`${out}/issues`, { recursive: true })
            const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
            const d = cs.filter(isPipelineBot).filter(c => { const p = parseDiagnosisMarker(c.body); return p && p.sha === SHA && p.check === CHECK && p.round === Number(ROUND) }).pop()
            if (!d) { core.warning(`No bot diagnosis for round ${ROUND}.`); return }
            fs.writeFileSync(`${out}/diagnosis.md`, d.body)
            const refs = linkedRefs(d.body)
            for (const n of refs.issues) {
              try { const i = (await github.rest.issues.get({ owner, repo, issue_number: n })).data; fs.writeFileSync(`${out}/issues/${n}.md`, `# #${n} ${i.title} (${i.state}${i.state_reason ? ', ' + i.state_reason : ''})\n\n${i.body || ''}`) } catch (e) { core.warning(`#${n}: ${e.message}`) }
            }
            const runs = []
            for (const id of refs.runs) {
              try { const r = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id })).data; runs.push({ id, name: r.name, branch: r.head_branch, sha: r.head_sha, conclusion: r.conclusion, created_at: r.created_at, url: r.html_url }) } catch (e) { runs.push({ id, error: e.message }) }
            }
            fs.writeFileSync(`${out}/runs.json`, JSON.stringify(runs, null, 2))
      - name: Upload the round-2 diagnosis
        if: steps.diagcheck2.outputs.diagnosed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnosis-r2
          path: ${{ runner.temp }}/diagnosis-review/r2
          if-no-files-found: warn
          overwrite: true

  # ── Review 2: same read-only, credential-free reviewer, on the redone diagnosis.
  review-2:
    name: Review the diagnosis (round 2)
    needs: [fixbot, round-2]
    if: always() && needs.round-2.outputs.next1 == 'redo' && needs.round-2.outputs.diagnosed2 == 'true'
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .claude
            .github/actions/setup-pi
            .pi
            scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fixbot.outputs.head_sha }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixbot-inputs
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagnosis-r2
          path: ${{ runner.temp }}/diagnosis-review/r2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up pi
        uses: ./.github/actions/setup-pi
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Resolve review model
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs review)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "review model: $MODEL (from .claude/pipeline-models.json)"
      - name: Assert no write credential on disk
        run: |
          set -uo pipefail
          bad=0
          for d in . head; do git -C "$d" config --name-only --get-regexp '^(http\..*extraheader|includeif\.)' && { echo "::error::git credential config in $d"; bad=1; }; done
          # judge the OUTPUT: grep exits 2 when a match is found but a glob path is missing
          found="$(grep -rlE 'ghs_[A-Za-z0-9]{20,}|x-access-token|AUTHORIZATION: (basic|bearer)' "$RUNNER_TEMP/_runner_file_commands" "$RUNNER_TEMP"/git-credentials-*.config .git/config head/.git/config 2>/dev/null || true)"
          [ -n "$found" ] && { echo "::error::a GitHub credential is on disk: $found"; bad=1; }
          exit "$bad"
      - name: Review
        id: review
        continue-on-error: true
        env:
          PI_MODEL: ${{ steps.model.outputs.model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/diagnosis-review"; mkdir -p "$R/review-r2"
          awk '/^---$/ && n < 2 { n++; next } n >= 2' .claude/agents/diagnosis-reviewer.md \
            | sed -e "s#{{round}}#2#g" -e "s#{{verdict_file}}#$R/review-r2/verdict.md#g" -e "s#{{diagnosis_file}}#$R/r2/diagnosis.md#g" \
                  -e "s#{{logs_dir}}#$RUNNER_TEMP/raw-logs#g" -e "s#{{failing_file}}#$RUNNER_TEMP/failed-job-logs.md#g" \
                  -e "s#{{head_dir}}#$GITHUB_WORKSPACE/head#g" -e "s#{{context_dir}}#$R/r2#g" -e "s#{{points_file}}#$R/r2/round1-points.md#g" > "$R/prompt-r2.txt"
          pi --print --approve --provider claude-bridge --model "$PI_MODEL" --skill .claude/skills < "$R/prompt-r2.txt" 2>&1 | tee "$R/pi-r2.log"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-r2
          path: ${{ runner.temp }}/diagnosis-review/review-r2
          if-no-files-found: ignore
          overwrite: true

  # ── Fix (#3668): the ONLY job that commits or pushes. First red (fix mode): straight after fixbot,
  # as before. Repeat red: only from a bot-approved diagnosis. One decision (`fixgo`) gates every
  # commit step, so nothing can commit before the review.
  fix:
    name: Fix
    needs: [fixbot, review-1, round-2, review-2]
    if: always() && needs.fixbot.outputs.proceed == 'true'
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # #2719: hand a refused fix back to the pi worker (workflow_dispatch from GITHUB_TOKEN).
      actions: write
    steps:
      # App-token push so CI re-runs on the fix (see job fixbot for why, #626).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      # The head over it: the push needs this persisted App credential, and no model reviewer runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fixbot.outputs.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # #2719: remember where the branch stood BEFORE the fix, so the guard below can diff the
      # fix against it. The fixer commits but does not push — this workflow pushes (or refuses).
      - name: Record pre-fix head
        id: prefix
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy log helpers from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/lib"
          for s in failed-job-logs log-tail diagnosis-marker diagnosis-review ci-fix-commit; do git show "origin/$DEFAULT_BRANCH:scripts/lib/$s.mjs" > "$RUNNER_TEMP/lib/$s.mjs"; done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: fixbot-inputs
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review-2.result != 'skipped'
        continue-on-error: true
        with:
          name: diagnosis-r2
          path: ${{ runner.temp }}/diagnosis-review/r2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review-2.result != 'skipped'
        continue-on-error: true
        with:
          name: review-r2
          path: ${{ runner.temp }}/diagnosis-review/review-r2

      # A newer commit on the branch gets its own red run (and its own decision) — never fix an old head.
      - name: Head unchanged?
        id: head
        env:
          SHA: ${{ needs.fixbot.outputs.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then echo "::notice::a newer commit landed; its own red run handles it"; echo "moved=true" >> "$GITHUB_OUTPUT"; else echo "moved=false" >> "$GITHUB_OUTPUT"; fi

      - name: Route round 2
        id: route2
        if: needs.review-2.result != 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.fixbot.outputs.pr_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/diagnosis-review"; L="$RUNNER_TEMP/lib/diagnosis-review.mjs"
          node "$L" route 2 "$R/r2/diagnosis.md" "$R/review-r2/verdict.md" "$RUNNER_TEMP/raw-logs" > "$R/route-r2.json"
          jq . "$R/route-r2.json"
          node "$L" render-review "$R/route-r2.json" "$SHA" "$CHECK" > "$R/review-r2.md"
          # review-r2.md's first line is the <!-- pipeline-note --> marker (renderReview).
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$R/review-r2.md"
          echo "next=$(jq -r .next "$R/route-r2.json")" >> "$GITHUB_OUTPUT"

      # Two rejections: the owner gets both views on the linked issue (ask-human shape). Nothing commits.
      - name: Ask the owner
        if: steps.route2.outputs.next == 'owner'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.fixbot.outputs.pr_number }}
          ISSUE: ${{ needs.fixbot.outputs.issue_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
        with:
          script: |
            const fs = require('fs')
            const { ownerAsk, isPipelineBot, parseReviewMarker } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { parseDiagnosisMarker } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-marker.mjs`)
            const { owner, repo } = context.repo
            const { PR, ISSUE, SHA, CHECK } = process.env
            const R = `${process.env.RUNNER_TEMP}/diagnosis-review`
            const cs = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })).filter(isPipelineBot)
            const url = (parse, round) => (cs.filter(c => { const p = parse(c.body); return p && p.sha === SHA && p.check === CHECK && p.round === round }).pop() || {}).html_url
            const read = (f) => { try { return fs.readFileSync(f, 'utf8') } catch { return '' } }
            const pts1 = read(`${R}/r2/round1-points.md`).split('\n').filter(Boolean)
            const pts2 = (JSON.parse(read(`${R}/route-r2.json`) || '{}').points) || []
            const rounds = [1, 2].map((n, i) => ({ diagnosisUrl: url(parseDiagnosisMarker, n), reviewUrl: url(parseReviewMarker, n), points: [pts1, pts2][i] }))
            const target = Number(ISSUE || PR)
            const ask = (await github.rest.issues.createComment({ owner, repo, issue_number: target, body: ownerAsk({ check: CHECK, sha: SHA, pr: PR, rounds }) })).data
            if (ISSUE) { try { await github.rest.issues.addLabels({ owner, repo, issue_number: Number(ISSUE), labels: ['status:blocked'] }) } catch (e) { core.warning(`block #${ISSUE}: ${e.message}`) } }
            if (ISSUE) await github.rest.issues.createComment({ owner, repo, issue_number: Number(PR), body: '<!-- pipeline-note -->\n' +
              `🔀 **Diagnosis rejected twice — handed to the owner** ([the ask](${ask.html_url})). Nothing was committed.\n\n<sub>🤖 fix-bot · diagnosis review (#3668)</sub>` })

      # THE rule (#3668): fix mode → from the log; diagnose mode → only from a bot-approved diagnosis,
      # re-read from the PR thread, which also goes to a worker hand-back via failed-job-logs.md.
      - name: Decide the fix
        id: fixgo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ needs.fixbot.outputs.mode }}
          BASE_SKIP: ${{ needs.fixbot.outputs.base_skip }}
          MOVED: ${{ steps.head.outputs.moved }}
          ROUTE1: ${{ needs.round-2.outputs.next1 }}
          ROUTE2: ${{ steps.route2.outputs.next }}
          PR: ${{ needs.fixbot.outputs.pr_number }}
          SHA: ${{ needs.fixbot.outputs.head_sha }}
          CHECK: ${{ needs.fixbot.outputs.check }}
        with:
          script: |
            const fs = require('fs')
            const { fixGo, approvedDiagnosis, handoffLog } = await import(`${process.env.RUNNER_TEMP}/lib/diagnosis-review.mjs`)
            const { MODE, BASE_SKIP, MOVED, ROUTE1, ROUTE2, PR, SHA, CHECK } = process.env
            const d = fixGo({ mode: MODE, baseSkip: BASE_SKIP, headMoved: MOVED, route1: ROUTE1, route2: ROUTE2 })
            core.info(`fix go: ${d.go} — ${d.reason}`)
            if (d.go && d.from === 'diagnosis') {
              const { owner, repo } = context.repo
              const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: Number(PR), per_page: 100 })
              const approved = approvedDiagnosis(cs, { sha: SHA, check: CHECK })
              if (!approved) { core.warning('The route said fix, but no bot-approved diagnosis is in the thread — no fix.'); core.setOutput('go', 'false'); return }
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/approved-diagnosis.md`, approved)
              const f = `${process.env.RUNNER_TEMP}/failed-job-logs.md`
              let log = ''
              try { log = fs.readFileSync(f, 'utf8') } catch (e) { /* no logs read */ }
              fs.writeFileSync(f, handoffLog({ approved, failingLog: log }))
            }
            core.setOutput('go', String(d.go))

      # Bump in this job, only when a fix really starts (addLabels auto-creates; labels.yml predefines 1–3).
      - name: Bump the attempt counter
        id: bump
        if: steps.fixgo.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.fixbot.outputs.pr_number }}
          OLD: ${{ needs.fixbot.outputs.attempt_label }}
          ATTEMPTS: ${{ needs.fixbot.outputs.attempts }}
        run: |
          set -euo pipefail
          N=$(( ${ATTEMPTS:-0} + 1 ))
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$OLD" >/dev/null || true; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=ci-fix-attempts:$N" >/dev/null
          echo "attempt=$N" >> "$GITHUB_OUTPUT"

      # Model comes from the ONE setting, .claude/pipeline-models.json (#2161) — the `default` tier the
      # fix attempt has always used.
      - name: Resolve model
        if: steps.fixgo.outputs.go == 'true'
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs default)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model: $MODEL (from .claude/pipeline-models.json)"

      # ── The fix attempt ─────────────────────────────────────────────────────────
      # AUTH: headless/unattended → MUST use an API key (never a subscription OAuth token;
      # Anthropic terms). Pinned to the same SHA as claude.yml — keep in sync when bumping.
      # github_token is the App token so the agent's git push re-triggers CI (above).
      - name: Fix attempt
        if: steps.fixgo.outputs.go == 'true'
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1.0.162
        with:
          # Pipeline PRs are pushed by the harness bot, and the action refuses a bot-initiated
          # run unless the bot is allow-listed — without this the fixer never ran on any
          # pipeline PR (#2447; same guard as decompose-on-issue.yml).
          allowed_bots: "nuxt-harness[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # bypassPermissions REQUIRED (#834/#2165): headless CI denies un-allowlisted tools, so
          # WITHOUT this the fix-bot's every pnpm/git/gh command is permission-denied — it burns all
          # its turns on denials and crashes with max_turns, never reaching the fix (the first real
          # live-lane run, 31589320044, did exactly this). Same reason red-team-daily.yml sets it.
          # max-turns 40 (was 30): a full pnpm install + typecheck + fix + verify cycle is turn-hungry.
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 40 --permission-mode bypassPermissions --disallowedTools 'Bash(git push:*)' 'Bash(git commit:*)'"
          show_full_output: true
          prompt: |
            CI failed on this pipeline PR — you are the fix-bot. This is auto-fix attempt
            ${{ steps.bump.outputs.attempt }} of 3 for PR #${{ needs.fixbot.outputs.pr_number }}
            (branch `${{ needs.fixbot.outputs.head_branch }}`, linked issue #${{ needs.fixbot.outputs.issue_number }}).

            The failing workflow was "${{ needs.fixbot.outputs.run_name }}":
            ${{ needs.fixbot.outputs.run_url }}

            If `${{ runner.temp }}/approved-diagnosis.md` exists, fix THAT cause, not a new guess.
            Leave these jobs alone, they fail on base too: `${{ needs.fixbot.outputs.main_red }}`

            Do this, and ONLY this:
            1. Reproduce the failure locally — run the relevant command (e.g. `pnpm -r --filter './apps/*' typecheck`,
               `pnpm lint`, or the failing test/e2e) to see the actual error. Read the failing job's logs if you need to.
            2. Diagnose the root cause and make the MINIMAL fix on this branch. Keep it tightly
               scoped to the failure — do not refactor, do not touch unrelated files.
               NEVER remove code this PR added to make a check pass (#2719, #3336). A complexity
               finding (e.g. Fallow cognitive/cyclomatic on a new function) -> split it into smaller
               functions with no behaviour change. A dead-code/unused finding on code the linked issue
               asked for -> wire it up where the issue says it is used, or hand back (comment, @pmcp,
               `status:blocked`). Example: #3333 — Fallow flagged `removedTests` as too complex; the
               right fix is to extract helpers, not delete it. If a symbol/menu
               group/key/route is referenced but undefined, IMPLEMENT the missing piece, taking the
               intent from the linked issue (`gh issue view ${{ needs.fixbot.outputs.issue_number }}`)
               and the latest owner/orchestrator comments on the PR and issue — not just the log. If
               you cannot implement it confidently, do not commit and do NOT write the message file; comment on the issue, @mention
               @pmcp, apply `status:blocked`, and stop. A deterministic check after you rejects any
               commit that removes lines the worker added (blank lines and imports excepted).
            3. SHARED CODE (`packages/`) — read this carefully, it depends on the issue:
               - packages_allowed for this run: ${{ needs.fixbot.outputs.packages_allowed }} (packages: ${{ needs.fixbot.outputs.packages_names }}).
               - If packages_allowed is `false`: do NOT modify anything under `packages/`. If the only
                 correct fix would require one, STOP: do not commit and do NOT write the message file. Instead comment on issue
                 #${{ needs.fixbot.outputs.issue_number }} explaining why, @mention @pmcp, apply the
                 `status:blocked` label to that issue, and end your run.
               - If packages_allowed is `true`: this is a `pkg:*` issue — the owner already approved
                 shared-code work by dispatching it, so you MAY edit ONLY the listed package(s). Before
                 your first edit under `packages/`, unlock the gate for exactly those packages, one per
                 line: `for p in ${{ needs.fixbot.outputs.packages_names }}; do echo "$p" >> .claude/.package-edit-approved; done`.
                 Keep the change minimal and scoped to the failure; do NOT touch any other package. The
                 PR still holds for a human to merge (the shared-code merge guard), so you are producing
                 the fix, not landing it. Do NOT commit `.claude/.package-edit-approved` (it is gitignored).
            4. Verify green: re-run the command from step 1 and confirm it passes.
            5. Do NOT run `git commit` or `git push`. Stage ONLY the files you changed (`git add <files>`)
               and write your commit message (conventional, reference the issue) to
               `$RUNNER_TEMP/ci-fix-message`. The workflow makes the one commit from that message
               and pushes it; no message file means nothing is committed. CI then re-runs automatically; if it still fails,
               the fix-bot will get another attempt (up to the cap).

            If you cannot find a confident fix, do NOT guess or push a speculative change — comment on
            issue #${{ needs.fixbot.outputs.issue_number }}, @mention @pmcp, apply `status:blocked`, and stop. Do NOT write the message file.

      # #3104: the ONE commit is made here, not by the agent. The script is read from the default
      # branch (trusted — the PR branch can't alter it) and commits what the agent staged with the
      # agent's message + `CI-Fix: true`, under the fix-bot identity. No message file -> no commit.
      - name: Commit the staged fix
        if: steps.fixgo.outputs.go == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$DEFAULT_BRANCH"
          git show "origin/$DEFAULT_BRANCH:scripts/commit-ci-fix.sh" > "$RUNNER_TEMP/commit-ci-fix.sh"
          bash "$RUNNER_TEMP/commit-ci-fix.sh" "$RUNNER_TEMP/ci-fix-message"

      # ── Guard (#2719): refuse a "fix" that deletes the worker's own new code ────────────
      # Compare the fix commit(s) with what the PR's worker commits added. If the fix removes any
      # of those lines (blank lines/imports aside) it is not pushed: the branch is reset, the PR
      # gets the lines listed, and the pi worker is re-run with the CI failure as feedback (the
      # revise path, #2446). Otherwise the fix is pushed as before. Attempt cap and packages/ rules
      # are untouched. The failed-job logs it quotes (with the approved diagnosis first, #3668) were
      # read in job fixbot and handed over in the fixbot-inputs artifact.
      - name: Guard and push the fix
        if: steps.fixgo.outputs.go == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.prefix.outputs.sha }}
          BASE: ${{ needs.fixbot.outputs.base_ref }}
          BRANCH: ${{ needs.fixbot.outputs.head_branch }}
          PR: ${{ needs.fixbot.outputs.pr_number }}
          ISSUE: ${{ needs.fixbot.outputs.issue_number }}
          RUN_URL: ${{ needs.fixbot.outputs.run_url }}
          RUN_ID: ${{ needs.fixbot.outputs.run_id }}
          RUN_NAME: ${{ needs.fixbot.outputs.run_name }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(git rev-parse HEAD)"
          # Belt and braces: `git push` is disallowed for the agent, but if it pushed anyway the
          # remote head has moved past $PRE. Judge those commits too; if refused, revert them.
          git fetch -q origin "$BRANCH"
          REMOTE_NOW="$(git rev-parse "origin/$BRANCH")"
          PUSHED=0
          if [ "$REMOTE_NOW" != "$PRE" ] && git merge-base --is-ancestor "$PRE" "$REMOTE_NOW"; then PUSHED=1; fi
          if [ "$HEAD_NOW" = "$PRE" ] && [ "$PUSHED" = 0 ]; then
            echo "No fix commit — nothing to push."
            # #3373: the first-failure ping no longer mentions the owner while the bot is on it, so a
            # silent no-fix exit would reach nobody. Ping once unless the agent already blocked the issue.
            if [ -n "${ISSUE:-}" ] && ! gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx 'status:blocked'; then
              gh pr comment "$PR" --body "<!-- pipeline-note -->
          🔴 **@pmcp — auto-fix stopped without a fix; \`$RUN_NAME\` is still failing.**

          **Fix:** take a look, then push a fix or reply to resume." || true
              gh issue edit "$ISSUE" --add-label "status:blocked" || true
            fi
            exit 0
          fi
          git fetch -q origin "$BASE"
          git diff "origin/$BASE...$PRE" > "$RUNNER_TEMP/worker.diff"
          git diff "$PRE" "$HEAD_NOW" > "$RUNNER_TEMP/fix.diff"
          if [ "$PUSHED" = 1 ]; then git diff "$PRE" "$REMOTE_NOW" >> "$RUNNER_TEMP/fix.diff"; fi
          node -e '
            const fs = require("fs")
            import("./scripts/lib/fix-removes-worker-code.mjs").then(({ findRemovedWorkerLines }) => {
              const r = findRemovedWorkerLines(fs.readFileSync(process.argv[1], "utf8"), fs.readFileSync(process.argv[2], "utf8"))
              fs.writeFileSync(process.argv[3], JSON.stringify(r))
              process.exit(r.refuse ? 3 : 0)
            })
          ' "$RUNNER_TEMP/worker.diff" "$RUNNER_TEMP/fix.diff" "$RUNNER_TEMP/verdict.json" && ok=1 || ok=0
          if [ "$ok" = 1 ]; then
            if [ "$HEAD_NOW" != "$PRE" ]; then node scripts/git-push-retry.mjs origin "HEAD:$BRANCH"; fi
            exit 0
          fi

          echo "refused=true" >> "$GITHUB_OUTPUT"
          git reset -q --hard "$PRE"
          # No force-push: if the agent already pushed, add a revert commit restoring $PRE's tree.
          # Undo only the fix-bot's own commits; a worker revision pushed meanwhile must survive (#2978).
          if [ "$PUSHED" = 1 ] && ! bash scripts/revert-pushed-fix.sh "$PRE" "$BRANCH" "$HEAD_NOW"; then
            UNDONE_NOTE="<!-- pipeline-note -->"$'\n'"> 🤖 **pi.dev harness** · fix-bot guard (#2719) · _auto-fix not undone_"
            UNDONE_NOTE="$UNDONE_NOTE"$'\n\n'"⚠️ The refused auto-fix is already on this branch and could not be reverted cleanly (later commits touch the same lines). Nothing was pushed. Please revert the fix-bot commit(s) \`$PRE..$HEAD_NOW\` by hand."
            gh pr comment "$PR" --body "$UNDONE_NOTE"
          fi
          LINES="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1]));console.log(r.removed.map(x=>"- `"+x.file+"`: `"+x.line.trim()+"`").join(String.fromCharCode(10)))' "$RUNNER_TEMP/verdict.json")"
          ERR="$(cat "$RUNNER_TEMP/failed-job-logs.md" 2>/dev/null || echo '(could not read the failed job logs — see the failing run)')"
          {
            echo "<!-- pipeline-note -->"
            echo "> 🤖 **pi.dev harness** · fix-bot guard (#2719) · _auto-fix refused_"
            echo
            echo "🔧 **Auto-fix not pushed: it would delete code this PR was asked to add.** Handing back to the worker to implement the missing piece instead."
            echo
            echo "**Lines the fix would remove:**"
            echo "$LINES"
            echo
            echo "<details><summary>CI failure (\`$RUN_NAME\`) the worker should fix</summary>"
            echo
            echo "$ERR"
            echo "[failing run]($RUN_URL)"
            echo "</details>"
            echo
            echo "**Revise instruction:** CI is red. Make it green by IMPLEMENTING what the lines above reference — do not delete them. Use the error text above."
          } > "$RUNNER_TEMP/handback.md"
          PRC_URL="$(gh pr comment "$PR" --body-file "$RUNNER_TEMP/handback.md")"
          if [ -n "$ISSUE" ]; then
            # Comment POST + dispatch are ONE protected hand-off step (#3306): a limit / 5xx saves it for the sweep,
            # which falls back to the PR comment just posted (an issue-comment id, readable the same way).
            node scripts/handoff-exec.mjs dispatch "$(jq -nc --argjson i "$ISSUE" --arg b "$BRANCH" --arg f "$RUNNER_TEMP/handback.md" --arg p "${PRC_URL##*issuecomment-}" '{issue:$i,workflow:"work-issue-pidev.yml",inputs:{issue:($i|tostring),branch:$b},postBodyFile:$f,fallbackFeedback:$p}')"
          fi

      # Ship the payload-free invocation trace for the weekly usage rollup (#1064).
      - uses: ./.github/actions/loop-station-trace
        if: always()

  # ── Run record (#3251) ─────────────────────────────────────────────────────────────────
  # One record per workflow RUN, written after every other job finished (`needs:` all, always()).
  # Counts what the run left behind (agent comments, verdicts, commits) vs the workflow's own
  # `<!-- pipeline-note -->` comments, and the API allowance it spent. Read-only against
  # issues/PRs; a failure here never fails the run (continue-on-error + script exits 0).
  record-outcome:
    name: Record run outcome
    needs: [fixbot, review-1, round-2, review-2, fix]
    if: ${{ always() && needs.fixbot.result != 'skipped' }}
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            .claude/pipeline-models.json
          persist-credentials: false
      - name: Write the run record (never fails the run)
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_FILE: fix-ci-on-failure.yml
          PR: "${{ inputs.pr }}"
          BRANCH: "${{ github.event.workflow_run.head_branch }}"
          STAGE: fix-ci
          MODEL_TIER: ${{ needs.fixbot.outputs.mode == 'diagnose' && 'hard' || 'default' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RL_START: ${{ needs.fixbot.outputs.rl_start }}
          TOKEN_KIND: ${{ steps.app-token.outputs.token && 'app' || 'github_token' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DATA_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/eval-ledger/record-run.mjs
