name: Fix CI on failure

# Fix-bot (#338, epic #336): when a pipeline PR's CI fails, an agent wakes up, reads the
# failure, and tries a minimal fix — for a few attempts. If it still can't, it tags the
# owner and stands down (status:blocked on the issue) rather than guessing or looping
# forever; the existing resume-on-comment.yml restarts it on a human reply.
#
# Guard rails (the whole point — provably no runaway):
#   - Scope: only pipeline head branches `claude/issue-*` (claude lane) + `work-*` (pi worker,
#     #2157). Human PRs are never touched.
#   - Attempt cap: a `ci-fix-attempts:N` label on the PR, capped at MAX (3). On exhaustion →
#     stop, @mention the owner, block the linked issue.
#   - Shared-code stop: the agent must NOT touch packages/ (the HARD GATE) — if a fix needs
#     it, the agent stops and blocks instead (same as the auto-merge guard, #339).
#   - The label also feeds the #337 sticky status note ("🔧 Auto-fix attempts: N").
#
# Trigger is `workflow_run` (completed) of the CI / E2E workflows — it carries the head
# branch + conclusion, and a workflow_run job runs with write perms from the default branch.

on:
  workflow_run:
    # `Deploy Apps (Cloudflare Workers)` added in #2089. The reflex is that a deploy failure is
    # infrastructure, not code, so an agent shouldn't edit in response — but the evidence says
    # otherwise: every deploy failure on 2026-08-06 was a genuine code bug (#2078 the migrate
    # config, #2085 the missing database_id, #2087 the two-dot diff), and each sat red until a
    # human read the log. A deploy that fails IS a failing check on the PR, and leaving one
    # class of red out of the loop is how it stops being a loop.
    #
    # What bounds the risk is already here and unchanged: the `ci-fix-attempts:3` cap, the
    # packages/ stop, and the pipeline-branch guard — so a genuinely transient Cloudflare blip
    # costs at most three attempts and then hands over with `status:needs-input` rather than
    # looping. The name must match the workflow's `name:` LITERALLY or this silently never
    # fires, which is the exact bug #2089 is about.
    workflows: ["CI", "E2E", "Deploy Apps (Cloudflare Workers)"]
    types: [completed]

permissions: {}

jobs:
  fixbot:
    # Pipeline branches only — human PRs are never auto-edited. BOTH prefixes: `claude/issue-*`
    # is the claude lane, `work-*` is the pi worker. This listed only the former, and since
    # AGENT_HARNESS=pi made pi the live lane the condition could not be true for any PR: 1718
    # runs, 100 of the last 100 `skipped`, zero that ever acted (#2089). A false job `if`
    # reports `skipped`, which is indistinguishable from "nothing to do", so it was never red
    # and nobody noticed. `status.yml` learned the same lesson in #1815; this
    # sibling didn't — the definition now lives once, in scripts/lib/pipeline-branch.mjs.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'work-')
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # NOTE: permissions MUST live at the job level — GitHub job-level `permissions` fully
    # OVERRIDES a workflow-level block, so id-token: write has to be here or
    # claude-code-action's OIDC token request fails.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # #2719: hand a refused fix back to the pi worker (workflow_dispatch from GITHUB_TOKEN).
      actions: write
    steps:
      # ── Gate: resolve the PR, enforce the attempt cap, bump the counter ──────────
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MAX = 3
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            // Readable-on-mobile (epic #1336): messages lead with the problem + fix; this
            // provenance/mechanism + run link is the footer.
            const FOOTER = (url) => `\n\n<sub>🤖 Claude Code · fix-bot (#338) · <a href="${url}">failing run</a></sub>`

            // Resolve the open PR for this head branch.
            let pr = (run.pull_requests || [])[0]
            if (!pr) {
              const list = await github.rest.pulls.list({ owner, repo, head: `${owner}:${run.head_branch}`, state: 'open' })
              pr = list.data[0]
            }
            if (!pr) { core.info('No open PR for branch — nothing to fix.'); core.setOutput('proceed', 'false'); return }

            const full = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data
            // #2157: the job `if` above was widened to both lanes (#2089), but THIS inner
            // re-check still only accepted `claude/issue-*` — so every `work-*` PR (the pi
            // worker, which AGENT_HARNESS=pi makes the LIVE lane) bailed here and the fix-bot
            // never acted on a real PR. Same #2089 bug, one spot the fix missed. The two-prefix
            // predicate lives once in scripts/lib/pipeline-branch.mjs; inline it here to match
            // the job `if` (a github-script gate can't import without a checkout, and this runs
            // pre-checkout). Keep these three in lockstep: the helper, the job `if`, this line.
            const isPipelineRef = r => /^(claude\/issue-|work-)/.test(String(r || ''))
            if (full.state !== 'open' || !isPipelineRef(full.head.ref)) {
              core.info('Not an open pipeline PR — skipping.'); core.setOutput('proceed', 'false'); return
            }
            const labels = (full.labels || []).map(l => l.name)
            // Already escalated — don't pile on while a human is in the loop.
            if (labels.includes('status:blocked')) {
              core.info('PR already blocked — standing down.'); core.setOutput('proceed', 'false'); return
            }

            // Attempt count lives in a `ci-fix-attempts:N` label on the PR (also read by #337).
            const attemptLabel = labels.find(n => /^ci-fix-attempts:\d+$/.test(n))
            const attempts = attemptLabel ? Number(attemptLabel.split(':')[1]) : 0

            // The linked issue (from the branch name) is the resume surface for resume-on-comment.
            // Both lanes (#2157): the pi worker's `work-<n>`.
            const m = /^work-(\d+)/.exec(full.head.ref)
            const issueNumber = m ? Number(m[1]) : null

            if (attempts >= MAX) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
                `🔴 **@pmcp — auto-fix gave up after ${attempts} tries; \`${run.name}\` is still failing** on \`${full.head.sha.slice(0, 7)}\`.\n\n` +
                `**Fix:** this one needs a human — take a look, then push a fix or reply to resume.` +
                FOOTER(run.html_url) })
              if (issueNumber) {
                try { await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['status:blocked'] }) } catch (e) { core.warning(`block #${issueNumber}: ${e.message}`) }
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body:
                  `🔴 **@pmcp — auto-fix couldn't get CI green on PR #${pr.number} after ${attempts} tries.**\n\n` +
                  `**Fix:** take a look, then reply here and the pipeline resumes.` +
                  FOOTER(run.html_url) })
              }
              core.setOutput('proceed', 'false'); return
            }

            // Bump the counter (addLabels auto-creates if absent; labels.yml predefines 1–3).
            if (attemptLabel) { try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: attemptLabel }) } catch (e) {} }
            const next = attempts + 1
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [`ci-fix-attempts:${next}`] })

            // #2163 (the #2157 packages/ follow-up): normally the fix-bot's prompt STOPS at a
            // packages/ change (the shared-code HARD GATE). But when the linked issue is a `pkg:*`
            // issue, the owner already approved shared-code work by dispatching it — so the bot MAY
            // fix packages/ (the PR still holds for a human merge behind the packages guard, #339).
            // Resolve the package name(s) from the ISSUE's labels so the prompt can unlock exactly
            // those and no others.
            let packagesAllowed = 'false', pkgNames = ''
            if (issueNumber) {
              try {
                const iss = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data
                const pkgs = (iss.labels || [])
                  .map(l => (typeof l === 'string' ? l : l.name))
                  .filter(n => /^pkg:/.test(n)).map(n => n.slice(4))
                if (pkgs.length) { packagesAllowed = 'true'; pkgNames = pkgs.join(' ') }
              } catch (e) { core.warning(`pkg-label check #${issueNumber}: ${e.message}`) }
            }

            core.setOutput('proceed', 'true')
            core.setOutput('pr_number', String(pr.number))
            core.setOutput('issue_number', issueNumber ? String(issueNumber) : '')
            core.setOutput('head_branch', full.head.ref)
            core.setOutput('base_ref', full.base.ref)
            core.setOutput('attempt', String(next))
            core.setOutput('packages_allowed', packagesAllowed)
            core.setOutput('packages_names', pkgNames)
            core.info(`Fix attempt ${next}/${MAX} for PR #${pr.number} (issue #${issueNumber}); packages_allowed=${packagesAllowed} (${pkgNames || 'none'}).`)

      # Mint a Harness App token so the fix PUSH is App-authored. CRUCIAL: a push made with
      # the default GITHUB_TOKEN does NOT re-trigger workflows (GitHub's loop guard), so a
      # GITHUB_TOKEN-authored fix would never re-run CI — the retry loop would stall after
      # one attempt and never verify its own fix. An App-token push fires `pull_request:
      # synchronize` → CI re-runs → workflow_run gives the fix-bot its next attempt (bounded
      # by the ci-fix-attempts cap). Same reason automerge/resume/schedule-waves use it (#626).
      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # #2719: remember where the branch stood BEFORE the fix, so the guard below can diff the
      # fix against it. The fixer commits but does not push — this workflow pushes (or refuses).
      - name: Record pre-fix head
        if: steps.gate.outputs.proceed == 'true'
        id: prefix
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Model comes from the ONE setting, .claude/pipeline-models.json (#2161) — change it there.
      # No fallback literal on purpose: a broken config fails this step loudly instead of
      # silently running a stale model.
      - name: Resolve model
        if: steps.gate.outputs.proceed == 'true'
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs default)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model: $MODEL (from .claude/pipeline-models.json)"

      # ── The fix attempt ─────────────────────────────────────────────────────────
      # AUTH: headless/unattended → MUST use an API key (never a subscription OAuth token;
      # Anthropic terms). Pinned to the same SHA as claude.yml — keep in sync when bumping.
      # github_token is the App token so the agent's git push re-triggers CI (above).
      - if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1.0.162
        with:
          # Pipeline PRs are pushed by the harness bot, and the action refuses a bot-initiated
          # run unless the bot is allow-listed — without this the fixer never ran on any
          # pipeline PR (#2447; same guard as decompose-on-issue.yml).
          allowed_bots: "nuxt-harness[bot],github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # bypassPermissions REQUIRED (#834/#2165): headless CI denies un-allowlisted tools, so
          # WITHOUT this the fix-bot's every pnpm/git/gh command is permission-denied — it burns all
          # its turns on denials and crashes with max_turns, never reaching the fix (the first real
          # live-lane run, 31589320044, did exactly this). Same reason red-team-daily.yml sets it.
          # max-turns 40 (was 30): a full pnpm install + typecheck + fix + verify cycle is turn-hungry.
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 40 --permission-mode bypassPermissions --disallowedTools 'Bash(git push:*)'"
          show_full_output: true
          prompt: |
            CI failed on this pipeline PR — you are the fix-bot. This is auto-fix attempt
            ${{ steps.gate.outputs.attempt }} of 3 for PR #${{ steps.gate.outputs.pr_number }}
            (branch `${{ steps.gate.outputs.head_branch }}`, linked issue #${{ steps.gate.outputs.issue_number }}).

            The failing workflow was "${{ github.event.workflow_run.name }}":
            ${{ github.event.workflow_run.html_url }}

            Do this, and ONLY this:
            1. Reproduce the failure locally — run the relevant command (e.g. `pnpm -r --filter './apps/*' typecheck`,
               `pnpm lint`, or the failing test/e2e) to see the actual error. Read the failing job's logs if you need to.
            2. Diagnose the root cause and make the MINIMAL fix on this branch. Keep it tightly
               scoped to the failure — do not refactor, do not touch unrelated files.
               NEVER make CI green by DELETING the worker's new code (#2719). If a symbol/menu
               group/key/route is referenced but undefined, IMPLEMENT the missing piece, taking the
               intent from the linked issue (`gh issue view ${{ steps.gate.outputs.issue_number }}`)
               and the latest owner/orchestrator comments on the PR and issue — not just the log. If
               you cannot implement it confidently, do not commit; comment on the issue, @mention
               @pmcp, apply `status:blocked`, and stop. A deterministic check after you rejects any
               commit that removes lines the worker added (blank lines and imports excepted).
            3. SHARED CODE (`packages/`) — read this carefully, it depends on the issue:
               - packages_allowed for this run: ${{ steps.gate.outputs.packages_allowed }} (packages: ${{ steps.gate.outputs.packages_names }}).
               - If packages_allowed is `false`: do NOT modify anything under `packages/`. If the only
                 correct fix would require one, STOP: do not commit. Instead comment on issue
                 #${{ steps.gate.outputs.issue_number }} explaining why, @mention @pmcp, apply the
                 `status:blocked` label to that issue, and end your run.
               - If packages_allowed is `true`: this is a `pkg:*` issue — the owner already approved
                 shared-code work by dispatching it, so you MAY edit ONLY the listed package(s). Before
                 your first edit under `packages/`, unlock the gate for exactly those packages, one per
                 line: `for p in ${{ steps.gate.outputs.packages_names }}; do echo "$p" >> .claude/.package-edit-approved; done`.
                 Keep the change minimal and scoped to the failure; do NOT touch any other package. The
                 PR still holds for a human to merge (the shared-code merge guard), so you are producing
                 the fix, not landing it. Do NOT commit `.claude/.package-edit-approved` (it is gitignored).
            4. Verify green: re-run the command from step 1 and confirm it passes.
            5. Commit with the /commit skill (reference the issue) but do NOT push — the workflow
               checks your commit and pushes it. CI then re-runs automatically; if it still fails,
               the fix-bot will get another attempt (up to the cap).

            If you cannot find a confident fix, do NOT guess or push a speculative change — comment on
            issue #${{ steps.gate.outputs.issue_number }}, @mention @pmcp, apply `status:blocked`, and stop.

      # ── Guard (#2719): refuse a "fix" that deletes the worker's own new code ────────────
      # Compare the fix commit(s) with what the PR's worker commits added. If the fix removes any
      # of those lines (blank lines/imports aside) it is not pushed: the branch is reset, the PR
      # gets the lines listed, and the pi worker is re-run with the CI failure as feedback (the
      # revise path, #2446). Otherwise the fix is pushed as before. Attempt cap and packages/ rules
      # are untouched.
      - name: Guard and push the fix
        if: steps.gate.outputs.proceed == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.prefix.outputs.sha }}
          BASE: ${{ steps.gate.outputs.base_ref }}
          BRANCH: ${{ steps.gate.outputs.head_branch }}
          PR: ${{ steps.gate.outputs.pr_number }}
          ISSUE: ${{ steps.gate.outputs.issue_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(git rev-parse HEAD)"
          # Belt and braces: `git push` is disallowed for the agent, but if it pushed anyway the
          # remote head has moved past $PRE. Judge those commits too; if refused, revert them.
          git fetch -q origin "$BRANCH"
          REMOTE_NOW="$(git rev-parse "origin/$BRANCH")"
          PUSHED=0
          if [ "$REMOTE_NOW" != "$PRE" ] && git merge-base --is-ancestor "$PRE" "$REMOTE_NOW"; then PUSHED=1; fi
          if [ "$HEAD_NOW" = "$PRE" ] && [ "$PUSHED" = 0 ]; then echo "No fix commit — nothing to push."; exit 0; fi
          git fetch -q origin "$BASE"
          git diff "origin/$BASE...$PRE" > "$RUNNER_TEMP/worker.diff"
          git diff "$PRE" "$HEAD_NOW" > "$RUNNER_TEMP/fix.diff"
          if [ "$PUSHED" = 1 ]; then git diff "$PRE" "$REMOTE_NOW" >> "$RUNNER_TEMP/fix.diff"; fi
          node -e '
            const fs = require("fs")
            import("./scripts/lib/fix-removes-worker-code.mjs").then(({ findRemovedWorkerLines }) => {
              const r = findRemovedWorkerLines(fs.readFileSync(process.argv[1], "utf8"), fs.readFileSync(process.argv[2], "utf8"))
              fs.writeFileSync(process.argv[3], JSON.stringify(r))
              process.exit(r.refuse ? 3 : 0)
            })
          ' "$RUNNER_TEMP/worker.diff" "$RUNNER_TEMP/fix.diff" "$RUNNER_TEMP/verdict.json" && ok=1 || ok=0
          if [ "$ok" = 1 ]; then
            if [ "$HEAD_NOW" != "$PRE" ]; then git push origin "HEAD:$BRANCH"; fi
            exit 0
          fi

          echo "refused=true" >> "$GITHUB_OUTPUT"
          git reset -q --hard "$PRE"
          # No force-push: if the agent already pushed, add a revert commit restoring $PRE's tree.
          if [ "$PUSHED" = 1 ]; then bash scripts/revert-pushed-fix.sh "$PRE" "$BRANCH"; fi
          LINES="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1]));console.log(r.removed.map(x=>"- `"+x.file+"`: `"+x.line.trim()+"`").join(String.fromCharCode(10)))' "$RUNNER_TEMP/verdict.json")"
          ERR="$(gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -n 60 || true)"
          {
            echo "> 🤖 **pi.dev harness** · fix-bot guard (#2719) · _auto-fix refused_"
            echo
            echo "🔧 **Auto-fix not pushed: it would delete code this PR was asked to add.** Handing back to the worker to implement the missing piece instead."
            echo
            echo "**Lines the fix would remove:**"
            echo "$LINES"
            echo
            echo "<details><summary>CI failure (\`$RUN_NAME\`) the worker should fix</summary>"
            echo
            echo '```'
            echo "$ERR"
            echo '```'
            echo "[failing run]($RUN_URL)"
            echo "</details>"
            echo
            echo "**Revise instruction:** CI is red. Make it green by IMPLEMENTING what the lines above reference — do not delete them. Use the error text above."
          } > "$RUNNER_TEMP/handback.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/handback.md"
          if [ -n "$ISSUE" ]; then
            CID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --method POST -F body=@"$RUNNER_TEMP/handback.md" --jq .id)"
            gh workflow run work-issue-pidev.yml -f issue="$ISSUE" -f feedback="$CID"
          fi

      # Ship the payload-free invocation trace for the weekly usage rollup (#1064).
      - uses: ./.github/actions/loop-station-trace
        if: always()