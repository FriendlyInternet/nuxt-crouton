name: weekly

# One Monday run, jobs in order (#2892). Before this, the four weekly jobs were separate
# workflows kept in order only by minute-gaps (usage 06:41 → advisor 07:23 relied on a 42-minute
# gap). Now `needs:` carries the order: usage → findings → advisor, plus the branch janitor.
# Later jobs run even if an earlier one failed (`!cancelled()`) so one outage doesn't skip the week.
#
#   usage     — rolls the week's traces into writeups/loop-station/usage.jsonl (#1064)
#   findings  — accountability findings → writeups/loop-station/findings.jsonl (#1570)
#   advisor   — reads the committed history/usage and files ONE recommendation issue (#933)
#   cleanup-merged-branches — lossless janitor, dry-run unless CLEANUP_BRANCHES_APPLY (#644)
#
# usage and findings both commit to main with the Harness App token (#1133): `needs:` also
# stops them racing each other's push.

on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'cleanup-merged-branches: actually delete (false = dry-run report only)'
        type: boolean
        default: false

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  usage:
    permissions:
      contents: write # commit the new usage.jsonl line back to main
      actions: read   # list + download trace artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Push with the Harness App, not GITHUB_TOKEN — see loop-station-inventory.yml (#1133).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the commit-back rebases cleanly
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # List this window's trace artifacts. `gh api` exits non-zero on API
      # failure → the job fails loudly instead of recording a false quiet week.
      - name: List trace artifacts (last 7 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.name | startswith(\"loop-station-trace-\")) or (.name | startswith(\"pi-telemetry-\"))) | select(.expired == false) | select(.created_at >= \"${CUTOFF}\") | \"\(.id) \(.name)\"" \
            > artifacts.txt
          echo "$(wc -l < artifacts.txt) artifact(s) in window (cutoff ${CUTOFF})"

      # Zero artifacts is fine (meta-only record downstream); download failures
      # of individual artifacts are tolerated (an expired/corrupt one shouldn't
      # sink the week), but we log what was dropped.
      - name: Download traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p traces
          COUNT=0; DROPPED=0
          while read -r id name; do
            [ -z "$id" ] && continue
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "traces/${name}.zip" \
               && unzip -o -q "traces/${name}.zip" -d "traces/${name}"; then
              COUNT=$((COUNT+1))
            else
              DROPPED=$((DROPPED+1)); echo "::warning::could not fetch artifact ${name} (${id})"
            fi
          done < artifacts.txt
          echo "downloaded ${COUNT}, dropped ${DROPPED}"

      - name: Aggregate into one usage record
        run: |
          FILES=$(find traces -name '*.jsonl' 2>/dev/null || true)
          # shellcheck disable=SC2086 # file list is intentionally word-split
          node .claude/skills/loop-station/aggregate-usage.mjs --window 7 $FILES > usage.record.json
          cat usage.record.json

      - name: Append to usage.jsonl (idempotent per ISO week)
        id: append
        run: |
          APPENDED=$(node .claude/skills/loop-station/append-usage.mjs < usage.record.json)
          echo "appended=${APPENDED}" >> "$GITHUB_OUTPUT"

      - name: Commit the new data point
        if: steps.append.outputs.appended == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writeups/loop-station/usage.jsonl
          git commit -m "chore(loop-station): record weekly usage rollup [skip ci]"
          # Rebase onto any concurrent main movement, then push.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying…"; sleep $((2 ** i))
          done
          exit 1

      - name: Upload record artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loop-station-usage-record
          path: usage.record.json
          if-no-files-found: ignore

  findings:
    needs: usage
    if: ${{ !cancelled() }}
    permissions:
      contents: write # commit new findings.jsonl lines back to main
      actions: read   # list + download candidate artifacts
      pull-requests: read # resolve each candidate PR's merge state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Push with the Harness App, not GITHUB_TOKEN — see loop-station-inventory.yml (#1133).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # List recent candidate artifacts. A listing failure fails the job loudly
      # (an outage must not read as "no defects"), mirroring the usage rollup.
      - name: List finding-candidate artifacts (last 14 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"loop-station-finding-\")) | select(.expired == false) | select(.created_at >= \"${CUTOFF}\") | \"\(.id) \(.name)\"" \
            > artifacts.txt
          echo "$(wc -l < artifacts.txt) candidate artifact(s) in window (cutoff ${CUTOFF})"

      - name: Download candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidates
          COUNT=0; DROPPED=0
          while read -r id name; do
            [ -z "$id" ] && continue
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "candidates/${name}.zip" \
               && unzip -o -q "candidates/${name}.zip" -d "candidates/${name}"; then
              COUNT=$((COUNT+1))
            else
              DROPPED=$((DROPPED+1)); echo "::warning::could not fetch artifact ${name} (${id})"
            fi
          done < artifacts.txt
          echo "downloaded ${COUNT}, dropped ${DROPPED}"

      # Resolve each candidate's PR merge state → a { "<pr>": "merged|closed|open" } map.
      - name: Build PR status map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find candidates -name '*.json' 2>/dev/null || true)
          PRS=$(for f in $FILES; do node -e "try{const p=require('./'+process.argv[1])._pr;if(p!=null)console.log(p)}catch{}" "$f"; done | sort -u)
          echo '{}' > states.json
          for pr in $PRS; do
            STATE=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
              --jq 'if .merged then "merged" elif .state == "closed" then "closed" else "open" end' 2>/dev/null || echo "open")
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('states.json'));s['$pr']='$STATE';fs.writeFileSync('states.json',JSON.stringify(s))"
            echo "PR #${pr}: ${STATE}"
          done
          cat states.json

      - name: Ingest candidates (merged → confirmed, closed → drop, open → skip)
        run: |
          FILES=$(find candidates -name '*.json' 2>/dev/null || true)
          # shellcheck disable=SC2086 # file list is intentionally word-split
          node scripts/eval-ledger/ingest-findings.mjs --status-map states.json $FILES

      - name: Reconcile escaped defects from the eval-ledger
        run: node scripts/eval-ledger/reconcile-findings.mjs

      - name: Commit new findings (if any)
        run: |
          if git diff --quiet -- writeups/loop-station/findings.jsonl; then
            echo "no new findings — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writeups/loop-station/findings.jsonl
          git commit -m "chore(loop-station): record accountability findings [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying…"; sleep $((2 ** i))
          done
          exit 1

  advisor:
    needs: findings
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # id-token MUST be at the job level for claude-code-action's OIDC (claude-code-action).
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Deterministic gate — no LLM. Writes findings + sets `actionable`.
      - name: Analyze inventory (deterministic gate)
        id: advisor
        run: node .claude/skills/loop-station/advisor.mjs --pretty > advisor-findings.json

      - name: No action needed
        if: steps.advisor.outputs.actionable != 'true'
        run: echo "Loop Station advisor — nothing actionable this week; no issue filed."

      # Model comes from the ONE setting, .claude/pipeline-models.json (#2161) — change it there.
      # No fallback literal on purpose: a broken config fails this step loudly instead of
      # silently running a stale model.
      - name: Resolve model
        id: model
        run: |
          MODEL="$(node scripts/resolve-pipeline-model.mjs default)"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model: $MODEL (from .claude/pipeline-models.json)"

      # Only here does the LLM run — to turn deterministic findings into a human-readable
      # recommendation issue. Pinned to the same SHA as the repo's other claude-code-action
      # workflows — bump together.
      - uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e # v1.0.162
        id: llm
        if: steps.advisor.outputs.actionable == 'true'
        # An LLM outage must not kill the run before the deterministic fallback below —
        # the whole point of this workflow is that actionable findings reach a human (#1037).
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # bypassPermissions REQUIRED (#834/#1036): this prompt has the top-level agent
          # create/update issues via tool calls directly; headless CI denies un-allowlisted
          # tools, so without the grant the agent can't file the issue — the sweep-shaped
          # form, same as a11y-daily.yml / red-team-daily.yml.
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 12 --permission-mode bypassPermissions"
          prompt: |
            You are the **Loop Station advisor** (#933). Read `advisor-findings.json` in
            the repo root — it lists DETERMINISTIC findings about the harness's own
            context budget (always-on tokens, redundancy, scorecard bands, growth since
            the last merge, and — when usage coverage exists — dead-weight skills,
            #1066). For deeper context you may also read
            `writeups/loop-station/history.jsonl` and `writeups/loop-station/usage.jsonl`.

            Scope honesty for `dead-weight` findings: the counts cover CI PIPELINE runs
            only (interactive sessions are not collected yet, #1067), so phrase them as
            "never fired *in CI* over the covered window (N days)" — never "never used".
            Cite the finding's `coverageDays` + `runs` evidence.

            Your job: turn these findings into ONE concise, actionable GitHub issue for
            the maintainer — "an appointment". Steps:
            1. Search open issues labeled `loop-station-advisor`. If one exists, UPDATE it
               (edit the body and/or add a comment) — do NOT open a duplicate. Otherwise
               create a new issue: label `loop-station-advisor`, assignee `pmcp`,
               title like "🔭 Loop Station advisor — <one-line headline>".
            2. Body: for each finding, write *what changed*, *why it matters*, and **1–3
               concrete recommended actions** (e.g. "retire skill X (4.5k tok, restates
               root)", "split the deploy section out of CLAUDE.md"). Cite the evidence
               numbers you keyed off. Note the `tokenizer` — if it's `heuristic`, say the
               numbers are an offline estimate (the API baseline lands on the next merge).
            3. Keep it terse and skimmable. RECOMMEND only — do NOT edit `CLAUDE.md`,
               skills, agents, or any product code, and do NOT open a PR.

            If you POST A COMMENT (when updating), follow `.github/CI-MESSAGE-STYLE.md`: LEAD with the
            single most important finding/recommendation in plain words (a status emoji is fine), and put
            the CI provenance in a small footer at the end:
            `<sub>🤖 agent pipeline (CI) · Loop Station advisor</sub>`
            (Issue bodies are already clearly agent-authored — no footer needed there.)

      # Outage visibility (#1037): the advisor's first real run died on billing_error and
      # the actionable findings evaporated with it. When the LLM step fails, classify why
      # (loud warning annotation + step summary)…
      - uses: ./.github/actions/gate-outage-check
        if: steps.advisor.outputs.actionable == 'true' && steps.llm.outcome == 'failure'
        with:
          gate: loop-station-advisor
          agent-outcome: ${{ steps.llm.outcome }}

      # …and still deliver: the deterministic gate already wrote advisor-findings.json, so
      # post it raw to the advisor issue — no LLM needed for the findings to reach a human.
      - name: Deterministic fallback — findings still reach a human
        if: steps.advisor.outputs.actionable == 'true' && steps.llm.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          {
            echo "⚠️ **Loop Station advisor: the LLM step failed — posting the raw findings so they still reach you.**"
            echo ""
            echo "The deterministic gate found **actionable** findings; human-phrased recommendations will arrive whenever the LLM step recovers."
            echo ""
            echo '```json'
            cat advisor-findings.json
            echo '```'
            echo ""
            echo "<sub>🤖 agent pipeline (CI) · Loop Station advisor — deterministic fallback (#1037) · [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)</sub>"
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label loop-station-advisor --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🔭 Loop Station advisor — actionable findings (LLM outage fallback)" \
              --label loop-station-advisor --assignee pmcp --body-file "$BODY_FILE"
          fi

      # Ship the payload-free invocation trace for the weekly usage rollup (#1064).
      - uses: ./.github/actions/loop-station-trace
        if: always()

  cleanup-merged-branches:
    permissions:
      contents: write # delete refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so `git branch --merged main` is accurate

      - name: Fetch all remote branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Prune merged branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          # APPLY: manual dispatch input wins; otherwise the repo var gates it (default dry-run).
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) && 'true' || (vars.CLEANUP_BRANCHES_APPLY == 'true' && 'true' || 'false') }}
        run: node .claude/skills/housekeeping/prune-merged-branches.mjs
