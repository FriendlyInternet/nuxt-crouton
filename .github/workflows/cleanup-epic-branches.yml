name: Cleanup merged epic branches

# Auto-delete an `epic/<NN>-<slug>` integration branch once its epic→`main` PR merges (#613).
# Epic branches otherwise pile up after the feature lands (the #348 integration-branch flow
# cuts one per epic). When the PR whose head is an `epic/*` branch merges INTO `main`, the
# epic is done and its branch is fully contained in `main` — safe to delete, zero loss.
#
# Scope is deliberately narrow:
#   • head ref starts with `epic/`  AND  base ref is `main`  AND  the PR merged.
# Sub-PRs (head `claude/issue-*`) merging into an epic branch do NOT match — only the final
# epic→main merge does, so we never delete an epic branch that still has open sub-work.

# #2788: an epic→main merge no longer deletes the branch while epic #N is still OPEN — later fixes
# to the same epic need it (#2748/#2764 found it gone). The branch is deleted when the epic CLOSES
# (issues: closed), and only if it is fully contained in main (zero loss).
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  delete-epic-branch:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'epic/') &&
       github.event.pull_request.base.ref == 'main') ||
      github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { shouldKeepEpicBranch } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/epic-branch-keep.mjs`)
            let branches = []
            let epicState
            if (context.eventName === 'pull_request') {
              const branch = context.payload.pull_request.head.ref
              branches = [branch]
              const n = Number(/^epic\/(\d+)-/.exec(branch)?.[1])
              if (n) {
                try {
                  epicState = (await github.rest.issues.get({ ...context.repo, issue_number: n })).data.state
                } catch (e) { core.warning(`Could not read epic #${n}: ${e.message}`) }
              }
            } else {
              // Epic closed: find its integration branch(es) by prefix.
              const n = context.payload.issue.number
              epicState = 'closed'
              const refs = await github.paginate(github.rest.git.listMatchingRefs, { ...context.repo, ref: `heads/epic/${n}-` })
              branches = refs.map(r => r.ref.replace('refs/heads/', ''))
              if (!branches.length) core.info(`No epic/${n}-* branch to clean up.`)
            }
            for (const branch of branches) {
              if (shouldKeepEpicBranch(branch, epicState)) {
                core.info(`Keeping ${branch}: its epic is still open (or state unknown).`)
                continue
              }
              if (context.eventName === 'issues') {
                // Closed epic: only drop the branch if main already contains all of it.
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `main...${branch}` })
                if (cmp.data.ahead_by > 0) {
                  core.warning(`Keeping ${branch}: ${cmp.data.ahead_by} commit(s) not in main.`)
                  continue
                }
              }
              try {
                await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${branch}` })
                core.info(`🧹 Deleted epic branch ${branch} (epic closed).`)
              } catch (e) {
                // Already gone (e.g. "delete branch on merge" beat us) — not an error.
                core.warning(`Could not delete ${branch}: ${e.message}`)
              }
            }
