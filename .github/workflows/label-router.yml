name: Label router (work-this · delegate · plan:approved)

# #3312 (follow-up to #3305) — ONE `issues: labeled` listener instead of three.
# `issues: labeled` cannot filter by label name, so Decompose, Work issue and plan-approved each
# started a run on EVERY label and skipped. This router starts once per label and dispatches the
# right pipeline workflow (all three are now `workflow_dispatch`-only):
#   • `work-this`            (human or Harness App) → epic ⇒ decompose-on-issue-pidev.yml;
#                            plan-first route ⇒ work-issue-pidev.yml mode=plan; else ⇒ build.
#   • `delegate`/`delegate-pi` (Harness App ONLY)   → decompose-on-issue-pidev.yml.
#   • `plan:approved`        (Harness App ONLY)     → build from the approved plan (handoff plan-build).
# Routing rules are unchanged: scripts/epic-route.mjs, scripts/lib/plan-route.mjs, .claude/plan-routing.json.
#
# Workflow-change: merge three labeled-event workflows into one router (#3312).

on:
  issues:
    types: [labeled]

jobs:
  route:
    name: Route label
    if: |
      github.event.label.name == 'work-this' ||
      (github.actor == 'nuxt-harness[bot]' &&
        contains(fromJSON('["delegate-pi","delegate","plan:approved"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HANDOFF_FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch() { # <workflow> <inputs-json>
            # from_label keeps the label-triggered "done → PR #N" note (#3312).
            node scripts/handoff-exec.mjs dispatch "$(jq -nc --argjson i "$ISSUE" --arg w "$1" --argjson inp "$2" '{issue:$i,workflow:$w,inputs:($inp + {from_label:"true"})}')"
          }
          case "$LABEL" in
            plan:approved)
              node scripts/handoff-exec.mjs plan-build "$(jq -nc --argjson i "$ISSUE" '{issue:$i}')"
              ;;
            delegate|delegate-pi)
              dispatch decompose-on-issue-pidev.yml "$(jq -nc --arg i "$ISSUE" '{issue:$i,harness:"pi"}')"
              ;;
            work-this)
              # Only the Harness App or a human may drive the pipeline; other bots (a worker's own
              # label churn) are rejected — breaks the bot re-fire loop (#457/#535).
              node scripts/pipeline-loop-guard.mjs bot-guard "$ACTOR"
              gh issue view "$ISSUE" --repo "$REPO" --json title,body --jq '.title + "\n" + .body' > "$RUNNER_TEMP/route-issue.txt"
              LABELS="$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')"
              if echo ",$LABELS," | grep -q ',plan:approved,'; then
                echo "issue #$ISSUE already carries plan:approved → build"
                dispatch work-issue-pidev.yml "$(jq -nc --arg i "$ISSUE" '{issue:$i}')"
                exit 0
              fi
              # #3208: a big (epic) issue is split, not built.
              if [ "$(node scripts/epic-route.mjs "$LABELS" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).route)')" = "splitter" ]; then
                echo "issue #$ISSUE is an epic → splitter"
                dispatch decompose-on-issue-pidev.yml "$(jq -nc --arg i "$ISSUE" '{issue:$i,harness:"pi"}')"
                exit 0
              fi
              R="$(node scripts/lib/plan-route.mjs "$LABELS" "$RUNNER_TEMP/route-issue.txt")"
              echo "route: $R"
              MODE="$(echo "$R" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).mode)')"
              if [ "$MODE" = "plan" ]; then
                dispatch work-issue-pidev.yml "$(jq -nc --arg i "$ISSUE" '{issue:$i,mode:"plan"}')"
              else
                dispatch work-issue-pidev.yml "$(jq -nc --arg i "$ISSUE" '{issue:$i}')"
              fi
              ;;
          esac
