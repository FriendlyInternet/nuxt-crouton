name: test-card-reply

# The owner answers an epic test card with `ok` or `not ok: <note>` (#2542, epic #2519).
# ok → status:verified. not ok → status:failed + a new sub-issue holding the note.
# Separate from resume-on-comment.yml (that one fires only on status:blocked).

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reply:
    if: |
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'status:to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Handle test reply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          APPLY: 'true'
        run: node scripts/handle-test-reply.mjs
