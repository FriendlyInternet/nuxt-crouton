# layer: stack
name: post-test-card

# After main is deployed to staging, post the epic test card + status:to-test for every epic
# whose sub-issues are all closed and whose merged result is in that deploy (#2541, epic #2519).
# Idempotent: the card carries a marker, so re-running never adds a second one.

on:
  workflow_run:
    workflows: ['Deploy Apps (Cloudflare Workers)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the card (true) or dry-run (false)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: post-test-card
  cancel-in-progress: false

jobs:
  card:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Post test cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          REVIEW_LOGIN_EMAIL: ${{ vars.REVIEW_LOGIN_EMAIL }}
          DIGEST_REPORT_EMAIL: ${{ vars.DIGEST_REPORT_EMAIL }}
          REVIEW_SEED_SECRET: ${{ secrets.REVIEW_SEED_SECRET }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APPLY: ${{ github.event_name == 'workflow_run' && 'true' || (inputs.apply && 'true' || 'false') }}
        run: node scripts/post-test-card.mjs

  # A broken/recovered staging deploy → tell the owner on open test cards for that app (#2870).
  notice:
    if: github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Notify open test cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          APPLY: 'true'
        run: node scripts/notify-app-state.mjs
