# layer: stack
name: E2E

# Boots crouton fixture apps and runs the Playwright smoke (login + CRUD + package
# surfaces). Catches regressions — e.g. a dependency bump or packages/ change that
# breaks a generated app — before merge. See fixtures/* + e2e/CLAUDE.md.
#
# Smart selection (#622): on a PR we run ONLY the fixtures a change can affect, computed
# by the `detect` job from the changed paths + each fixture's e2e.manifest.json `packages`
# list (mirrors deploy-pocs.yml's detect→matrix pattern). Backstops keep coverage honest:
# push to `main` and the nightly schedule always run the FULL matrix.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'fixtures/**'
      - 'e2e/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  # NB: deliberately NO `branches:` filter (#1698). A PR opened against a stacked
  # epic branch and later auto-retargeted to main never re-fires `pull_request`
  # (`base_ref_changed` is not a default activity type), so a `branches: [main]`
  # filter silently skipped typecheck/tests on #1668 and auto-merge treated the
  # absent checks as passing. Running on every PR regardless of base is the fix.
  # And deliberately NO `paths:` filter on pull_request either (#2334): `E2E Gate` below is
  # a REQUIRED check on main, and a required check that never reports blocks the PR forever.
  # The `changes` job re-implements the same path set; the heavy jobs skip on it and the
  # gate still reports (the ci.yml / #1698 shape).
  pull_request:
  schedule:
    - cron: '0 4 * * *'   # nightly full-matrix backstop (selection can't silently hide a regression)
  workflow_dispatch:        # manual full-matrix run

# Cancel superseded PR runs when a new commit is pushed; each PR is its own group
# (ref in the key). cancel-in-progress is event-conditional so the push→main backstop,
# the nightly schedule, and manual dispatches are NEVER cancelled mid-flight. (#1523)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Did this change touch anything e2e cares about? Replaces the workflow-level `paths:`
  # filter so the gate always reports (#2334). Non-PR events are always relevant.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ($EVENT) → relevant (full matrix)."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^(packages/|fixtures/|e2e/|pnpm-lock\.yaml$|\.github/workflows/e2e\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false  (no e2e-relevant paths — fixtures skip, E2E Gate still reports)" >&2
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Decide which fixtures to run. PR → only what's affected; everything else → all.
  detect:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need history for the PR base...head diff
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # CI fixtures.
          ALL="minimal with-pages with-bookings with-assets with-maps with-devtools with-sales with-collab"
          # Packages whose change can affect EVERY fixture (shared base + generator + harness inputs).
          UNIVERSAL="crouton crouton-core crouton-i18n crouton-cli crouton-auth"

          pick=""
          add() { case " $pick " in *" $1 "*) ;; *) pick="$pick $1";; esac; }

          if [ "$EVENT" != "pull_request" ]; then
            # push to main / schedule / manual → full matrix backstop.
            pick="$ALL"
            echo "Non-PR event ($EVENT) → full matrix."
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            # Universal surfaces: the harness itself, the lockfile, or this workflow → run all.
            if printf '%s\n' "$changed" | grep -qE '^(e2e/|pnpm-lock\.yaml$|\.github/workflows/e2e\.yml$)'; then
              pick="$ALL"
              echo "Harness / lockfile / workflow changed → full matrix."
            else
              force_all=false
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  fixtures/*/*)
                    fx=$(printf '%s' "$f" | cut -d/ -f2)
                    case " $ALL " in *" $fx "*) add "$fx";; esac   # ignore non-CI fixtures
                    ;;
                  packages/*/*)
                    pkg=$(printf '%s' "$f" | cut -d/ -f2)
                    case " $UNIVERSAL " in *" $pkg "*) force_all=true; continue;; esac
                    matched=false
                    for fx in $ALL; do
                      if jq -e --arg p "$pkg" '(.packages // []) | index($p)' "fixtures/$fx/e2e.manifest.json" >/dev/null 2>&1; then
                        add "$fx"; matched=true
                      fi
                    done
                    # A changed package no fixture covers → run minimal as a baseline boot check.
                    [ "$matched" = false ] && add minimal
                    ;;
                esac
              done <<< "$changed"
              [ "$force_all" = true ] && pick="$ALL"
            fi
          fi

          # Rebuild in canonical order (dedupes; stable matrix naming).
          ordered=""
          for fx in $ALL; do case " $pick " in *" $fx "*) ordered="$ordered $fx";; esac; done
          arr=$(printf '%s\n' $ordered | sed '/^$/d' | jq -R . | jq -cs .)
          matrix=$(jq -cn --argjson f "$arr" '{fixture:$f}')
          if [ "$(printf '%s' "$arr" | jq 'length')" -gt 0 ]; then any=true; else any=false; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Selected fixtures: ${ordered:-<none>}"

  e2e:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    name: E2E (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every fixture runs inside the official, version-matched Playwright image
    # (Chromium + system libs baked in) — proven on with-assets in #393. This
    # drops the flaky `playwright install --with-deps` apt step that
    # intermittently hung CI for ~an hour. The tag must track @playwright/test
    # ^1.57 — keep them in sync (#395).
    container: mcr.microsoft.com/playwright:v1.64.0-jammy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      # Better-auth needs a secret present; the value is irrelevant in CI.
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      E2E_FIXTURE: ${{ matrix.fixture }}
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repo is checked out as root inside the Playwright image, so mark the
      # workspace safe to keep git from tripping on dubious ownership.
      - name: Trust workspace dir (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the fixture's workspace dependencies
        # '^...' selects the fixture's transitive workspace deps (the dist-consumed
        # @fyit/* packages), excluding the fixture app itself.
        run: pnpm --filter "e2e-fixture-${{ matrix.fixture }}^..." build

      # Type-safety gate for CLI output (#197): regenerate the fixture from its
      # committed schemas with the current generator, then type-check it. This
      # turns a generator regression (e.g. a malformed template) into a red CI
      # run instead of code that only breaks once someone scaffolds a new app.
      - name: Regenerate the fixture (prove current generator output)
        working-directory: fixtures/${{ matrix.fixture }}
        run: node ../../packages/crouton-cli/bin/crouton-generate.js config --force

      - name: Type-check the generated fixture
        run: pnpm --filter "e2e-fixture-${{ matrix.fixture }}" typecheck

      # Lint gate for CLI output (#2740): the repo eslint rules over what the
      # generator just emitted, formatting rules off (eslint.generated.config.mjs).
      # An unused import/variable in a template now fails here, not in a user's app.
      # Some fixtures (with-sales) emit no layers/ output; eslint errors on an
      # empty glob, so skip only when there is genuinely nothing to lint.
      - name: Lint generated output
        run: |
          if ls fixtures/${{ matrix.fixture }}/layers/*/collections >/dev/null 2>&1; then
            pnpm exec eslint -c eslint.generated.config.mjs --no-warn-ignored "fixtures/${{ matrix.fixture }}/layers/*/collections/**/*.{ts,vue}"
          else
            echo "No generated layers/*/collections in ${{ matrix.fixture }} — nothing to lint"
          fi

      # No browser-install step: the Playwright image already ships Chromium at
      # /ms-playwright (PLAYWRIGHT_BROWSERS_PATH preset), so there's nothing to
      # download and no apt step to hang on. Proven on with-assets in #393.
      - name: Run e2e smoke
        run: pnpm test:e2e

      # Visual-QA artifact (#356): upload the self-contained HTML report on EVERY
      # run (not just failures) so each PR carries reviewable visual proof — open
      # index.html to see each test's video, trace timeline, and screenshots.
      - name: Upload visual-QA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-${{ matrix.fixture }}
          path: playwright-report/
          retention-days: 14

  # Always-reporting gate (#2334) — the REQUIRED check on main (ruleset context "E2E Gate").
  # Mirrors ci.yml's `gate`: green when every job succeeded or was legitimately skipped
  # (irrelevant PR → changes=false → detect/e2e skipped → gate green in under a minute).
  gate:
    name: E2E Gate
    if: always()
    needs: [changes, detect, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' needs.json)"
          if [ -n "$bad" ]; then
            echo "::error::E2E Gate FAILED — not every job succeeded or skipped:"; echo "$bad"
            exit 1
          fi
          echo "E2E Gate PASSED"
