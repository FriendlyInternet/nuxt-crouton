# layer: harness
name: Sync issue labels

# Keeps the repo's label set in sync with .github/labels.yml (the source of truth).
# Non-destructive: skip_delete means existing labels are never removed.
# Runs when the label file changes on main, or on demand via the Actions tab.

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml_file: .github/labels.yml
          skip_delete: true
          dry_run: false
