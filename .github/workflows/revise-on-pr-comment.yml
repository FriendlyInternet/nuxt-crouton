name: Revise a pipeline PR from a comment

# A change request typed ON a pi-built PR re-runs the pi worker on that PR's own branch, with
# the comment as its instruction (#2446). The owner reviews on the preview + PR, so that is
# where feedback lands; `lgtm`/✅ there is handled by approve-draft-pr.yml (#2051), and this
# is its other half. Before this, a change request on the PR reached nothing, and the same
# request on the issue went to a responder that cannot edit a pi PR (#2414: "✅ resumed",
# nothing changed).
#
# The decision (which comments count) is scripts/revise-route.mjs — unit-tested, and shared
# with resume-on-comment.yml's issue-side route so the two can't drift.

on:
  issue_comment:
    types: [created]

jobs:
  revise:
    # Cheap prefilter: a human's comment on a PR. The real decision is routePrComment() below.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # workflow_dispatch is the one event a GITHUB_TOKEN may still trigger (no App token needed).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Route the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { routePrComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/revise-route.mjs`)
            const pull_number = context.payload.issue.number
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number })).data
            const c = context.payload.comment
            const route = routePrComment({
              pr: { headRef: pr.head.ref, state: pr.state },
              comment: { body: c.body, authorAssociation: c.author_association, userType: c.user.type },
            })
            core.info(`PR #${pull_number} (${pr.head.ref}): revise=${route.revise} — ${route.reason}`)
            if (!route.revise) {
              // A 🛠 action comment that never reached the worker says so, once per comment (#2707).
              if (route.reply) {
                const marker = `<!-- revise-ignored:${c.id} -->`
                const prior = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pull_number, per_page: 100 })
                if (!prior.some(x => x.body.includes(marker))) {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: pull_number,
                    body: `${marker}\n> 🤖 **pi.dev harness** · agent pipeline (CI) · _comment not routed (#2707)_\n\n`
                      + 'Not sent to the worker — start a line with `**Worker:**` to ask it for a change.' })
                }
              }
              return
            }

            try { await github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: c.id, content: 'eyes' }) } catch (e) {}
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'work-issue-pidev.yml', ref: context.payload.repository.default_branch,
              inputs: { issue: String(route.issue), feedback: String(c.id), branch: route.branch },
            })
            const runs = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/work-issue-pidev.yml`
            await github.rest.issues.createComment({ ...context.repo, issue_number: pull_number,
              body: '> 🤖 **Claude Code** · agent pipeline (CI) · _revision from your comment (#2446)_\n\n'
                + `🔧 **Working on your comment.** The pi worker is re-running on this PR's branch with your comment as its instruction. `
                + `Its commit lands here, or it says plainly that it changed nothing. 🔗 [Follow the run](${runs})` })
