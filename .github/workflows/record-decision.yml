name: Record decision

# An owner decision posted as a comment is copied, word for word, into the ticket's
# `## Decisions` section so the plan/build reviewers (which read the body) judge against it (#3054).
# Recognised by format in scripts/lib/decision-line.mjs (unit-tested); this file only does the edit.
# Workflow-change: new listener for `Decision:` comments; not part of the on-comment router, which
# only wakes for approvals and commands.

on:
  issue_comment:
    types: [created]

concurrency:
  group: record-decision-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  record:
    # Cheap pre-filter; the parser is the real judge. Agent comments (🤖 header) are allowed
    # through, so the interactive agent's "owner decision" comments are not dropped (#3029).
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, 'Decision:') || contains(github.event.comment.body, 'ok:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { parseDecision, decisionLine, appendDecision } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/decision-line.mjs`)
            const c = context.payload.comment
            const number = context.payload.issue.number
            const held = (context.payload.issue.labels || []).some(l => (l.name ?? l) === 'status:blocked')
            const text = parseDecision({ body: c.body, authorAssociation: c.author_association, userType: c.user.type, held })
            if (!text) return core.info('not a decision')
            // Re-read the body: the payload copy may be stale if two decisions land together.
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number })
            const line = decisionLine({ text, date: c.created_at, url: c.html_url })
            const next = appendDecision(issue.body, line, c.html_url)
            if (next === issue.body) return core.info('already recorded')
            await github.rest.issues.update({ ...context.repo, issue_number: number, body: next })
            core.info(`recorded decision from comment ${c.id} on #${number}`)
