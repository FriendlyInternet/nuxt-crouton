name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  # Deliberately NO `branches:` and NO `paths:` filter on pull_request (#1698).
  #
  # `branches: [main]` silently skipped typecheck/tests on #1668: the PR was opened
  # against a stacked epic branch and GitHub auto-retargeted it to main when the
  # parent merged — `base_ref_changed` is not a default `pull_request` activity type,
  # so nothing re-triggered. It was then merged BY HAND (auto_merge: null) with no
  # check having run, because `main` carries no required checks.
  #
  # `paths:` is off because a REQUIRED check must always report. If the workflow is
  # filtered out, the `gate` job never runs and the PR sits on "Expected — waiting"
  # forever. The `changes` job below keeps the expensive jobs off irrelevant PRs
  # instead; the gate always reports.
  pull_request:

# Cancel superseded PR runs when a new commit is pushed; each PR is its own group
# (ref in the key). cancel-in-progress is event-conditional so a push→main run is
# NEVER cancelled mid-flight. (#1523)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which paths changed? Replaces the workflow-level `paths:` filter (#1698) so the
  # workflow — and therefore the `gate` below — always runs and always reports, while
  # the expensive jobs still skip on irrelevant PRs. Same path set the old filter used.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            files="$(git diff --name-only "$base" HEAD)"
          else
            files="$(git show --name-only --pretty=format: HEAD)"
          fi
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^(packages/|apps/|scripts/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false  (no code paths touched — heavy jobs will skip)" >&2
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Was `lint-and-typecheck` — renamed under #1097: the job never ran eslint and
  # only typechecks the MCP server, so the old name overclaimed. App typecheck
  # is the separate `typecheck-apps` job below.
  typecheck-mcp:
    name: Type Check MCP Server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build MCP Server
        run: pnpm --filter @fyit/crouton-mcp build

      - name: Type check MCP Server
        run: pnpm --filter @fyit/crouton-mcp typecheck

  typecheck-apps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The CI backing for CLAUDE.md's "EVERY change requires pnpm typecheck"
    # (#1097) — runs the exact local sweep (`pnpm typecheck` =
    # `pnpm -r --filter './apps/*' typecheck`) so a type regression in an app
    # goes red on the PR instead of on the next unlucky local run. Docs-only
    # PRs never pay for this: the workflow-level `paths:` filter already
    # excludes them. Build set: every workspace dep of every app (`{./apps/*}^...`
    # — packages without a build script are skipped), because the dist-consumed
    # layers must exist before `nuxt prepare` can resolve them.
    name: Type Check Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache app workspace-dependency builds
        id: app-dep-cache
        uses: actions/cache@v4
        with:
          path: packages/*/dist
          key: app-dep-builds-${{ hashFiles('packages/**/*.ts', 'packages/**/*.vue', 'pnpm-lock.yaml') }}

      - name: Build the apps' workspace dependencies
        if: steps.app-dep-cache.outputs.cache-hit != 'true'
        run: pnpm --filter '{./apps/*}^...' build

      - name: Prepare apps
        run: |
          for dir in apps/*/; do
            if [ -f "$dir/nuxt.config.ts" ]; then
              echo "Preparing $dir"
              (cd "$dir" && npx nuxt prepare)
            fi
          done

      - name: Type check apps
        run: pnpm typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  build-kassa:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Dual-target smoke test: kassa must build for both the Cloudflare
    # (cloud) and node-server (venue/Pi) presets, or the unused path silently
    # rots. The build itself is the smoke test — node-server boot was proven in
    # #63. Scoped to kassa to stay fast. (Typecheck used to be skipped here
    # for a "known pre-existing baseline of type errors" — that baseline is
    # gone: kassa typechecks green and is gated by typecheck-apps, #1097.)
    name: Build kassa (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [cloudflare-pages, node-server]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build kassa's workspace dependencies
        # '^...' selects kassa's transitive workspace deps (excludes kassa
        # itself). They are dist-consumed, so they must be built before the app.
        run: pnpm --filter "kassa^..." build

      - name: Prepare Nuxt
        # postinstall (nuxt prepare) is skipped above via --ignore-scripts.
        run: npx nuxt prepare
        working-directory: apps/kassa

      - name: Build kassa (${{ matrix.preset }})
        run: npx nuxt build
        working-directory: apps/kassa
        env:
          NITRO_PRESET: ${{ matrix.preset }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Build-time prerender needs a secret present; value is irrelevant in CI.
          BETTER_AUTH_SECRET: ci-placeholder

  docs-check:
    name: Documentation Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package documentation
        run: node scripts/check-docs.mjs

  sync-validation:
    name: Sync Validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate field types sync
        run: node scripts/validate-field-types-sync.mjs

  mcp-server-tests:
    name: MCP Server Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build MCP Server
        run: pnpm --filter @fyit/crouton-mcp build

      - name: Run MCP Server tests
        run: pnpm --filter @fyit/crouton-mcp test

  test:
    name: Test Suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (skip postinstall scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache layer builds
        id: layer-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/crouton-auth/dist
            packages/crouton-core/dist
            packages/crouton/dist
          key: layer-builds-${{ hashFiles('packages/crouton-auth/**/*.ts', 'packages/crouton-core/**/*.ts', 'packages/crouton/**/*.ts') }}

      - name: Build layer packages
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter '@fyit/crouton-auth' build
          pnpm --filter '@fyit/crouton-core' build
          pnpm --filter '@fyit/crouton' build

      - name: Prepare apps
        run: |
          for dir in apps/*/; do
            if [ -f "$dir/nuxt.config.ts" ]; then
              echo "Preparing $dir"
              (cd "$dir" && npx nuxt prepare)
            fi
          done

      - name: Run all tests (with coverage)
        # Coverage feeds the fallow-audit job (#1256): with real per-function data,
        # CRAP measures untested-complex code instead of degenerating to cyc²+cyc.
        run: pnpm test:coverage

      - name: Upload coverage for the fallow audit
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/coverage-final.json
          retention-days: 1

  changeset-check:
    name: Changeset Check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for package changes
        id: packages-changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'packages/')
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changeset
        if: steps.packages-changed.outputs.changed == 'true'
        run: |
          # Look for new .md files in .changeset/ (excluding README and config)
          CHANGESETS=$(git diff --name-only origin/main...HEAD -- '.changeset/*.md' | grep -v README.md || true)
          if [ -z "$CHANGESETS" ]; then
            echo "::warning::No changeset found. If this PR changes published packages, run 'pnpm changeset' to add one."
          else
            echo "Changeset found: $CHANGESETS"
          fi

  package-check:
    name: Package Validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build crouton package
        run: pnpm --filter '@fyit/crouton' build

      - name: Check package exports (publint)
        run: pnpm check:publint

      - name: Check TypeScript types (attw)
        run: pnpm check:attw

  # The pure `scripts/*.mjs` helpers (deploy-detect, packages-guard, harness-stages,
  # pipeline-context, pipeline-loop-guard, …) carry `node --test` contracts next to them. This
  # job runs them so those contracts actually GATE — most load-bearingly the #1685 WS4 loop-guard
  # (bot-actor · exact-label · depth cap), which must hold before the decomposer emits labels.
  # No pnpm install: the tests use only Node core + the local .mjs modules.
  scripts-tests:
    name: Scripts unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scripts/*.test.mjs
        run: node --test scripts/*.test.mjs

  fallow-audit:
    if: needs.changes.outputs.code == 'true'
    # Rung 1 of the check ladder (#632): the codebase-intelligence gate (#1145).
    # `fallow audit` is diff-scoped — it judges only the changed code
    # (pass/warn/fail) and excludes inherited findings by default, so the
    # existing baseline never walls a PR red; it stops NEW dead code,
    # duplication, and dependency drift at the door. Signal quality was
    # proven by the #1143 triage (712 → 7 unused-file false positives).
    name: Fallow Audit
    runs-on: ubuntu-latest
    # Waits on the test job for its coverage artifact (#1256): real per-function
    # coverage makes the restored maxCrap 30 measure untested-complex code.
    # `changes` added for #1698 — the per-job path gate.
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: audit diffs against the merge-base with main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download vitest coverage
        uses: actions/download-artifact@v4
        with:
          name: vitest-coverage
          path: coverage

      - name: Run fallow audit (diff-scoped, coverage-fed)
        # --coverage-root strips the generating checkout's prefix so per-function
        # matching survives any root mismatch between the two jobs (#1256).
        run: npx fallow audit --coverage coverage/coverage-final.json --coverage-root "$GITHUB_WORKSPACE"

  # THE required check (#1698). Everything above may legitimately skip; this never does,
  # so branch protection has one status that always reports. It fails when any job
  # failed/was cancelled, and passes when every job either succeeded or was skipped.
  # Requiring the path-filtered jobs directly would wedge any PR that doesn't touch
  # code — they'd sit on "Expected" forever.
  gate:
    name: CI Gate
    if: always()
    needs: [changes, typecheck-mcp, typecheck-apps, build-kassa, docs-check, sync-validation,
            mcp-server-tests, test, changeset-check, package-check, scripts-tests, fallow-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' needs.json)"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate FAILED — not every job succeeded or skipped:"; echo "$bad"
            exit 1
          fi
          echo "CI Gate PASSED"
