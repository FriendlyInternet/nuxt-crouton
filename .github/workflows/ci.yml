name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  # Deliberately NO `branches:` and NO `paths:` filter on pull_request (#1698).
  #
  # `branches: [main]` silently skipped typecheck/tests on #1668: the PR was opened
  # against a stacked epic branch and GitHub auto-retargeted it to main when the
  # parent merged — `base_ref_changed` is not a default `pull_request` activity type,
  # so nothing re-triggered. It was then merged BY HAND (auto_merge: null) with no
  # check having run, because `main` carries no required checks.
  #
  # `paths:` is off because a REQUIRED check must always report. If the workflow is
  # filtered out, the `gate` job never runs and the PR sits on "Expected — waiting"
  # forever. The `changes` job below keeps the expensive jobs off irrelevant PRs
  # instead; the gate always reports.
  pull_request:

# Cancel superseded PR runs when a new commit is pushed; each PR is its own group
# (ref in the key). cancel-in-progress is event-conditional so a push→main run is
# NEVER cancelled mid-flight. (#1523)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which paths changed? Replaces the workflow-level `paths:` filter (#1698) so the
  # workflow — and therefore the `gate` below — always runs and always reports, while
  # the expensive jobs still skip on irrelevant PRs. Same path set the old filter used.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # poc | app | package | infra | none — derived from harness.config.mjs by
      # scripts/ci-detect.mjs (#2894). Every job below gates on these, not on a blanket "code".
      stage: ${{ steps.filter.outputs.stage }}
      # JSON list of apps to re-check: changed apps + apps depending on a changed package.
      apps: ${{ steps.filter.outputs.apps }}
      packages: ${{ steps.filter.outputs.packages }}
      pocs: ${{ steps.filter.outputs.pocs }}
      mcp: ${{ steps.filter.outputs.mcp }}
      # CI files themselves (#2335): a workflow-only PR must still be shellchecked — it is
      # exactly the PR where shell mistakes happen, and it used to skip the lint entirely.
      workflows: ${{ steps.filter.outputs.workflows }}
      base_is_epic: ${{ steps.filter.outputs.base_is_epic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            files="$(git diff --name-only "$base" HEAD)"
          else
            files="$(git show --name-only --pretty=format: HEAD)"
          fi
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          FILES="$files" node scripts/ci-detect.mjs

  # Build every @fyit/* package ONCE and hand `packages/*/dist` to the jobs that need it as an
  # artifact (#2894). Before this, typecheck-apps, test and both kassa builds each rebuilt (or
  # separately cache-restored) the same dist. warm-packages stays the single content-addressed
  # cache, so an unchanged package set is a cache hit here and a build only on a real change.
  prepare:
    name: Build packages
    needs: changes
    if: contains(fromJSON('["app","package","infra"]'), needs.changes.outputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/warm-packages

      # tar, not a glob upload: a multi-path glob artifact's root depends on the least common
      # ancestor, a tarball extracts to exactly packages/*/dist every time.
      - name: Pack dist
        run: tar czf package-dist.tgz packages/*/dist

      - name: Upload package dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: package-dist.tgz
          retention-days: 1

  # Type check + test the MCP server. Only packages/crouton-mcp can break it (or infra).
  mcp:
    name: MCP Server (typecheck + tests)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build MCP Server
        run: pnpm --filter @fyit/crouton-mcp build

      - name: Type check MCP Server
        run: pnpm --filter @fyit/crouton-mcp typecheck

      - name: Run MCP Server tests
        run: pnpm --filter @fyit/crouton-mcp test

  # A POC has no app typecheck sweep and no AI reviews (#2894): this is its one check.
  poc-typecheck:
    name: Typecheck POC
    needs: changes
    if: needs.changes.outputs.pocs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/warm-packages

      - name: Typecheck each changed POC
        env:
          POCS: ${{ needs.changes.outputs.pocs }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          for poc in $(echo "$POCS" | jq -r '.[]'); do
            dir="pocs/$poc"
            [ -f "$dir/package.json" ] || { echo "skip $poc (deleted)"; continue; }
            if ! jq -e '.scripts.typecheck' "$dir/package.json" >/dev/null; then
              echo "skip $poc (no typecheck script)"; continue
            fi
            echo "::group::$poc"
            [ -f "$dir/nuxt.config.ts" ] && (cd "$dir" && npx nuxt prepare)
            pnpm --filter "./$dir" typecheck
            echo "::endgroup::"
          done

  typecheck-apps:
    needs: [changes, prepare]
    if: needs.changes.outputs.apps != '[]'
    # The CI backing for CLAUDE.md's "EVERY change requires pnpm typecheck"
    # (#1097) so a type regression in an app goes red on the PR instead of on the
    # next unlucky local run. On a PR it checks only the apps `changes` says are
    # affected (changed, or depending on a changed package); a push to main and
    # infra changes check all of them plus the CLI (`pnpm typecheck`).
    name: Type Check Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download package dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
      - run: tar xzf package-dist.tgz

      - name: Prepare + type check the affected apps
        env:
          APPS: ${{ needs.changes.outputs.apps }}
          STAGE: ${{ needs.changes.outputs.stage }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          for app in $(echo "$APPS" | jq -r '.[]'); do
            dir="apps/$app"
            if [ -f "$dir/nuxt.config.ts" ]; then
              echo "Preparing $dir"
              (cd "$dir" && npx nuxt prepare)
            fi
          done
          if [ "${{ github.event_name }}" = "push" ] || [ "$STAGE" = "infra" ]; then
            pnpm typecheck
          else
            for app in $(echo "$APPS" | jq -r '.[]'); do
              pnpm --filter "./apps/$app" typecheck
            done
          fi

  build-kassa:
    needs: [changes, prepare]
    # Only when kassa itself, or a package kassa depends on, changed (the `apps` list is the
    # dependency walk, scripts/ci-detect.mjs).
    if: contains(fromJSON(needs.changes.outputs.apps), 'kassa')
    # Dual-target smoke test: kassa must build for both the Cloudflare
    # (cloud) and node-server (venue/Pi) presets, or the unused path silently
    # rots. The build itself is the smoke test — node-server boot was proven in
    # #63. Scoped to kassa to stay fast. (Typecheck used to be skipped here
    # for a "known pre-existing baseline of type errors" — that baseline is
    # gone: kassa typechecks green and is gated by typecheck-apps, #1097.)
    name: Build kassa (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [cloudflare-pages, node-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download package dist
        # kassa's workspace deps are dist-consumed; `prepare` built them all once.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
      - run: tar xzf package-dist.tgz

      - name: Prepare Nuxt
        # postinstall (nuxt prepare) is skipped above via --ignore-scripts.
        run: npx nuxt prepare
        working-directory: apps/kassa

      - name: Build kassa (${{ matrix.preset }})
        run: npx nuxt build
        working-directory: apps/kassa
        env:
          NITRO_PRESET: ${{ matrix.preset }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Build-time prerender needs a secret present; value is irrelevant in CI.
          BETTER_AUTH_SECRET: ci-placeholder

  # Does every CHANGED .vue actually compile? (#2182) The pi worker self-heals its OWN broken
  # SFCs in-run (work-issue-pidev.yml), but a hand-written or other-lane PR has no such guard —
  # and an uncompilable `.vue` (an unbalanced/unclosed tag) reaches CI only INDIRECTLY (a build
  # or E2E dev-server 500), never as a clear "this file doesn't parse". This is the direct gate:
  # a deterministic `@vue/compiler-sfc` parse of the diff's `.vue`, ~ms, no app boot — the same
  # scripts/verify-touched-compiles.mjs the worker uses, so the two can't drift.
  compile-check:
    name: Compile changed .vue
    needs: changes
    if: needs.changes.outputs.stage != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # --ignore-scripts skips postinstall (nuxt prepare); we only need @vue/compiler-sfc on disk.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile every changed .vue
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          node scripts/verify-touched-compiles.mjs --base "$BASE"

  test:
    name: Test Suite
    needs: [changes, prepare]
    if: contains(fromJSON('["app","package","infra"]'), needs.changes.outputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (skip postinstall scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # --ignore-scripts above also skips better-sqlite3's native build, so any test
      # that opens a real SQLite DB dies on "Could not locate the bindings file" and
      # has to be skipped in CI — which is how the #1612 seed contract went dark.
      # Same fix already live in deploy-app/docs/pocs (#154). No `|| true` here: in
      # the test job a missing binding must fail loudly, not silently re-skip. (#1880)
      - name: Build better-sqlite3's native binding
        run: pnpm rebuild better-sqlite3

      # ALL @fyit packages' dist, built once by `prepare` (#2073: never a hand-listed subset —
      # `nuxt prepare` below dies on any dist-consumed package that is missing, #1222).
      - name: Download package dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
      - run: tar xzf package-dist.tgz

      - name: Prepare apps
        run: |
          for dir in apps/*/; do
            if [ -f "$dir/nuxt.config.ts" ]; then
              echo "Preparing $dir"
              (cd "$dir" && npx nuxt prepare)
            fi
          done

      - name: Run all tests (with coverage)
        # Coverage feeds the fallow-audit job (#1256): with real per-function data,
        # CRAP measures untested-complex code instead of degenerating to cyc²+cyc.
        run: pnpm test:coverage

      - name: Upload coverage for the fallow audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage
          path: coverage/coverage-final.json
          retention-days: 1

  package-check:
    name: Package Validation
    needs: changes
    if: needs.changes.outputs.packages != '[]' || needs.changes.outputs.stage == 'infra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # publint runs on crouton-core since the @fyit/crouton meta package was deleted
      # (#2290). attw went with it: the meta module was the only package whose
      # declaration files resolved cleanly, so the check validated nothing else.
      - name: Build crouton-core
        run: pnpm --filter '@fyit/crouton-core' build

      - name: Check package exports (publint)
        run: pnpm check:publint

  # Lint the bash embedded in our workflows (#1904). ~700 lines of shell live inside YAML with no
  # local execution path, and every defect found in the pi worker's finish step so far lived
  # there, so any feedback at all is an improvement on none.
  #
  # WHAT IT DOES NOT COVER — stated up front, because an earlier version of this comment claimed
  # otherwise. shellcheck does NOT catch the #1876 shape (`X="$(grep …)"` aborting the step under
  # `set -e` when grep finds nothing). Verified, not assumed: that snippet is clean at
  # `-S warning`, and still clean with `-o all`. SC2311/SC2312 are about a return value being
  # MASKED (`export X="$(…)"`), which is the opposite failure. The guard against #1876 is
  # pi-finish.mjs plus its unit tests — this job is a broad shell-hygiene net, not that guard.
  # Its first run earned its keep anyway: 3 of our `# shellcheck disable=` directives were
  # malformed and had been silently not applying.
  #
  # BLOCKING as of #1904. It shipped warn-only for one commit on the theory that a corpus
  # predating the check would have a backlog worth draining first. Measured instead of assumed:
  # 203 run-blocks produced 14 findings, and 11 of those were manufactured by this job's own
  # extractor — substituting an Actions expression with a literal turned `[ "$X" = "y" ]` into a
  # constant comparison (SC2050/SC2194/SC2157). Substituting a VARIABLE instead removes all 11
  # without weakening a single rule. The real residue was 3 malformed `# shellcheck disable=`
  # directives (SC1125 — our `— prose` suffix is invalid syntax, so those disables were being
  # dropped) and 2 deliberate `find | xargs -I{}` uses, all fixed at the source. Backlog: zero,
  # so there is nothing left for warn-only to protect.
  #
  # (#2894) This job also carries the checks that need only Node core and no `pnpm install`,
  # which used to be five separate jobs each paying for its own checkout + setup:
  # docs-check, schema-drift-check, sync-validation, scripts-tests, shellcheck-workflows.
  node-checks:
    name: Node checks (docs, drift, sync, scripts tests, shellcheck)
    needs: changes
    # Runs on code changes AND on CI-file changes (#2335) — a PR that edits only a workflow
    # or a composite action is the one that most needs the shellcheck and used to skip it.
    if: contains(fromJSON('["app","package","infra"]'), needs.changes.outputs.stage) || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IS_CODE: ${{ contains(fromJSON('["app","package","infra"]'), needs.changes.outputs.stage) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check package documentation
        if: env.IS_CODE == 'true'
        run: node scripts/check-docs.mjs

      # An app's schemas/*.json is a COPY of its package's and forks silently from install
      # onwards (#1766/#1769). Only UNDECLARED behavioural drift fails — intentional divergence
      # lives in scripts/schema-drift.baseline.json with a reason.
      - name: Check app↔package schema drift
        if: env.IS_CODE == 'true'
        run: node scripts/check-schema-drift.mjs

      - name: Validate field types sync
        if: env.IS_CODE == 'true'
        run: node scripts/validate-field-types-sync.mjs

      # #1845: an async function inside the ARRAY form of definePageMeta({ middleware })
      # never gets unctx's await-restore shim, so the Nuxt context is lost across the
      # await and navigateTo() throws during SSR (#1839).
      - name: Check page middleware async context
        if: env.IS_CODE == 'true'
        run: node scripts/check-page-middleware.mjs

      # The pure scripts/*.mjs helpers carry `node --test` contracts next to them — most
      # load-bearingly the #1685 WS4 loop-guard. Node core only, so no install.
      - name: Run scripts/*.test.mjs + scripts/lib/*.test.mjs
        if: env.IS_CODE == 'true'
        # lib/ was outside the glob, so its 8 suites never ran in CI (#2608).
        run: node --test scripts/*.test.mjs scripts/lib/*.test.mjs

      - name: Extract each `run:` block and lint it
        run: |
          set -uo pipefail
          # js-yaml is installed into a SCRATCH dir and reached via NODE_PATH. Two earlier shapes
          # both failed on a runner while passing locally, so the reasoning is recorded here:
          #   • `npm i -g` — a global prefix is NOT on `node -e`'s resolution path from the repo
          #     root ⇒ MODULE_NOT_FOUND.
          #   • `npm i` in the repo root — dies with EUNSUPPORTEDPROTOCOL on the root
          #     package.json's `catalog:` deps, which npm cannot parse (pnpm-only protocol).
          # A scratch dir has no package.json to inherit, so neither applies. Locally this all
          # "worked" only because js-yaml is already in this repo's node_modules as a transitive
          # dep — and this job deliberately runs no `pnpm install`.
          # Errors are NOT redirected to /dev/null: hiding npm's stderr is what made the second
          # failure a silent 2-second exit with nothing to read.
          DEPS=/tmp/wf-deps
          mkdir -p "$DEPS"
          ( cd "$DEPS" && npm init -y >/dev/null && npm i --no-audit --no-fund js-yaml@4 >/dev/null ) \
            || { echo "::error::could not install js-yaml into $DEPS"; exit 1; }
          export NODE_PATH="$DEPS/node_modules"
          node -e 'require("js-yaml")' || { echo "::error::js-yaml unavailable — cannot parse workflows"; exit 1; }
          mkdir -p /tmp/wf-shell
          node -e '
            const yaml = require("js-yaml"), fs = require("fs"), path = require("path");
            let n = 0;
            // Workflows AND composite actions (.github/actions/*/action.yml, #2335): the steps
            // under an action `runs:` carry `run:` blocks exactly like job steps, so lint them too.
            // (No apostrophes in these comments: this whole program sits inside a single-quoted
            // shell string, and one apostrophe ends it — the local extractor caught exactly that.)
            const sources = fs.readdirSync(".github/workflows").filter(f => /\.ya?ml$/.test(f))
              .map(f => ({ label: f, file: path.join(".github/workflows", f), jobsOf: d => d?.jobs || {} }));
            if (fs.existsSync(".github/actions")) {
              for (const dir of fs.readdirSync(".github/actions")) {
                const file = path.join(".github/actions", dir, "action.yml");
                if (fs.existsSync(file)) sources.push({ label: `action-${dir}`, file, jobsOf: d => ({ runs: { steps: d?.runs?.steps || [] } }) });
              }
            }
            for (const { label: f, file, jobsOf } of sources) {
              let doc; try { doc = yaml.load(fs.readFileSync(file, "utf8")) } catch { continue }
              for (const [jobId, job] of Object.entries(jobsOf(doc))) {
                for (const [i, step] of (job.steps || []).entries()) {
                  if (typeof step.run !== "string") continue;
                  // Actions expressions are not shell, so they have to be substituted with
                  // SOMETHING before shellcheck can parse the structure around them. Substitute a
                  // VARIABLE, not a literal: a literal turns `[ "$X" = "y" ]` into a constant
                  // comparison and shellcheck dutifully reports SC2050/SC2194/SC2157 on code that
                  // is fine — 11 of the first run`s 14 findings were this, i.e. the check
                  // inventing its own backlog. The preamble assigns it so SC2154 stays quiet.
                  // (NB: never write a literal expression delimiter inside a `run:` block —
                  // Actions evaluates it at COMPILE time, and an empty one fails the whole
                  // workflow with zero jobs, which is exactly how this job first shipped red.)
                  const body = step.run.replace(/\$\{\{[^}]*\}\}/g, "$GHA_EXPR");
                  const shell = step.shell || job.defaults?.run?.shell || doc.defaults?.run?.shell || "bash";
                  if (!/^bash|^sh/.test(shell)) continue;
                  // `export` + quotes so the preamble is itself clean (a bare assignment trips
                  // SC2034 unused + SC2209 "did you mean $(…)" in every one of the 203 files).
                  const preamble = "#!/bin/bash\nexport GHA_EXPR=\"gha-expr\"\n";
                  fs.writeFileSync(`/tmp/wf-shell/${f}__${jobId}__${i}.sh`, preamble + body);
                  n++;
                }
              }
            }
            console.log(`extracted ${n} run-block(s)`);
          '
          # PINNED. `apt-get install shellcheck` gives whatever the runner image ships (0.9.0 at
          # the time of writing) — for a BLOCKING gate that means a base-image bump can introduce
          # new rules and turn the check red with no code change. The pinned tarball is also the
          # version this job was validated against.
          #
          # No `|| true`: a blocking gate that silently degrades to "shellcheck: command not
          # found" would be the #1751 shape — a check reporting on something it never ran.
          SC_VERSION=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          SHELLCHECK="/tmp/shellcheck-${SC_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          # Excluded, all three because the EXTRACTION makes them meaningless rather than because
          # we tolerate them: SC2086 (word-splitting on a substituted expression), SC2016 (single
          # quotes around a substituted expression), SC1091 (a sourced file that does not exist in
          # /tmp). Everything else at -S warning is on and blocking.
          "$SHELLCHECK" -S warning -e SC2086,SC2016,SC1091 /tmp/wf-shell/*.sh

  # Parses every workflow the way GitHub does (#2970). A duplicate env key merged on 2026-10-28
  # made every worker dispatch fail to parse for ~30 min; nothing in CI parsed workflows.
  # shellcheck/pyflakes integration is OFF: shell is already covered by shellcheck-workflows.
  # Corpus run at introduction: 5 real hits (undeclared secrets in deploy-app.yml), fixed.
  actionlint:
    name: Actionlint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned actionlint and run it
        env:
          AL_VERSION: 1.7.7
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp/actionlint
          /tmp/actionlint/actionlint -version
          /tmp/actionlint/actionlint -color -shellcheck= -pyflakes=

  fallow-audit:
    if: contains(fromJSON('["app","package","infra"]'), needs.changes.outputs.stage)
    # Rung 1 of the check ladder (#632): the codebase-intelligence gate (#1145).
    # `fallow audit` is diff-scoped — it judges only the changed code
    # (pass/warn/fail) and excludes inherited findings by default, so the
    # existing baseline never walls a PR red; it stops NEW dead code,
    # duplication, and dependency drift at the door. Signal quality was
    # proven by the #1143 triage (712 → 7 unused-file false positives).
    #
    # BASELINES (#1714) — three committed artifacts at the repo root, wired in
    # `.fallowrc.json` under `audit` (NOT as flags here, so a local
    # `npx fallow audit` judges a diff exactly as CI does):
    #   .fallow-health-baseline.json · .fallow-dead-code-baseline.json ·
    #   .fallow-dupes-baseline.json
    # Before #1714 only `health` had one, so dead-code and duplication relied
    # solely on the base-snapshot attribution pass — which is position-based and
    # therefore blamed a PR for a debt-carrying file's PRE-EXISTING findings the
    # moment it deleted or moved lines there (reproducer: PR #1708 went red with
    # 12 findings byte-identical on `main`). Regenerate them only when debt is
    # genuinely paid down — see the refresh commands in `.fallowrc.json`.
    #
    # KNOWN, DELIBERATE: this job installs with `--ignore-scripts`, so the audit
    # logs "Nuxt project missing .nuxt/tsconfig.json". Do NOT "fix" that by
    # adding `nuxt prepare` here. fallow extracts the BASE snapshot to its own
    # temp dir and exposes no hook to prepare it, so preparing only the head
    # would make head resolve BETTER than base — widening the very asymmetry
    # that mis-attributes findings. Both sides are currently degraded equally,
    # which is symmetric and therefore safe. (It would also cost a full package
    # build, since `nuxt prepare` needs the workspace packages built first.)
    name: Fallow Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits on the test job for its coverage artifact (#1256): real per-function
    # coverage makes the restored maxCrap 30 measure untested-complex code.
    # `changes` added for #1698 — the per-job path gate.
    needs: [changes, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: audit diffs against the merge-base with main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download vitest coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitest-coverage
          path: coverage

      - name: Run fallow audit (diff-scoped, coverage-fed)
        # --coverage-root strips the generating checkout's prefix so per-function
        # matching survives any root mismatch between the two jobs (#1256).
        run: npx fallow audit --coverage coverage/coverage-final.json --coverage-root "$GITHUB_WORKSPACE"

  # THE required check (#1698). Everything above may legitimately skip; this never does,
  # so branch protection has one status that always reports. It fails when any job
  # failed/was cancelled, and passes when every job either succeeded or was skipped.
  # Requiring the path-filtered jobs directly would wedge any PR that doesn't touch
  # code — they'd sit on "Expected" forever.
  gate:
    name: CI Gate
    if: always()
    needs: [changes, prepare, mcp, poc-typecheck, typecheck-apps, build-kassa, compile-check,
            test, package-check, node-checks, actionlint, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' needs.json)"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate FAILED — not every job succeeded or skipped:"; echo "$bad"
            exit 1
          fi
          echo "CI Gate PASSED"
