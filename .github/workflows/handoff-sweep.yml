name: Hand-off sweep (replay saved pipeline hand-offs)

# Pipeline hand-offs that hit the GitHub API limit or a server error are saved as a
# `handoff-pending` comment + the `handoff:pending` label (#3306). This replays them hourly.
# Each replay checks its own proof first, so a hand-off that half-worked is finished, not redone.
# Red if one is still pending 24 h after it was first tried.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: handoff-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Replays MUST run as the App: the loop guard lets only nuxt-harness[bot] drive the pipeline.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Replay pending hand-offs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HANDOFF_FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/handoff-sweep.mjs
