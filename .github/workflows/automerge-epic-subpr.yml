name: Auto-merge epic sub-PRs
run-name: "${{ github.event_name == 'workflow_dispatch' && format('automerge #{0}', inputs.pr) || 'Auto-merge epic sub-PRs' }}"

# The decompose pipeline's design (task-decompose SKILL): a NON-GATE sub-PR merges
# into its epic branch automatically. The epic branch is a staging area — the only
# human gates are (a) each sign-off gate (schema/UI, handled by resume-on-comment on
# approval) and (b) the eventual epic→main PR. That auto-merge was documented but never
# implemented, so build workstreams (scaffold, deploy) stalled with their PR left open
# (#586 — the non-gate half of #572).
#
# GATE vs NON-GATE: a sign-off gate PR is opened as a DRAFT and held; a build PR is
# opened READY. So `!draft` cleanly selects only the non-gate PRs here — gate PRs stay
# untouched and are merged by resume-on-comment.yml when the owner comments `approve`.
# No double-merge.
#
# V1 PATH (#3501): a PR whose base is epic/<n>--v1-* is NOT merged here. This workflow only answers (decideV1, review +
# red check) and writes the required `Merge decision` check with the App token, then turns GitHub auto-merge on; GitHub
# merges when `CI Gate` + `Merge decision` are green (ruleset docs/pipeline/ruleset-pipeline-v1.json). The App bypasses that
# ruleset, so the one direct-merge fallback (GitHub refuses auto-merge on an already-clean PR) re-checks canMergeNow() itself.
# Off order: variable PIPELINE_V1=off -> dispatch this check (switches auto-merge off) -> disable the ruleset. On: ruleset first.
#
# GREEN GATE (#339): don't auto-merge a PR whose checks are RED. We block on any FAILED
# check-run / commit status for the head SHA; we deliberately do NOT block on merely
# PENDING checks — this workflow's own check-run is in-progress while it evaluates, so
# waiting on "all green" would deadlock on itself. The `check_suite: success` trigger
# re-fires this when a suite goes green, so a PR that was red/pending gets another look.
# (Epic branches carry no REQUIRED checks, so mergeable_state never gates on CI — this
# is what gives "merge once it's green" real teeth there.)
#
# PRESENCE GATE (#1698): "not red" is NOT the same as "checked". On #1668 the `CI`
# workflow never STARTED, so there was nothing red to see and this merged a PR whose
# typecheck/tests had never run — a build break reached main. Absence of failure is not
# evidence of success. So we additionally require that `CI Gate` has actually REPORTED
# `success` for the head SHA before merging. `CI Gate` is ci.yml's always-reports
# aggregator: ci.yml carries no `paths:`/`branches:` filter on `pull_request` precisely
# so this check can never be legitimately absent (#1698), and its `gate` job runs with
# `if: always()`, passing only when every needed job succeeded or legitimately skipped.
#
# This is deliberately asymmetric with the pending rule above: a MISSING CI Gate leaves
# the PR open for a human rather than merging it. GitHub intermittently drops
# `pull_request: opened` events entirely (measured 2026-08-05: 1 of 16 single-commit PRs
# got no runs at all; #1942 merged by hand with zero checks as a result), and the `main`
# ruleset cannot cover this path because it only targets the default branch. A stalled
# sub-PR is cheap; an unchecked merge is what this issue exists about.
#
# SHARED-CODE PAUSE (#339): a build sub-PR that touches packages/ (shared code) is NOT
# auto-merged — it's held for a human. The packages/ HARD GATE (#350) means a change there
# ripples across every consuming app, so it must never land unreviewed, not even onto an
# epic branch. A task-worker isn't supposed to touch packages/ at all; if one slips such a
# change into a build PR, this guard catches it (defence-in-depth, fail-safe: it only ever
# leaves more for a human, never auto-merges more).
#
# Merges with the Nuxt Harness App token (NOT GITHUB_TOKEN): GitHub suppresses workflow
# triggers for GITHUB_TOKEN-initiated events, so a GITHUB_TOKEN merge's
# `pull_request: closed` event would not reach schedule-waves and the chain would stall
# (#572). An App installation token cascades. Merge commit — NOT squash (merge policy).

# RE-EVALUATION (#2013) — the trigger that makes every gate above mean anything.
# `pull_request: opened` fires ~10s after the worker opens the PR, when ci.yml has barely
# started, so `CI Gate` does not exist yet and the presence gate correctly declines. And
# `check_suite` NEVER fires for our own CI: every check on a pipeline PR is created by
# GitHub Actions under GITHUB_TOKEN, and GITHUB_TOKEN-triggered events never start a new
# workflow run (the same recursion guard as #572/#626, documented for the sibling workflow
# in #1884). A one-shot worker makes no second push, so `synchronize` never fires either.
# Net effect: this workflow asked exactly once, always too early, and never again — every
# green sub-PR sat unmerged forever, and the owner merged them by hand.
# `workflow_run` DOES fire for Actions-generated completions. `CI` owns `CI Gate`, so its
# completion is precisely the moment the answer can change. Same cure #1884 applied to
# status.yml.
# LEVEL-TRIGGERED BACKSTOP (#2091). Everything above is EDGE-triggered — a PR event, or a
# workflow completing. A PR held at a moment when the answer was legitimately "not yet" is
# therefore never re-asked, because its edges have all already fired: the pi worker pushes
# exactly once (no `synchronize`), `check_suite` never fires for our own CI, and its `CI` run
# completed long ago. Ten green sub-PRs sat stranded that way — CI went green in the 39-minute
# window before #2013's re-evaluation existed, and nothing retroactively re-asks. Nothing was
# red; the stale "CI Gate never reported" comment even read like an explanation.
#
# #1698 also measured GitHub intermittently DROPPING `pull_request` events (1 in 16). Under a
# purely edge-triggered design every dropped event is a permanent strand.
#
# So: ask again, on a clock. The sweep only supplies CANDIDATES — every gate below (draft,
# green, presence, shared-code, App-token merge) applies identically, so a PR that should be
# held is re-asked and held again, not waved through.
on:
  schedule:
    - cron: '17 * * * *'   # hourly, off-the-hour so it doesn't pile onto :00 with everything else
  pull_request:
    # #3229: `build:approved` IS the reviewer's approval and arrives as a label event — a PR green
    # before approval otherwise waits for an unrelated event. Other labels are filtered out in the script (scripts/lib/automerge-trigger.mjs).
    types: [opened, ready_for_review, synchronize, labeled]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI", "E2E"]   # #3103: main also needs E2E Gate; re-ask when it finishes last
    types: [completed]
  # #2832: an owner `ok` on a held PR is the merge go — don't wait for the next CI event.
  # #2890: the comment no longer triggers this file directly — on-comment.yml's router calls it
  # (kind=automerge-go). The caller's event is still issue_comment, so the branches below that
  # read `issue_comment` keep working unchanged.
  workflow_call:
  # #3361: GitHub drops many scheduled runs, so the merge check can be re-run by hand (or by the
  # hand-off sweep replaying a saved retry). With `pr` it evaluates that PR; empty = sweep all.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate; empty = sweep all open sub-PRs'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  automerge:
    # On a PR event, evaluate it directly; on a check_suite, only when it went green
    # (a red/again-pending suite will re-fire this when it next completes green).
    # `schedule` always runs — it carries no conclusion to filter on; it IS the "ask again".
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'build:approved')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success' &&
        github.event.check_suite.app.slug != 'nuxt-harness') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      # Default branch, never the PR's merge ref: the hold decision must not be editable by the PR it judges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - id: merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER_LOGIN: ${{ vars.PIPELINE_OWNER || 'pmcp' }}
          FLOW_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}   # #3470: what the checks loaded
          PIPELINE_V1: ${{ vars.PIPELINE_V1 }}   # #3501: `off` = the v1 path is skipped, auto-merge on v1 PRs is switched off
          HANDOFF_FALLBACK_TOKEN: ${{ github.token }}   # #3361: writes the retry note when the App is out of allowance
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
           let currentPr = null   // PR being evaluated, so a rate-limit note can name it (#3306)
           try {
            const { owner, repo } = context.repo
            // #3229: `labeled` fires for every label; only `build:approved` is worth a run.
            // Helpers load unguarded from the default-branch checkout: a missing one fails the run loudly.
            const { shouldRunOnEvent } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/automerge-trigger.mjs`)
            const { isDone, requiredCheckState: requiredCheckStateFn, liveCheckRuns, needsLiveFilter, RED_CONCLUSIONS } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/required-check-state.mjs`)
            const { decideLeafMerge, decideV1, withoutMergeDecision, shouldEnableAuto, canMergeNow } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pr-merge-gate.mjs`)
            const { isV1Base, v1Enabled } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/pipeline-version.mjs`)
            const { setAutoMerge, publishMergeDecision, makeMergeIo, isRateLimit } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/v1-merge-io.mjs`)
            const { decideEpicMerge } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/epic-merge-decision.mjs`)
            const { reviewState } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/build-review-state.mjs`)
            if (!shouldRunOnEvent(context.eventName, context.payload)) {
              core.info(`skip: ${context.eventName}/${context.payload.action} label=${context.payload.label?.name}`)
              return
            }
            const BOTS = ['claude[bot]', 'nuxt-harness[bot]']
            const OWNER = process.env.OWNER_LOGIN || 'pmcp'

            // The check that must have REPORTED before we merge (#1698). ci.yml's `gate`
            // job — its display name, which is what the checks API returns.
            const REQUIRED_CHECK = 'CI Gate'

            // Any RED check for this SHA? (failed check-run or failed commit status.)
            // #3429: GitHub can leave a finished run `in_progress` with a conclusion — isDone handles it.
            async function isRed(ref, runs) {
              const redRuns = runs.filter(r => isDone(r) && RED_CONCLUSIONS.includes(r.conclusion))
              let statusRed = false
              try {
                const combined = (await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref })).data
                if ((combined.statuses || []).some(s => ['failure', 'error'].includes(s.state))) statusRed = true
              } catch (e) { core.warning(`combined status for ${ref}: ${e.message}`) }
              return { statusRed, redRuns }
            }

            // Out of API allowance is not a per-PR failure: let the outer handler defer it.

            const { mergeWithRetry, okReplyNote, announceSharedHold } = makeMergeIo({ github, core, owner, repo, env: process.env })

            // Has REQUIRED_CHECK completed successfully for this SHA? Returns one of
            // 'success' | 'pending' | 'missing' so the caller can log why it declined.
            // Missing ≠ passing — that conflation is exactly what #1668 exploited.
            async function requiredCheckState(runs) {
              return requiredCheckStateFn(runs, REQUIRED_CHECK)
            }

            // Resolve candidate PR numbers from whatever event fired.
            const candidates = new Set()
            if (context.eventName === 'schedule' || (context.eventName === 'workflow_dispatch' && !context.payload.inputs?.pr)) {
              // The level-triggered sweep (#2091): there is no event payload to read from, so
              // enumerate the population directly — every open, non-draft PR targeting an epic
              // branch. Drafts are the sign-off gates and are merged by resume-on-comment on
              // approval, never here.
              //
              // The cap is stated out loud rather than silently truncating: a sweep that
              // quietly stops halfway would strand exactly the PRs it exists to rescue, which
              // is the bug in a new costume.
              const SWEEP_MAX = 100
              const open = await github.paginate(github.rest.pulls.list,
                { owner, repo, state: 'open', per_page: 100 })
              const subPrs = open.filter(p => !p.draft && (p.base.ref.startsWith('epic/') || (p.base.ref === 'main' && (p.head.ref.startsWith('epic/') || p.head.ref.startsWith('work-')))))
              for (const p of subPrs.slice(0, SWEEP_MAX)) candidates.add(p.number)
              core.info(`Sweep: ${open.length} open PRs, ${subPrs.length} open non-draft sub-PRs on epic branches.`)
              if (subPrs.length > SWEEP_MAX) {
                core.warning(`Sweep cap ${SWEEP_MAX} reached — ${subPrs.length - SWEEP_MAX} sub-PR(s) NOT evaluated this tick. They will be picked up next hour, but if this recurs the cap needs raising.`)
              }
            } else if (context.eventName === 'workflow_dispatch') {
              candidates.add(Number(context.payload.inputs.pr))
            } else if (context.eventName === 'pull_request') {
              candidates.add(context.payload.pull_request.number)
            } else if (context.eventName === 'issue_comment') {
              candidates.add(context.payload.issue.number)
            } else {
              // check_suite and workflow_run carry the same two useful fields under
              // different keys, and NEITHER carries `pull_request` — reading
              // `github.event.pull_request` on these triggers yields undefined (#2013).
              const src = context.payload.check_suite || context.payload.workflow_run
              for (const p of (src.pull_requests || [])) candidates.add(p.number)
              if (!candidates.size) {
                // `pull_requests` is routinely empty on workflow_run, so this fallback is
                // the normal path there, not an edge case.
                const assoc = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: src.head_sha, per_page: 100 })
                assoc.forEach(p => candidates.add(p.number))
              }
            }
            core.setOutput('candidates', JSON.stringify([...candidates]))   // #3385: the sweep below reads only these
            if (!candidates.size) { core.info('No candidate PRs — nothing to do.'); return }

            for (const pull_number of candidates) {
              currentPr = pull_number
              // Poll mergeability — GitHub computes it asynchronously after an event.
              let pr, state
              for (let i = 0; i < 6; i++) {
                pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data
                if (pr.merged || pr.state !== 'open') break
                state = pr.mergeable_state
                if (state && state !== 'unknown') break
                await new Promise(r => setTimeout(r, 5000))
              }
              if (pr.merged) { core.info(`#${pull_number} already merged.`); continue }
              if (pr.state !== 'open') { core.info(`#${pull_number} not open (${pr.state}).`); continue }

              // Only a non-draft, pipeline-authored, non-gate PR targeting an epic branch.
              if (pr.draft) { core.info(`#${pull_number} is a draft (gate PR) — skip.`); continue }
              // #3501: a PR into a v1 epic branch takes the v1 path (GitHub merges; this only writes the `Merge decision` check).
              const v1Base = isV1Base(pr.base.ref)
              const v1 = v1Base && v1Enabled(process.env)
              if (v1Base && !v1 && pr.auto_merge) {
                // Off switch: PIPELINE_V1=off turns auto-merge off on every open v1 PR, then today's path runs unchanged.
                try {
                  await setAutoMerge(github, pr, 'disable')
                  core.info(`#${pull_number} v1 off — auto-merge switched off`)
                } catch (e) {
                  if (isRateLimit(e)) throw e
                  core.warning(`#${pull_number}: could not switch auto-merge off: ${e.message}`)
                }
              }
              // An epic → main PR (#2832) is evaluated too, but ONLY merges on an owner `ok` (below).
              const epicToMain = pr.base.ref === 'main' && pr.head.ref.startsWith('epic/')
              // A pipeline leaf PR straight into main (head `work-<N>`, no epic) — same rule: ONLY an owner `ok` merges it.
              const leafToMain = pr.base.ref === 'main' && pr.head.ref.startsWith('work-')
              if (!pr.base.ref.startsWith('epic/') && !epicToMain && !leafToMain) { core.info(`#${pull_number} base ${pr.base.ref} not an epic branch — skip.`); continue }
              // A v1 base needs a `Merge decision` on owner PRs too, or the ruleset blocks even a hand merge (decideV1 answers not-pipeline).
              if (!BOTS.includes(pr.user.login) && !v1) { core.info(`#${pull_number} not pipeline-authored (${pr.user.login}) — skip.`); continue }

              // 'dirty' = merge conflicts; 'blocked' = a required check/approval pending. Leave both.
              // An epic → main PR that conflicts with main would otherwise sit forever with no checks
              // (#2875): start the conflict resolver once per head (marker carries the sha).
              if (epicToMain && state === 'dirty') {
                const marker = `<!-- epic-conflict-resolve:${pr.head.sha} -->`
                const prior = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 })
                // Concurrent sweeps all see "no marker yet" for the same head (#2914), so also hold off
                // while ANY resolver note on this PR is under 30 minutes old: one run per branch at a time.
                const recent = prior.some(x => (x.body || '').includes('<!-- epic-conflict-resolve:')
                  && Date.now() - Date.parse(x.created_at) < 30 * 60 * 1000)
                if (!recent && !prior.some(x => (x.body || '').includes(marker))) {
                  const epicIssue = Number(/^epic\/(\d+)-/.exec(pr.head.ref)?.[1])
                  try {
                    const note = await github.rest.issues.createComment({ owner, repo, issue_number: pull_number,
                      body: `${marker}\n<!-- pipeline-note -->\n> 🤖 **pi.dev harness** · agent pipeline (CI) · _epic PR conflicts with main (#2875)_\n\n`
                        + `🔧 **This PR conflicts with \`main\`.** The pi worker is merging \`main\` into \`${pr.head.ref}\` and resolving the conflicts (a merge, never a rebase). Instruction: bring this branch up to date with main.` })
                    const { handoffGuard } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/handoff-exec.mjs`)
                    const rin = { issue: String(epicIssue), feedback: String(note.data.id), branch: pr.head.ref }
                    await handoffGuard({ kind: 'dispatch', issue: pull_number, workflow: 'work-issue-pidev.yml', inputs: rin },
                      () => github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'work-issue-pidev.yml', ref: 'main', inputs: rin }))
                    core.info(`#${pull_number} conflicts with main — started the resolver (#2875).`)
                  } catch (e) { core.warning(`#${pull_number}: could not start the conflict resolver: ${e.message}`) }
                }
              }
              // Facts for the ONE merge decision below (#3103): red, CI Gate, mergeable, owner go.
              // The rule itself lives in scripts/lib/pr-merge-gate.mjs; this file only gathers facts.
              // One check-run list per PR, shared by every reader below (#3306: fewer API calls).
              // #2950: drop check-runs of a CI run a newer run on this commit replaced (a cancelled
              // first run leaves reds that no later run overwrites). Same rule feeds every reader.
              // #3453: the workflow-runs read only matters when a finished red/cancelled check exists.
              const rawRuns = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 })
              let wfRuns = []
              const readWf = needsLiveFilter(rawRuns)
              if (readWf) {
                try {
                  wfRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, head_sha: pr.head.sha, per_page: 100 })
                } catch (e) { core.warning(`#${pull_number}: workflow runs for ${pr.head.sha.slice(0, 8)}: ${e.message}`) }
              }
              core.info(`#${pull_number} workflow-runs read: ${readWf ? 'yes (red/cancelled check present, #2950)' : 'no (no red check)'}`)
              const checkRuns = liveCheckRuns(rawRuns, wfRuns)
              // ONE red read per PR, minus our own `Merge decision` run (it must never wait on itself). A v1 PR never waves
              // first-run reds through (#3470 known limit), so it skips firstRunSplit and its extra reads.
              const rawRed = await isRed(pr.head.sha, withoutMergeDecision(checkRuns))
              const { red, firstRun, noteIgnored } = v1
                ? { red: rawRed.statusRed || rawRed.redRuns.length > 0, firstRun: [], noteIgnored: async () => {} }
                : await (await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/first-run-check.mjs`)).firstRunSplit({ github, core, owner, repo, pull_number, pr, isRed: async () => rawRed, defaultBranch: process.env.DEFAULT_BRANCH })
              // Presence gate (#1698): require that CI Gate actually REPORTED success.
              // 'pending' → the check_suite trigger re-fires this when it completes.
              // 'missing' → the workflow never started (a dropped event); say so loudly
              // once, so the PR is visibly stalled rather than silently merged unchecked.
              const checkState = await requiredCheckState(checkRuns)
              if (checkState !== 'success') {
                if (checkState === 'missing') {
                  core.warning(`#${pull_number}: '${REQUIRED_CHECK}' never reported for ${pr.head.sha.slice(0, 8)} — CI likely never triggered (#1698).`)
                  const marker = '<!-- automerge-ci-missing -->'
                  const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 })
                  if (!comments.some(c => (c.body || '').includes(marker))) {
                    await github.rest.issues.createComment({ owner, repo, issue_number: pull_number,
                      body: `${marker}\n<!-- pipeline-note -->\n⏸️ **Not auto-merged — \`${REQUIRED_CHECK}\` never reported.**\n\n`
                        + `No \`${REQUIRED_CHECK}\` check-run exists for \`${pr.head.sha.slice(0, 8)}\`, so typecheck and tests have not run on this code. That is *not* the same as passing — auto-merge treated absence as success once before and a build break reached \`main\` (#1668), which is why this gate exists (#1698).\n\n`
                        + `**Fix:** GitHub intermittently drops \`pull_request\` events. Push any commit (an empty one works: \`git commit --allow-empty\`) to fire a \`synchronize\` event — checks then run normally and this merges itself.\n\n`
                        + '<sub>🤖 agent pipeline (CI) · auto-merge presence gate (#1698)</sub>' })
                  }
                }
              }

              // Owner go (#2832): an owner `ok` (or legacy lgtm) on the PR, with no non-merge
              // commit after it, releases the shared-code pause and the epic → main hold.
              // Green + presence gates above still apply — `ok` never overrides a red check.
              const prComments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 })
              const prCommits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number, per_page: 100 })
              const { ownerMergeGo } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/owner-merge-go.mjs`)
              const go = ownerMergeGo({ comments: prComments, commits: prCommits, owner: OWNER })
              core.info(`#${pull_number} owner go: ${go.go} (${go.reason})`)
              // The merge decision (#2777, #3103): one pure call owns the whole rule — who said yes
              // (owner `ok` for anything → main, `build:approved` for epic-based PRs), any red check,
              // CI Gate, mergeable. Green + presence still gate: `ok` never overrides a red check.
              // Loaded from the default-branch checkout above — never the PR head, so a PR cannot edit the
              // rule that judges it.
              // #3173: a work-* PR on an epic branch that the reviewer rejected twice (or that needs the owner's call, #3428) is held for the owner,
              // and the owner's `ok` AFTER that hold is the go (no `build:approved` is ever added for it). Pure over prComments: no API call.
              const reviewSt = pr.head.ref.startsWith('work-')
                ? reviewState({ comments: prComments, headSha: pr.head.sha, bots: [`${process.env.APP_SLUG}[bot]`] })
                : { kind: 'pending' }

              if (v1) {
                // #3501 v1: answer from review alone, publish it as the `Merge decision` check; GitHub waits for CI and merges.
                const labels = (pr.labels || []).map(l => l.name)
                const ask = (files) => decideV1({ draft: pr.draft, authorIsPipeline: BOTS.includes(pr.user.login), baseRef: pr.base.ref, headRef: pr.head.ref, labels, go,
                  ownerHold: ['final', 'needs-owner'].includes(reviewSt.kind) ? reviewSt : null, headSha: pr.head.sha, headReview: reviewSt, red, files })
                let answer = ask()
                if (answer.needFiles) {
                  const fl = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number })
                  answer = ask(fl.map(f => f.filename))
                }
                core.info(`#${pull_number} v1 answer: ${answer.code} — ${answer.reason}`)
                const wrote = await publishMergeDecision({ github, owner, repo, pr, rawRuns, appSlug: process.env.APP_SLUG, answer })
                core.info(`#${pull_number} 'Merge decision' ${wrote}.`)
                if (shouldEnableAuto({ answer, autoMergeOn: !!pr.auto_merge })) {
                  try {
                    await setAutoMerge(github, pr, 'enable')
                    core.info(`#${pull_number} v1 auto-merge enabled.`)
                  } catch (e) {
                    if (isRateLimit(e)) throw e
                    core.info(`#${pull_number} enablePullRequestAutoMerge refused: ${e.message}`)
                    // Already clean: GitHub refuses auto-merge. Merge here ONLY when every fact says merge (the App bypasses the ruleset).
                    if (/clean status|already.*mergeable/i.test(e.message || '') && canMergeNow({ answer, ciGate: checkState, red })) await mergeWithRetry(pr, pull_number, false)
                    else core.warning(`#${pull_number}: auto-merge not enabled: ${e.message}`)
                  }
                }
                if (answer.code === 'shared-code') await announceSharedHold({ pull_number, pr, held: answer })
                if (answer.code === 'no-review' && go.go) await okReplyNote({ pull_number, pr, go, reviewSt, prComments })
                continue
              }

              let gate
              if (epicToMain) {
                // epic → main (#3105): the SAME decision the owner's `ok` runs (decideEpicMerge) — both
                // aggregate gates green AND a standing ok. A green that lands after the ok merges here,
                // with no GitHub auto-merge (which would never consult the ok).
                const d = decideEpicMerge({ pr, checkRuns, go })
                gate = { merge: d.action === 'merge', reason: d.reason }
              } else {
                gate = decideLeafMerge({ baseRef: pr.base.ref, headRef: pr.head.ref, labels: (pr.labels || []).map(l => l.name), go, headSha: pr.head.sha, headReview: reviewSt, ownerHold: ['final', 'needs-owner'].includes(reviewSt.kind) ? reviewSt : null, red, firstRun, ciGate: checkState, mergeableState: state })
                // The owner said ok but it cannot count yet: say why, once per reason and commit — never silent.
                if (!gate.merge && gate.code === 'no-review' && go.go) await okReplyNote({ pull_number, pr, go, reviewSt, prComments })
              }
              if (!gate.merge) { core.info(`#${pull_number} not merging — ${gate.reason}.`); continue }

              // Shared-code pause (#339): hold any PR that touches packages/ for a human — and
              // (#2442) any PR that touches .github/workflows/**: the pipeline may now edit its own
              // workflows, but a workflow change never self-merges.
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number })
              // #2777: packages-only + `build:approved` (checked above) releases; workflows never do.
              const { decideSharedCodeHold } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/shared-code-hold.mjs`)
              const hold = decideSharedCodeHold({ baseRef: pr.base.ref, labels: (pr.labels || []).map(l => l.name), files: files.map(f => f.filename) })
              if (hold.action === 'hold' && !go.go) {
                await announceSharedHold({ pull_number, pr, held: hold })
                continue
              }

              if (gate.firstRun?.length) await noteIgnored(gate.firstRun)
              await mergeWithRetry(pr, pull_number)
            }
           } catch (e) {
            // GitHub API allowance exhausted (#3287): not a failure of the PR. End green with a warning;
            // the hourly schedule re-evaluates every open PR. Any other error still goes red.
            // With a PR in hand, a retry of this merge check is saved for the hand-off sweep (#3361).
            let deferMergeCheck
            try {
              ({ deferMergeCheck } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/handoff-exec.mjs`))
            } catch { throw e }
            const r = await deferMergeCheck(e, currentPr, undefined, core.warning)
            if (r.recorded) return
            // Tell the PR it is waiting (#3306). Best effort: with the allowance fully used this
            // comment may itself fail, so the run summary is the guaranteed record.
            try {
              const { rateLimitNote } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/rate-limit.mjs`)
              const note = rateLimitNote(e)
              await core.summary.addRaw(note.body, true).write()
              if (currentPr) {
                const { owner, repo } = context.repo
                const existing = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: currentPr, per_page: 100 })
                if (!existing.some(c => (c.body || '').includes(note.marker))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: currentPr, body: `${note.marker}\n<!-- pipeline-note -->\n${note.body}` })
                }
              }
            } catch (noteErr) { core.warning(`rate-limit note not posted: ${noteErr.message}`) }
           }

      # Build-review safety net (#3218): a green pipeline PR with no review gets ONE dispatch per head SHA.
      # Dispatches with the App token minted above — no `actions: write` here, because on-comment.yml
      # calls this file and a called workflow cannot ask for more than its caller grants.
      # Event runs check only their own PR(s), unless the last full sweep is over 60 min old, then every PR.
      # The hourly sweep and a bare dispatch always check every PR (#3385).
      - name: Restore last full build-review sweep time
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-review-sweep
          key: build-review-full-sweep-${{ github.run_id }}
          restore-keys: build-review-full-sweep-
      - name: Sweep — dispatch build review for green PRs that never got one
        id: sweep
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATES: ${{ steps.merge.outputs.candidates }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo
            const { needsReview, sweepScope, sweepAll } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/build-review-sweep.mjs`)
            const fs = require('fs')
            const stampDir = `${process.env.GITHUB_WORKSPACE}/.build-review-sweep`
            const stampFile = `${stampDir}/last-full`
            let lastFullSweepAt
            try { lastFullSweepAt = fs.readFileSync(stampFile, 'utf8').trim() || undefined } catch { lastFullSweepAt = undefined }
            const scope = sweepScope({ eventName: context.eventName, inputsPr: context.payload.inputs?.pr, candidates: process.env.CANDIDATES, lastFullSweepAt })
            const isWork = x => !x.draft && /^work-\d+$/.test(x.head.ref)
            const checkOne = async (p) => {
              const sha = p.head.sha
              const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 })
              const pr = { headRefName: p.head.ref, baseRefName: p.base.ref, headRefOid: sha, state: 'OPEN', isDraft: p.draft, author: { login: p.user.login } }
              // Cheap early exit: with no comments, needsReview is true only when the gate is green and old enough.
              if (!needsReview({ pr, checks, comments: [] })) return
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: p.number, per_page: 100 })
              const commit = (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data
              if (!needsReview({ pr, checks, comments, headCommitDate: commit.commit.committer.date })) return
              // Marker first: if the dispatch then fails we skip rather than risk a second review (at most once per SHA).
              await github.rest.issues.createComment({ owner, repo, issue_number: p.number,
                body: `<!-- build-review-sweep:${sha} -->\n<!-- pipeline-note -->\n> 🤖 **pi.dev harness** · agent pipeline (CI) · _build review safety net (#3218)_\n\n✅ CI is green on \`${sha.slice(0, 8)}\` but no build review ran — dispatching it now.` })
              const { handoffGuard } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/handoff-exec.mjs`)
              await handoffGuard({ kind: 'dispatch', issue: p.number, workflow: 'build-review.yml', inputs: { pr: String(p.number) } },
                () => github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'build-review.yml', ref: 'main', inputs: { pr: String(p.number) } }))
              core.info(`#${p.number}: dispatched build review for ${sha.slice(0, 8)}`)
            }
            // #3361: a limit / 5xx here ends green with a warning; anything else still goes red.
            try {
              if (scope.all) {
                const why = context.eventName === 'schedule' ? 'schedule'
                  : (context.eventName === 'workflow_dispatch' && !context.payload.inputs?.pr) ? 'dispatch'
                  : `last full sweep ${lastFullSweepAt || 'none'}`
                core.info(`build review sweep: all open PRs (${why})`)
                const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
                const list = open.filter(isWork).slice(0, 50)
                const { stampAt, failed } = await sweepAll(list, checkOne, { warn: core.warning })
                if (stampAt) {
                  fs.mkdirSync(stampDir, { recursive: true })
                  fs.writeFileSync(stampFile, stampAt)
                  core.setOutput('full', 'true')
                } else {
                  core.info(`build review sweep: ${failed} PR read(s) failed — last full sweep time left at ${lastFullSweepAt || 'none'}, so the next event sweeps all PRs again`)
                }
              } else {
                if (!scope.prs.length) { core.info('build review sweep: no candidate PRs on this event'); return }
                core.info(`build review sweep: ${scope.prs.map(n => '#' + n).join(', ')} (event; last full sweep ${lastFullSweepAt})`)
                for (const n of scope.prs.slice(0, 50)) {
                  try {
                    const p = (await github.rest.pulls.get({ owner, repo, pull_number: n })).data
                    if (p.state !== 'open' || !isWork(p)) continue
                    await checkOne(p)
                  } catch (e) { core.warning(`build-review sweep #${n}: ${e.message}`) }
                }
              }
            } catch (e) {
              const { deferOrThrow } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/rate-limit.mjs`)
              deferOrThrow(e, core.warning)
            }
      - name: Save last full build-review sweep time
        if: ${{ !cancelled() && steps.sweep.outputs.full == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-review-sweep
          key: build-review-full-sweep-${{ github.run_id }}-${{ github.run_attempt }}
