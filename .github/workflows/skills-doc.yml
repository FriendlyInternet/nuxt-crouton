name: skills-doc

# Keep writeups/architecture/skills-and-triggers.html in sync with .claude/skills/,
# and every skill/agent tagged with a harness layer (method|stage|stack, epic #952).
# Both checkers use only Node built-ins, so no install step is needed.

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'scripts/gen-skills-doc.mjs'
      - 'scripts/harness-layers.mjs'
      - 'scripts/gen-api-reference.mjs'
      - 'docs/content/8.api-reference/**'
      - 'packages/crouton-core/app/components/**'
      - 'packages/crouton-core/app/composables/**'
      - 'packages/*/crouton.manifest.ts'
      - 'packages/crouton-cli/bin/**'
      - 'packages/crouton-cli/lib/utils/load-fields.ts'
      - 'writeups/architecture/skills-and-triggers.html'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'scripts/gen-skills-doc.mjs'
      - 'scripts/harness-layers.mjs'

# Cancel superseded PR runs when a new commit is pushed; each PR is its own group
# (ref in the key). cancel-in-progress is event-conditional so a push→main run is
# NEVER cancelled mid-flight. (#1523)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify skills doc is up to date
        run: node scripts/gen-skills-doc.mjs --check
      - name: Verify every skill/agent carries a layer tag (#1098)
        run: node scripts/harness-layers.mjs --check
      - name: Verify generated API reference is up to date (#3167)
        run: |
          corepack enable && pnpm install --frozen-lockfile --ignore-scripts
          node scripts/gen-api-reference.mjs --check
