name: loop-station-inventory

# Context-budget inventory (Loop Station WS1, #927). Event-driven: every merge to
# main that touches the always-on harness surface records ONE deterministic data
# point — tokens per CLAUDE.md / skill / agent, lexical redundancy, scorecard,
# per-CI cold-writes — appended to writeups/loop-station/history.jsonl with the
# causing PR attached. The number only changes on these merges, so we measure on
# the merge (cause attached), not on a filler cron. No LLM: count_tokens is free
# tokenization. See .claude/skills/loop-station/.

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'   # imported by CLAUDE.md → always-on too (#2387)
      - '.claude/skills/**'
      - '.claude/agents/**'
  workflow_dispatch: # manual re-measure of the current HEAD

permissions:
  contents: write # commit the new history.jsonl line back to main
  pull-requests: write

concurrency:
  group: loop-station-inventory
  cancel-in-progress: false # never drop a data point mid-write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The data lands via an auto-merge PR (#3490); the App no longer bypasses the `main`
      # ruleset. The App token (not GITHUB_TOKEN) opens the PR so CI Gate / E2E Gate fire.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the commit-back rebases cleanly
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Best-effort: pull the causing PR number out of the merge commit subject
      # ("Merge #NN — …" / "… (#NN)"). Recorded on the data point; empty is fine.
      - name: Derive causing PR
        id: pr
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          NUM=$(printf '%s' "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"

      - name: Gather inventory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOP_STATION_PR: ${{ steps.pr.outputs.number }}
          LOOP_STATION_COMMIT: ${{ github.sha }}
        run: node .claude/skills/loop-station/gather.mjs > loop-station.record.json

      - name: Branch for the data PR (#3490)
        run: |
          git config user.name "nuxt-harness[bot]"
          git config user.email "295566920+nuxt-harness[bot]@users.noreply.github.com"
          bash scripts/data-pr.sh start loop-station-history
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Append to history (idempotent per commit)
        id: append
        run: |
          APPENDED=$(node .claude/skills/loop-station/append-history.mjs < loop-station.record.json)
          echo "appended=${APPENDED}" >> "$GITHUB_OUTPUT"

      - name: Open auto-merge data PR
        if: steps.append.outputs.appended == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash scripts/data-pr.sh publish loop-station-history "chore(loop-station): record context-budget inventory" writeups/loop-station/history.jsonl

      - name: Upload record artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loop-station-record
          path: loop-station.record.json
          if-no-files-found: ignore
