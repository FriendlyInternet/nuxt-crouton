name: Decompose on issue (pi.dev variant)

# WS4 (#1004) of #669 — the code-writing pipeline on pi.dev. A twin of
# `decompose-on-issue.yml` with ONE thing swapped: the agent step
# (anthropics/claude-code-action → pi). It is LIVE: while `vars.AGENT_HARNESS == 'pi'`
# (the current setting) THIS flow — not the claude one — works our `delegate` issues.
#
# HOW A RUN STARTS (the `on:` block and the job `if` below are authoritative — if this
# prose ever disagrees with them, they win and this comment is the thing that's wrong):
#   • `delegate` label — added after creation, OR already present at creation. Only
#     while `vars.AGENT_HARNESS == 'pi'`; otherwise `decompose-on-issue.yml` takes it
#     and this flow yields (#1077 WS7 — one variable flips the harness back).
#   • `delegate-pi` label — always, regardless of AGENT_HARNESS.
#   • `delegate-hard` label — always; escalates to the METERED Claude lane (#1496).
#   • `workflow_dispatch` — an explicit run on any issue number.
#
#   ⚠️ ASYMMETRY: only `delegate` has an `action == 'opened'` clause. `delegate-pi` and
#   `delegate-hard` match `labeled` ONLY — so creating an issue with either one ALREADY
#   applied fires nothing. Add those two as a separate step after the issue exists.
#
# HISTORY — this file was born dormant (dispatch-only, default-OFF, no funded key) and
# every one of those locks has since been removed. Do NOT reintroduce that framing:
# superseded by #1017 (`delegate-pi` trigger), #1077 (the AGENT_HARNESS=pi flip), and
# #1421/#1423 (the funded zai/GLM-5.2 lane). Stale dormancy prose here cost a session
# once — it reads as authoritative while sitting directly above code that refutes it.
#
# WHAT'S DIFFERENT FROM THE CLAUDE FLOW (the WS4 plumbing):
#   • PUSH PATH (#1004 piece 1, the load-bearing change): unlike the reports-only
#     a11y flow (which gets NO git creds), a code-writing run MUST push (epic branch
#     + sub-issues + the worker's PR). Those pushes have to CASCADE — re-trigger the
#     downstream wave/automerge CI — which a GITHUB_TOKEN push does NOT (#572/#626).
#     So we mint a Harness App token and hand it to pi as GH_TOKEN + the git remote.
#   • NO id-token — pi auths via a provider key, not OIDC (drop `id-token: write`).
#   • ARTIFACT-GATE reused VERBATIM — it is harness-agnostic (GITHUB_TOKEN-based
#     PASS/FAIL); we just feed it pi's conclusion. The rich "why" classification
#     reads CLAUDE_EXEC_FILE, which pi doesn't emit yet (#1004 piece 3 / WS3) — the
#     gate degrades to the conclusion-based message, PASS/FAIL is unaffected.
#
# WS4 plumbing is now COMPLETE (#1004) — all three pieces present and LIVE:
#   • Piece 1 — PUSH PATH: the Harness App token (below).
#   • Piece 2 — BOT-ACTOR GUARD: the first job step (re-expresses claude-code-action's
#     `allowed_bots`). ARMED on every label-triggered run; it still no-ops under
#     `workflow_dispatch`, where the actor is the human dispatcher.
#   • Piece 3 — EXEC-LOG ADAPTER: the artifact-gate reads pi's plain-text run log
#     (`steps.pi.outputs.exec_log`) and classifies the failure cause (billing / error /
#     underspecified) — parity with the claude flow's structured-log "why".
#
# TWO LOAD-BEARING pi FACTS (verified on the mac-mini this WS):
#   • NO TURN-CAP FLAG. `pi --help` exposes only model-cycling "Limit" options, not a
#     claude-style `--max-turns`. The ONLY cost/safety bound is the job `timeout-minutes`
#     (45, below) — do NOT assume a per-turn cap exists.
#   • SINGLE-MODEL. pi runs the whole orchestrator→decomposer→worker pipeline on ONE
#     `--model`; it cannot reproduce the Claude harness's per-role tiering (#824 — e.g.
#     planning on Opus). Choose the one model deliberately via the `model` input.
#
# PROMOTED past dispatch-only (#1017): now also fires when a human applies the `delegate-pi`
# label to an issue (mirrors the claude `delegate` flow). The bot-actor guard below is now LIVE
# on that path; on success the run posts a `🤖 pi: done → PR #N` breadcrumb back on the issue.
# Manual `workflow_dispatch` (harness=pi) still works for an explicit run on any issue number.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to decompose (e.g. 660)."
        required: true
        type: string
      harness:
        description: "Opt-in flag (WS7). Must be 'pi' to actually run — default 'off' no-ops."
        required: true
        default: "off"
        type: choice
        options: ["off", "pi"]
      model:
        description: "Model for pi. Default claude-sonnet-5 on the Claude SUBSCRIPTION (provider=pi-claude-cli). glm-5.2 available via provider=zai if you want the GLM plan."
        required: false
        default: "claude-sonnet-5"
        type: string
      provider:
        description: "pi provider. Default pi-claude-cli = Claude SUBSCRIPTION via the mini's `claude` login (#1669 — everything on the subscription). zai = GLM Coding Plan; anthropic = metered PI_PROVIDER_KEY."
        required: false
        default: "pi-claude-cli"
        type: choice
        options: ["pi-claude-cli", "zai", "anthropic"]
  # PROMOTED past dispatch-only (#1017): a human applying the `delegate-pi` label starts a pi
  # run. We fire on EVERY labeled event but the job `if` gates to the exact `delegate-pi` label,
  # so a worker later adding `status:in-progress` does NOT re-fire (the claude flow's #535 lesson).
  # `opened` added for the WS7 flip (#1077): when AGENT_HARNESS=pi, an issue *created with* the
  # plain `delegate` label must land here (the claude flow handles that shape and now yields).
  issues:
    types: [labeled, opened]

jobs:
  decompose-pi:
    # Fire on: a manual dispatch opting into pi, OR the `delegate-pi` label freshly applied
    # to an issue (#1017), OR — when the WS7 flip is ON (vars.AGENT_HARNESS == 'pi', #1077) —
    # the same plain-`delegate` shapes the claude flow handles (which then yields via its own
    # guard). The specific-label checks are what stop a re-fire loop when the worker adds its
    # own labels (#535). Anything else (other labels, AGENT_HARNESS off) → no run.
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.harness == 'pi' || vars.AGENT_HARNESS == 'pi')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'delegate-pi') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'delegate-hard') ||
      (vars.AGENT_HARNESS == 'pi' && github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'delegate') ||
      (vars.AGENT_HARNESS == 'pi' && github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'delegate'))
    runs-on: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    # WS3 (#1696): this whole workflow IS the event-driven pi decompose flow, so the mode is a
    # JOB-level constant — the pi step reads $PIPELINE_MODE (plan-only prompt) and the apply step
    # gates on env.PIPELINE_MODE. (The claude flow lives in decompose-on-issue.yml and never sets it.)
    env:
      PIPELINE_MODE: event-driven
    # No `id-token` — pi uses a provider key, not OIDC. The write scopes are for the
    # Harness App token minted below, which pi uses to push/PR/comment.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # ── PUSH PATH (#1004 piece 1) — mint a Harness App token so pi's pushes CASCADE ──
      # Same app as automerge-epic-subpr.yml. A GITHUB_TOKEN push would NOT re-trigger
      # downstream workflows (#572); an App-installation token does.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}   # writes the App token into the git remote → pushes cascade

      # ── BOT-ACTOR GUARD (#1004 piece 2) — re-expresses claude-code-action's `allowed_bots` ──
      # The claude flow passes `allowed_bots: "nuxt-harness[bot]"`; pi has no such built-in, so we
      # assert it ourselves before pi runs. DORMANT under `workflow_dispatch` — the actor is the
      # human dispatcher, so the `if` skips it. On the `issues: labeled` path only the Harness App's
      # label-add (`nuxt-harness[bot]`) may drive the pipeline; any OTHER bot actor — e.g.
      # `claude[bot]`/`github-actions[bot]` re-firing from a worker's own `status:in-progress`
      # label change — is rejected here, breaking the bot re-fire loop (#457/#535). Humans pass.
      # This matters MORE now (#1685 WS3): the decomposer itself applies `delegate-pi`/`work-this`
      # via the App token, so those cascading label-adds re-enter this flow as `nuxt-harness[bot]` —
      # allowed — while every other bot actor is still refused. The decision is the pure, unit-tested
      # `botActorAllowed` (WS4); this step is I/O only, so the SHIPPED guard IS the tested function.
      # Contract: scripts/pipeline-loop-guard.test.mjs. (After checkout so the script is available.)
      - name: Bot-actor guard
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          ACTOR: ${{ github.actor }}
        run: node scripts/pipeline-loop-guard.mjs bot-guard "$ACTOR"

      # ── CLAIM GUARD (#1890) — is someone already on this issue? ──────────────────────
      # Five workflows stamped `status:in-progress` and NOTHING read it, so two runners could
      # build the same issue: #1478 started 8 min after #1473 closed its issue, and #1889 opened
      # while #1888 was open. This is the read side. Facts are gathered here (API); the DECISION
      # is the pure, unit-tested `decideClaim` — so the shipped guard IS the tested function.
      # Contract: scripts/pipeline-loop-guard.test.mjs.
      - name: Gather claim facts
        id: claim-facts
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ inputs.issue || github.event.issue.number }}')
            // Gathering lives in scripts/claim-facts.mjs so BOTH pi lanes share one
            // implementation (#2027). It used to be a byte-identical block in each workflow,
            // which is how the wedge got half-fixed: repairing the worker's copy left the
            // decomposer refusing exactly what the worker no longer did. Unit-tested against a
            // fake Octokit — the two subtle fields (`self.pr`, `baseRef`) are the ones whose
            // absence refused #1791 five times. Contract: scripts/claim-facts.test.mjs.
            const { gatherClaimFacts } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/claim-facts.mjs`)
            const facts = await gatherClaimFacts({ github, context, issueNumber: issue_number, core })
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/claim-facts.json`, JSON.stringify(facts))
            core.info(`claim facts: ${JSON.stringify(facts)}`)
      - name: Claim guard
        id: claim
        run: node scripts/pipeline-loop-guard.mjs claim-guard < "$RUNNER_TEMP/claim-facts.json"

      - uses: pnpm/action-setup@v4
        with:
          # per-job dest — the default ~/setup-pnpm collides between the two
          # self-hosted runners on the mac mini box (ENOTEMPTY, #1255)
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Warm @fyit/* dist so the agent's `crouton init`/generate/migrate doesn't cold-build
      # ~30 packages one-at-a-time mid-run (the #1213/#1247 tax — ~15-20 min). Content-addressed
      # cache + build-all on miss; a warm cache makes this ~seconds. (#1222)
      - name: Warm @fyit package builds
        uses: ./.github/actions/warm-packages

      # Timestamp the run start so the artifact-gate distinguishes "produced this run"
      # from pre-existing comments/PRs.
      - id: t0
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ── The agent: pi.dev (replaces claude-code-action) ──────────────────────────
      # GH_TOKEN = the App token → pi's `gh`/git operations (sub-issues, epic branch,
      # the worker PR) act as the Harness App and cascade. ANTHROPIC_API_KEY = the
      # funded metered key (NOT a subscription — subscription OAuth must not back CI).
      - id: pi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Everything on the Claude SUBSCRIPTION (#1669). delegate-hard still escalates,
          # but now by MODEL (sonnet → opus) on the same subscription provider — no metered
          # lane. NO ANTHROPIC_API_KEY: pi-claude-cli uses the mini's `claude` login.
          PI_MODEL: ${{ inputs.model || (github.event.label.name == 'delegate-hard' && 'claude-opus-4-6') || 'claude-sonnet-5' }}
          PI_PROVIDER: ${{ inputs.provider || 'pi-claude-cli' }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # PIPELINE_MODE=event-driven is inherited from the JOB-level env (above). The pi prompt
          # branches on it to the PLAN-ONLY directive (#1696); the apply step gates on it too.
        run: |
          set -uo pipefail
          command -v pi >/dev/null 2>&1 || npm i -g @earendil-works/pi-coding-agent
          # The Harness App identity for any commits pi makes (so they're attributable
          # and not a masquerading human — the #862 lesson).
          git config user.name  "nuxt-harness[bot]"
          git config user.email "nuxt-harness[bot]@users.noreply.github.com"
          LOG="decompose-pidev-exec-${{ github.run_id }}.log"
          START=$(date +%s)
          # Front-load the CANONICAL operating contract (#1022) so pi does not stall-and-ask
          # while headless (the #839 failure) and follows the same non-negotiable rules a Claude
          # task-worker does. The contract text lives in ONE place — .claude/agents/pi-operating-
          # contract.md — and is `cat` into the prompt verbatim here AND in work-issue-pidev.yml,
          # so the two flows can't drift (they were byte-identical hand-maintained copies before).
          # That file is PURE PROSE by contract: no frontmatter/headers — it is injected raw.
          PROMPT_FILE="decompose-pidev-prompt-${{ github.run_id }}.txt"
          cat .claude/agents/pi-operating-contract.md > "$PROMPT_FILE"
          # ── The task, by mode (#1696) — pi PLANS, code APPLIES ────────────────────────
          # EVENT-DRIVEN: two failure modes killed the earlier attempts. (1) `/task-decompose` hands
          # off by SPAWNING an Agent tree pi can't drive → the #1381/#1706 3-min no-op. (2) Having pi
          # hand-build `gh issue create` with rich bodies via `$(cat <<EOF)` → the #1001 shell trap
          # (`unexpected EOF … )`, exit 2) → zero issues, then pi FABRICATED success (#1706 session
          # log). BOTH are removed by making pi ONLY emit a PLAN (JSON, no gh/git/heredoc), which a
          # deterministic apply step (scripts/apply-decompose-plan.mjs, execFile array-args) turns
          # into real issues. pi cannot fabricate what code creates. The claude flow
          # (decompose-on-issue.yml) still spawns in-process and is untouched.
          if [ "${PIPELINE_MODE:-}" = "event-driven" ]; then
            cat >> "$PROMPT_FILE" <<'PI_ED'
          EVENT-DRIVEN DECOMPOSE — PLAN ONLY. You are the task-decomposer. Do NOT run `/task-decompose`, do NOT spawn any subagent, and do NOT run any `gh`, `git`, or issue-mutating command. Your ONLY output is a plan file that a deterministic step will apply. Concretely:
          1. READ the target issue (use `gh issue view` to read only — reading is fine, mutating is not).
          2. Apply the LEAF TEST: single coherent change, bounded file set, clear/testable acceptance, one focused run.
          3. Using your file-writing tool (NOT a shell heredoc — bodies contain emoji/backticks and shell quoting breaks, #1001), write a file named exactly `decompose-plan.json` in the current working directory, as valid JSON — ONE of these three shapes:
             - Single leaf: {"leaf": true}
             - Split: {"leaf": false, "children": [ {"title": "...", "body": "...markdown with ## 👤 For humans / ## 🤖 For agents / ## 🧪 How to test...", "labels": ["type:...","<component>"], "needsSplit": false, "blockedBy": []}, ... ]} — 2 to 6 children, one coherent concern each. Set needsSplit=true for a child that itself still needs decomposing, false for a ready leaf. Exactly one `type:*` label plus a real component label per child (unknown labels are dropped). Do NOT put a pipeline block or Dedup line in the body.
             - ORDERING between children (#1750): `blockedBy` lists the SIBLING INDICES (0-based positions in this same children array — NOT issue numbers, which do not exist yet) that a child must wait for. Use it whenever a child cannot be built until another lands: it needs the other's code to exist, its schema, its migration, its API. Only children with `blockedBy: []` are dispatched on the first pass; the rest are created and linked, and each is dispatched automatically when its last blocker closes. Getting this right is what stops several agents building against preconditions that do not exist yet on a serial runner (the #1713 case: three leaves dispatched in five seconds, two of which could not succeed). Be honest in BOTH directions — do NOT invent a dependency between genuinely independent children, because that needlessly serialises work that should run in parallel. A self-reference, an out-of-range index, or a dependency cycle is a hard plan error.
             - ALREADY-APPROVED CHECK FIRST (#1828): if this epic ALREADY carries a "🎨 Design sign-off needed before building" comment from a prior run AND the owner has since replied approving it (`lgtm`/`approve`) or answering the forks, the design is DECIDED — do NOT hold again (re-holding an answered epic is the bug). Emit a SPLIT plan whose children BUILD the app on the approved schema + the owner's answers (scaffold/generate, implement each collection, the chosen views). Read the whole comment thread to recover the decided design before splitting.
             - DESIGN SIGN-OFF HOLD (#1821): otherwise, if the epic needs a human DESIGN DECISION before any code — a genuinely ambiguous data model or UI layout, or a fork with no defensible default (e.g. which split strategy, which balance view) — and there is NO prior hold+approval — do NOT create "decide & sign off" children (a code worker cannot build a decision and will deadlock). Instead HOLD: {"signoff": {"summary": "one short paragraph: why we're holding", "questions": ["the real fork to decide", "..."], "schema": {"collection": "name", "fields": { <crouton fieldsFile JSON: fieldName → {type, ...}> }}, "diagram": { <optional ticket-excalidraw graph.json: nodes+edges> }, "ui": "<optional self-contained HTML mockup>"}}. Propose your BEST-GUESS schema/UI so the human reacts to something concrete, and list the genuine forks as `questions`. The apply step renders these (a schema field-table, a diagram, a UI mockup screenshot), posts them on the epic, and holds `status:blocked`; the owner's `lgtm` reply resumes into build children. Include `schema` whenever the data model is the ambiguity; `diagram`/`ui` are optional. Only hold when the ambiguity is real — a well-specified epic just splits.
          4. After writing decompose-plan.json, STOP. Do not create issues, branches, PRs, or labels yourself — the apply step does all of that from your plan. Writing a correct decompose-plan.json (split, leaf, OR signoff hold) IS your entire deliverable — a design sign-off hold is a complete, successful outcome, not a failure.
          PI_ED
            printf 'The target issue is #%s. Read it and write decompose-plan.json now.\n' "$ISSUE" >> "$PROMPT_FILE"
          else
            printf '/task-decompose #%s\n' "$ISSUE" >> "$PROMPT_FILE"
          fi
          # Confirmed on the mac-mini (#888): pin provider + load skills via --skill.
          # GHA runs `run:` steps with bash -e; `set -uo pipefail` above does not clear it.
          # So the instant `pi | tee` fails (pipefail), -e aborts the script BEFORE
          # RC/conclusion/exec_log are written — the artifact-gate then has no exec_log to
          # read and posts the generic "no deliverable" instead of naming the cause (the
          # #1299 billing case). Disable errexit around JUST this pipeline; PIPESTATUS[0]
          # still carries pi's real exit code. (NB: a trailing `|| true` does NOT work — it
          # runs `true` as its own pipeline, clobbering PIPESTATUS[0] to 0 and masking the
          # failure as success. Verified empirically, #1299.)
          set +e
          # --approve: trust the project so pi loads the lean .pi/settings.json CI profile AND the
          # .pi/extensions/ completion-enforcer (#1782/#1764). Without it the untrusted runner path
          # silently falls back to the global 28-extension profile (incl pi-ask-user) + ~2min startup.
          # DEDUP (#297) — the decomposer is the only pi lane that creates issues, so the
          # create-time dedup gate belongs here and nowhere else. The interactive path is
          # enforced by a PreToolUse hook, which cannot reach a CI run.
          printf 'BEFORE creating any sub-issue: search open AND recently-closed issues for the same work (gh issue list --search). If one already covers it, REUSE it — link it as the child instead of minting a duplicate. Ephemeral runs cannot remember what they filed last time, so the duplicate is the default failure here, not the exception. Every issue body you create MUST carry a "Dedup-checked: <what you searched, what you found>" line.\n' >> "$PROMPT_FILE"
          pi --print --approve --provider "$PI_PROVIDER" --model "$PI_MODEL" --skill .claude/skills \
            "$(cat "$PROMPT_FILE")" 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          END=$(date +%s)
          echo "wall=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "conclusion=$([ "$RC" -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
          # Piece 3 (exec-log adapter): hand the plain-text run log to the artifact-gate so it can
          # classify WHY a run produced nothing (pi emits no structured execution_file like claude).
          echo "exec_log=$LOG" >> "$GITHUB_OUTPUT"

      # ── Apply the decompose plan (#1696) — DETERMINISTIC create/link/label ──────────────
      # pi wrote decompose-plan.json (reasoning only — no gh/git/heredoc). This step turns it into
      # REAL issues via scripts/apply-decompose-plan.mjs, which shells out to `gh` with execFile
      # ARRAY ARGS — the body never touches a shell parser, so the #1001/#1706 `$(cat <<EOF)` break
      # is impossible, and because CODE creates the issues there is nothing for pi to fabricate.
      # It resolves the epic branch here (git), injects the WS2 block, sanitizes labels against
      # .github/labels.yml, creates + links (sub-issues API) + labels each child. A missing/empty
      # plan is a loud, honest failure the artifact-gate then reports.
      - name: Apply decompose plan
        if: ${{ env.PIPELINE_MODE == 'event-driven' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ ! -f decompose-plan.json ]; then
            echo "::warning::no decompose-plan.json — pi produced no plan; the artifact-gate will fail this run."
            exit 0
          fi
          echo "── decompose-plan.json ──"; cat decompose-plan.json; echo
          # Resolve pipeline context off the target's WS2 block (epic/depth/epic_branch).
          BODY="$(gh issue view "$ISSUE" --repo "$REPO" --json body -q .body)"
          EPIC="$(printf '%s' "$BODY" | node scripts/pipeline-context.mjs read epic)"
          DEPTH="$(printf '%s' "$BODY" | node scripts/pipeline-context.mjs read depth)"
          EPIC_BRANCH="$(printf '%s' "$BODY" | node scripts/pipeline-context.mjs read epic_branch)"
          EPIC="${EPIC:-$ISSUE}"; DEPTH="${DEPTH:-0}"
          # No epic_branch on the issue → this is a top-level epic; resolve/create epic/<EPIC>-<slug>.
          if [ -z "$EPIC_BRANCH" ]; then
            git fetch origin main --quiet
            EPIC_BRANCH="$(git ls-remote --heads origin "epic/${EPIC}-*" | sed 's#.*refs/heads/##' | head -n1)"
            if [ -z "$EPIC_BRANCH" ]; then
              SLUG="$(gh issue view "$ISSUE" --repo "$REPO" --json title -q .title \
                | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')"
              EPIC_BRANCH="epic/${EPIC}-${SLUG}"
              git push origin "origin/main:refs/heads/${EPIC_BRANCH}" && echo "created epic branch ${EPIC_BRANCH}"
            else
              echo "reusing epic branch ${EPIC_BRANCH}"
            fi
          fi
          echo "context: epic=${EPIC} depth=${DEPTH} epic_branch=${EPIC_BRANCH}"
          APPLY_OUT="$RUNNER_TEMP/apply-out.txt"
          node scripts/apply-decompose-plan.mjs apply decompose-plan.json \
            --repo "$REPO" --target "$ISSUE" --epic "$EPIC" --epic-branch "$EPIC_BRANCH" --depth "$DEPTH" \
            | tee "$APPLY_OUT"

          # A design sign-off hold (#1821) renders artifacts (schema table / diagram / mockup) into
          # writeups/**; commit them to the epic branch so the raw URLs referenced in the posted
          # comment resolve. Uses the App token remote so the push is authenticated.
          # `|| true`: a split/leaf plan has no SIGNOFF_ARTIFACTS line, so grep exits 1 — under
          # pipefail + the GHA `bash -e` shell that would abort the step AFTER the children were
          # already created, reddening every non-signoff decompose run (#1821 regression).
          ARTIFACTS="$(grep '^SIGNOFF_ARTIFACTS ' "$APPLY_OUT" | head -1 | cut -d' ' -f2- || true)"
          if [ -n "$ARTIFACTS" ]; then
            echo "committing signoff artifacts to ${EPIC_BRANCH}: $ARTIFACTS"
            # BEST-EFFORT — the sign-off hold (comment + status:blocked + the inline schema table) is
            # ALREADY posted; committing the PNGs only makes the comment's raw-URL images resolve. So
            # this must NEVER fail the run (the GHA shell is `bash -e`, which is what turned an earlier
            # push failure into a red run even though the hold succeeded, #1821). Run it in a `set +e`
            # subshell with a catch-all `|| warn` so the step always exits 0.
            (
              set +e
              git config user.name  "nuxt-harness[bot]"
              git config user.email "nuxt-harness[bot]@users.noreply.github.com"
              # Fetch the epic branch to FETCH_HEAD (no remote-tracking ref exists — checkout was depth-1
              # on main) and branch off it, so the push is a fast-forward. Fallback: branch off HEAD.
              git fetch origin "$EPIC_BRANCH" --quiet 2>/dev/null \
                && git checkout -B "$EPIC_BRANCH" FETCH_HEAD 2>/dev/null \
                || git checkout -B "$EPIC_BRANCH" 2>/dev/null
              # -f: the rendered PNGs live under writeups/schema-reviews (and ui-mockups), which the
              # global `*.png` .gitignore rule covers (only writeups/diagrams + ui-proposals are
              # allowlisted). These are an explicit, known-safe sign-off artifact list, so force past
              # the ignore — without -f `git add` silently skips the PNG and the comment's image 404s.
              for f in $ARTIFACTS; do [ -f "$f" ] && git add -f -- "$f"; done
              if git diff --cached --quiet; then
                echo "no artifact changes to commit"
              else
                git commit -q -m "docs(root): design sign-off artifacts for #${ISSUE} (#1821)" \
                  -m "Rendered by the decompose signoff hold; referenced from the epic comment."
                git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${EPIC_BRANCH}" 2>&1 | tail -2
              fi
            ) || echo "::warning::signoff artifact commit failed (non-fatal) — the hold + inline schema table are already posted"
          fi

      # ── Artifact-gate (#461) — PASS/FAIL logic reused from decompose-on-issue.yml ────────
      # Harness-agnostic: PASS/FAIL is GitHub-state via GITHUB_TOKEN (comment / linked
      # PR / sub-issues / status:blocked). Piece 3 (#1004) feeds it pi's PLAIN-TEXT run
      # log (`PI_EXEC_LOG`) instead of claude's structured execution_file, so the failure
      # "why" is cause-aware (billing / error / underspecified) — parity with the claude
      # flow. PASS/FAIL is unchanged either way.
      # A claim-guard refusal is a DELIBERATE stop, not a no-op run (#2027) — the guard says so
      # in its own error text. Reporting it as "produced nothing" reads as a broken pipeline and
      # sends the owner to rewrite a ticket that was fine. It still gets a comment, because
      # silence after comment-dispatch's "🟢 On it" is its own mystery — just a calm one.
      - name: Not picked up — the issue is already claimed
        if: ${{ always() && steps.claim.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
          CLAIM_REASON: ${{ steps.claim.outputs.claim_reason }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER)
            const reason = process.env.CLAIM_REASON || 'another run already holds this issue'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.createComment({ ...context.repo, issue_number, body:
              `⏸️ **Not picked up — ${reason}.**\n\n`
              + `Nothing is broken and nothing was lost: the run stopped before starting so two runs `
              + `can't build the same issue. Resolve the blocker above, then dispatch again.\n\n`
              + `<sub>🤖 pi.dev harness (CI · mac-mini) · claim guard #1890 · <a href="${runUrl}">run log</a></sub>` })

      - name: Artifact-gate — fail if the agent produced nothing
        if: ${{ always() && steps.claim.outcome != 'failure' }}
        uses: actions/github-script@v7
        env:
          PI_EXEC_LOG: ${{ steps.pi.outputs.exec_log }}
          CLAUDE_CONCLUSION: ${{ steps.pi.outputs.conclusion }}
          ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
          TRIGGER: ${{ github.event_name }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER)
            const since = '${{ steps.t0.outputs.ts }}'
            const sinceMs = new Date(since).getTime()

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, since,
            })
            const newComment = comments.length > 0

            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              ...context.repo, issue_number,
            })
            const prRefs = timeline.filter(e =>
              e.event === 'cross-referenced' &&
              e.source && e.source.issue && e.source.issue.pull_request
            )
            const linkedPR = prRefs.some(e => new Date(e.created_at).getTime() >= sinceMs)
            // NOTE (#1019): we deliberately do NOT treat a pre-existing cross-referenced PR as
            // a pass. On #839 an UNRELATED epic PR (#846) merely cross-referenced the issue and
            // false-greened a no-op run. A fresh-work run must yield a FRESH deliverable (a PR
            // opened this run / sub-issues created this run / a sign-off held this run) or a
            // genuinely closed issue — not a stale link. `alreadyLinkedPR` is intentionally unused.

            const issue = await github.rest.issues.get({ ...context.repo, issue_number })
            const blocked = issue.data.labels.some(l => (typeof l === 'string' ? l : l.name) === 'status:blocked')
            const alreadyClosed = issue.data.state === 'closed'

            let createdSubIssues = false
            try {
              const subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                ...context.repo, issue_number, per_page: 100,
              })
              createdSubIssues = subs.some(s => new Date(s.created_at).getTime() >= sinceMs)
            } catch (e) { core.warning(`sub-issue check skipped: ${e.message}`) }

            // ── LEAF DISPATCH (#1740) ──────────────────────────────────────────────────
            // A leaf plan ({"leaf": true}) is NOT a no-op. The deterministic apply step
            // (scripts/apply-decompose-plan.mjs → buildActionList) labels the target `work-this`
            // (WORKER_TRIGGER), which triggers the single-use worker (work-issue-pidev.yml) whose
            // PR lands in a SEPARATE run with its own artifact-gate. So "dispatched the worker" is a
            // complete, honest deliverable for THIS decompose run. Without this branch a correctly-
            // classified leaf false-fails as "produced nothing / underspecified" (the #1713 case —
            // an exemplary issue mis-blamed as underspecified). Same class as the #1074 child-
            // deliverable blind spot. Signal: a `work-this` labeled event on the target since t0.
            const leafDispatched = timeline.some(e =>
              e.event === 'labeled' && e.label && e.label.name === 'work-this' &&
              new Date(e.created_at).getTime() >= sinceMs
            )

            const signoffHeld = blocked && newComment

            // ── ASK vs APPROVE (#1745) ────────────────────────────────────────────────
            // A held run means one of two very different things to the owner: "review and
            // approve this" (a sign-off) or "answer this question" (an ask-human fork — the
            // decide-vs-ask carve-out in .claude/agents/pi-operating-contract.md). Reporting
            // both as "held for sign-off" tells the owner to APPROVE when what is actually
            // needed is an ANSWER — the gate asserting a state it never distinguished (#1751).
            // The ask-human template's mandatory first line is the discriminator.
            const askedQuestion = signoffHeld &&
              comments.some(c => /^##\s*🔀\s*Blocked\b/m.test(c.body || ''))

            if (linkedPR || signoffHeld || alreadyClosed || createdSubIssues || leafDispatched) {
              core.info(`Artifact-gate OK for #${issue_number}: linkedPR=${linkedPR} signoffHeld=${signoffHeld} askedQuestion=${askedQuestion} alreadyClosed=${alreadyClosed} createdSubIssues=${createdSubIssues} leafDispatched=${leafDispatched}`)
              // Result-comment-back (#1017) — only on a label-triggered run (a human is watching the
              // issue). This comment posts as the Harness App (nuxt-harness[bot]) — an unmistakable
              // bot account — so it uses the agent-pipeline provenance header, NOT the @pmcp disclaimer.
              if (process.env.TRIGGER === 'issues') {
                const freshPR = prRefs
                  .filter(e => new Date(e.created_at).getTime() >= sinceMs)
                  .map(e => e.source.issue.number)[0]
                const what = freshPR
                  ? `done → PR #${freshPR}`
                  : askedQuestion ? '**asked you a question** — it needs an *answer*, not an approval. See the 🔀 comment above; replying on this issue resumes the work in a fresh run.'
                  : (createdSubIssues ? 'decomposed → sub-issues created (see the tree)'
                    : leafDispatched ? 'classified as a leaf → handed to the `work-this` worker (its PR lands in a separate run)'
                    : signoffHeld ? 'held for sign-off (`status:blocked` + a review)'
                    : 'produced a deliverable — see the run')
                await github.rest.issues.createComment({
                  ...context.repo, issue_number,
                  body: `> 🤖 **pi.dev harness** · agent pipeline (CI · mac-mini) · _via the \`${context.payload.label?.name || 'delegate'}\` label_\n\n${what}`,
                })
              }
              return
            }

            // ── CHILD deliverables (#1074) ─────────────────────────────────────────────
            // When the labeled issue is ALREADY decomposed, the correct behaviour is
            // "resume the tree, work the remaining open leaf" — the fresh deliverable
            // lands on a CHILD issue, invisible to the checks above (the #1050 false-fail:
            // pi merged a real PR on child #1053 and this gate still went red). Scan the
            // sub-issue tree for the same fresh-since-t0 signals. Only runs when the
            // primary checks found nothing. Kept in sync with decompose-on-issue.yml.
            let childDeliverable = ''
            try {
              const subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                ...context.repo, issue_number, per_page: 100,
              })
              for (const s of subs) {
                if (s.state === 'closed' && s.closed_at && new Date(s.closed_at).getTime() >= sinceMs) {
                  childDeliverable = `child #${s.number} closed this run`; break
                }
                const tl = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  ...context.repo, issue_number: s.number,
                })
                if (tl.some(e => e.event === 'cross-referenced' && e.source && e.source.issue &&
                    e.source.issue.pull_request && new Date(e.created_at).getTime() >= sinceMs)) {
                  childDeliverable = `PR linked to child #${s.number} this run`; break
                }
                const childBlocked = (s.labels || []).some(l => (typeof l === 'string' ? l : l.name) === 'status:blocked')
                if (childBlocked) {
                  const cc = await github.paginate(github.rest.issues.listComments, {
                    ...context.repo, issue_number: s.number, since,
                  })
                  if (cc.length > 0) { childDeliverable = `child #${s.number} held for sign-off this run`; break }
                }
              }
            } catch (e) { core.warning(`child-deliverable check skipped: ${e.message}`) }
            if (childDeliverable) {
              core.info(`Artifact-gate OK for #${issue_number} via child deliverable: ${childDeliverable}`)
              if (process.env.TRIGGER === 'issues') {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number,
                  body: `> 🤖 **pi.dev harness** · agent pipeline (CI · mac-mini) · _via the \`${context.payload.label?.name || 'delegate'}\` label_\n\nresumed the existing tree → ${childDeliverable}`,
                })
              }
              return
            }

            // ── Classify WHY there was no deliverable (#1004 piece 3) ──────────────────
            // pi emits no structured execution_file like claude-code-action — it emits the
            // plain-text run log we tee'd to PI_EXEC_LOG. Grep it for the known causes so the
            // failure comment names the actual problem + fix (mirrors decompose-on-issue.yml's
            // billing/error/underspecified buckets). The most likely first-run cause is an
            // out-of-credit PI_PROVIDER_KEY, so detect that explicitly.
            const fs = require('fs')
            let why = '', action = '', detail = ''
            const failed = process.env.CLAUDE_CONCLUSION === 'failure'
            try {
              const logFile = process.env.PI_EXEC_LOG
              if (logFile && fs.existsSync(logFile)) {
                const log = fs.readFileSync(logFile, 'utf8')
                const tail = log.length > 600 ? log.slice(-600) : log
                // GLM Coding Plan quota (z.ai) — checked FIRST: its 429 is distinct from an
                // Anthropic billing failure and must not fall through to the generic SDK-error
                // bucket (the #1451/#1492 misdiagnosis). z.ai emits `429 {"code":"1308",
                // "message":"Usage limit reached for 5 hour. Your limit will reset at <ts>"}`.
                const glmReset = (log.match(/reset at ([0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:]+)/i) || [])[1]
                if (/\b1308\b|usage limit reached/i.test(log)) {
                  why = 'the GLM Coding Plan quota was reached mid-run'
                    + (glmReset ? ` (the plan window resets at ${glmReset})` : ' (z.ai 5-hour / weekly window)')
                  action = 'wait for that window to reset then re-dispatch on GLM (free), '
                    + 'or escalate this one leaf to the metered `provider=anthropic` lane to unblock now — '
                    + 'this is NOT a code/SDK bug, nothing is broken'
                } else if (/credit balance is too low|insufficient.*(credit|balance|quota)|billing/i.test(log)) {
                  why = 'the Anthropic key (`PI_PROVIDER_KEY`) is out of credit'
                  action = 'top up the account, then re-dispatch' // NB: not "enable auto-reload" — owner declined it (#1327); the pi-key-canary workflow tracks key health
                } else if (failed) {
                  why = 'the pi agent step errored before it built anything'
                  action = 'open the run log, fix the SDK/tooling error, then re-dispatch'
                  if (tail.trim()) detail = tail.trim()
                } else {
                  // LAST RESORT — no known cause matched, so say that (#1876). The old text asserted
                  // "the issue is likely underspecified" in the same confident voice as the real
                  // detections above; on the worker twin that guess sent the owner to rewrite two
                  // well-specified tickets while the actual bug was in the workflow's own shell.
                  why = 'pi ran to completion but no PR, sub-issues, or sign-off hold appeared — and none of the known causes matched'
                  action = 'read the log tail below first — it is what pi actually said. Only if it shows pi genuinely had nothing to act on is the issue underspecified'
                  // ATTACH THE TAIL HERE ABOVE ALL (#2065). This branch means "I cannot explain
                  // this run", and it was the ONLY branch that withheld the log — while sitting
                  // inside `if (exists(logFile))`, so the log was read and then dropped. Three
                  // alarms (#2055/#2056/#2058) were undiagnosable from outside the runner for
                  // exactly this reason, each telling the owner to "open the run log" while the
                  // relevant slice of it sat in `tail`.
                  if (tail.trim()) detail = tail.trim()
                }
              }
            } catch (e) { core.warning(`artifact-gate: could not read pi run log: ${e.message}`) }

            // No log at all (#2065). "Open the run log" is misleading advice when the run
            // never wrote one — and an empty PI_EXEC_LOG is itself evidence: the harness
            // stopped before pi produced any output. Distinguish the two situations.
            let hadLog = false
            try { hadLog = Boolean(process.env.PI_EXEC_LOG) && fs.existsSync(process.env.PI_EXEC_LOG) } catch (e) { hadLog = false }
            if (!why && !hadLog) {
              why = 'pi produced NO run log at all — the harness stopped before pi wrote any output'
              action = 'do not edit the issue. Open the run log and read the steps BEFORE the agent step; '
                + 'an absent `PI_EXEC_LOG` means the failure is upstream of pi, in the workflow'
            }

            // Fallback when the log is unreadable but the step itself failed.
            if (!why && failed) {
              why = 'the pi agent step failed before producing anything (likely out of credit, or an API/tooling error)'
              action = 'open the run log — if it says "credit balance is too low", top up `PI_PROVIDER_KEY`; otherwise fix the logged error, then re-dispatch'
            }

            // Readable-on-mobile (epic #1336, .github/CI-MESSAGE-STYLE.md): lead with the problem
            // + the one fix; the gate name / #461 / run link live in the footer; depth collapses.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const foot = `\n\n<sub>🤖 pi.dev harness (CI · mac-mini) · artifact-gate #461 fails a no-op run so it isn't mistaken for done · <a href="${runUrl}">run log</a></sub>`
            const det = detail ? `\n\n<details><summary>log tail</summary>\n\n\`\`\`\n${detail}\n\`\`\`\n</details>` : ''
            const body = why
              ? `🔴 **@pmcp — this run produced nothing: ${why}.**\n\n**Fix:** ${action}.${det}${foot}`
              : `🔴 **@pmcp — this run produced nothing** — no PR, no sub-issues, no sign-off hold, and none of the known causes matched.\n\n**Fix:** open the run log before changing anything. Only if the log shows the agent genuinely had nothing to act on is the issue underspecified.${foot}`

            await github.rest.issues.createComment({ ...context.repo, issue_number, body })
            core.setFailed(`Artifact-gate: pi.dev run on #${issue_number} produced no deliverable.`)

      # ── Telemetry convergence capture (#944) — REAL data from this pi run ──────────
      # Proves the "one feed → both consumers" loop on a live run: locate this run's pi
      # subagent telemetry (~/.pi/agent/sessions/.../subagent-artifacts) and run the
      # adapter to emit BOTH a Loop Station WS2 trace AND the #883 ledger-row slice.
      # Non-fatal + artifact-only on purpose: it must never fail the headline code-writing
      # proof, and committing rows to the ledger file from CI is a separate follow-up — here
      # we surface them as an artifact + in the log so the convergence is verifiable.
      - name: Capture pi telemetry → WS2 trace + #883 ledger slice (artifacts; non-fatal)
        if: always()
        env:
          SINCE: ${{ steps.t0.outputs.ts }}
        run: |
          set +e
          mkdir -p pi-telemetry-out
          SESS_ROOT="$HOME/.pi/agent/sessions"
          # The most-recently-modified subagent-artifacts dir MODIFIED DURING THIS RUN (#1019):
          # `-newermt "$SINCE"` scopes to dirs touched at/after the run-start timestamp, so we
          # never mis-attribute a PRIOR run's telemetry (the #839 stale-row bug). `-newermt`
          # works on both BSD find (the mac-mini) and GNU find (ubuntu fallback).
          # shellcheck disable=SC2038 # -I{} consumes whole LINES, so a path with spaces survives
          TELE_DIR="$(find "$SESS_ROOT" -type d -name subagent-artifacts -newermt "$SINCE" 2>/dev/null \
            | xargs -I{} stat -f '%m {}' {} 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)"
          if [ -z "$TELE_DIR" ]; then
            TELE_DIR="$(find "$SESS_ROOT" -type d -name subagent-artifacts -newermt "$SINCE" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)"
          fi
          if [ -n "$TELE_DIR" ] && [ -d "$TELE_DIR" ]; then
            echo "pi telemetry dir: $TELE_DIR"
            node .claude/skills/loop-station/pi-telemetry.mjs "$TELE_DIR"          > pi-telemetry-out/pi-trace.jsonl  2>/dev/null
            node .claude/skills/loop-station/pi-telemetry.mjs "$TELE_DIR" --ledger > pi-telemetry-out/ledger-rows.jsonl 2>/dev/null
            echo "── #883 ledger-row slice from THIS pi run (model · cost · turns · wall) ──"
            cat pi-telemetry-out/ledger-rows.jsonl || true
          else
            echo "no pi subagent telemetry found — a decompose-only run (sub-issues, no worker) writes none. Skipping."
          fi

      - name: Upload pi telemetry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-telemetry-${{ github.run_id }}
          path: pi-telemetry-out/
          if-no-files-found: ignore
