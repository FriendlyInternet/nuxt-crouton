name: Wave scheduler

# The CI-finished retry of the wave scheduler (#283, folded by #2893). The issue-closed release
# and the merged-PR close moved into on-issue-close.yml / on-pr-close.yml; what stays here is the
# one trigger that is neither: CI finishing on an `epic/*` branch re-scans and releases any wave
# that was held for a red branch (green-branch gate, #1688), so a held wave resolves itself.
# Logic: scripts/wave-release.mjs (shared with the close workflows) + scripts/wave-gate.mjs.
#
# AUTH (#519 WS5): the label is applied with a Harness App token so the dispatched worker run is
# attributed to `nuxt-harness[bot]` and passes the bot-actor guard.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  retry:
    # Only epic branches matter; skip everything else before spending a runner on it.
    if: startsWith(github.event.workflow_run.head_branch, 'epic/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { retryOnCiFinished } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/wave-release.mjs`)
            await retryOnCiFinished({ github, context, core })
