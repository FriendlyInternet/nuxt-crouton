name: On issue close

# ONE listener for "an issue closed" (#2893, epic #2889). Before this, closing an issue started
# eight workflows; each did one small thing. Now one run, one job per concern:
#
#   job              was
#   strip-status     strip-status-on-close.yml     (#641)
#   refresh-blocked  refresh-blocked-on-close.yml  (#2112)
#   epic-ready-pr    epic-ready-pr.yml             (#1815)
#   cleanup-epic-branch  cleanup-epic-branches.yml (issue path, #2788)
#   release          schedule-waves.yml (issue path) + traffic-release.yml (#2786)
#
# `release` is the ONE place that lifts a wait: `Blocked-by:` lines (scripts/wave-release.mjs) and
# the scope-label traffic check (scripts/traffic-control.mjs) are evaluated together. Together with
# on-pr-close.yml's clear-blocked job those are the only two places that remove `status:blocked`.
#
# Token rule unchanged: `release` and `epic-ready-pr` use the Harness App token (their writes must
# trigger downstream workflows); the cleanups use GITHUB_TOKEN. Permissions live at job level.
# scripts/workflow-listeners.test.mjs fails CI if any other workflow listens for issue close.

on:
  issues:
    # `unlabeled`: a blocker with no PR (closed or unlabelled issue) would otherwise never
    # release its waiter. Only `release` runs for it.
    types: [closed, unlabeled]
  workflow_dispatch:
    inputs:
      epic_branch:
        description: 'epic/<n>-<slug> branch to evaluate (epic-ready-pr job only)'
        required: true

jobs:
  strip-status:
    # (#641) status.yml moves the board card on close; this owns the stale `status:*` LABEL.
    # Idempotent: a 404 ("label not present") is swallowed, so a re-run is a clean no-op.
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.payload.issue.number

            // Match by the `status:` prefix so new status labels are covered automatically.
            const toRemove = (context.payload.issue.labels || [])
              .map(l => l.name)
              .filter(n => (n || '').toLowerCase().startsWith('status:'))

            if (toRemove.length === 0) { core.info('No status:* label to strip.'); return }

            for (const name of toRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
                core.info(`Removed "${name}" from #${issue_number}`)
              } catch (e) {
                // 404 = label already gone (race / re-run) — ignore; rethrow anything else.
                if (e.status === 404) core.info(`"${name}" already absent on #${issue_number}`)
                else throw e
              }
            }

  refresh-blocked:
    # (#2112) Nudge every other open `status:blocked` issue that cites this one by number. Never
    # removes the hold — that stays a human / on-comment.yml call.
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const closedNumber = context.payload.issue.number
            const tokenRe = new RegExp(`(^|[^\\d#])#${closedNumber}(?!\\d)`)

            const blocked = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'status:blocked',
              per_page: 100,
            })

            for (const issue of blocked) {
              if (issue.number === closedNumber) continue
              if (issue.pull_request) continue

              let cites = tokenRe.test(issue.body || '')
              if (!cites) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...context.repo,
                  issue_number: issue.number,
                  per_page: 100,
                })
                cites = comments.some(c => tokenRe.test(c.body || ''))
              }
              if (!cites) continue

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `🔄 the blocker this was waiting on (#${closedNumber}) has since closed — re-check whether this hold still applies.`,
              })
              core.info(`Posted refresh nudge on #${issue.number} (cites closed #${closedNumber}).`)
            }

  epic-ready-pr:
    # The "done" signal (#1815) — see the file header. Manual dispatch re-evaluates one epic branch.
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'closed'
    concurrency:
      # One evaluation per epic at a time (two children closing at once must not double-open the PR).
      group: epic-ready-${{ github.event.issue.number || github.event.inputs.epic_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The App token does the writing; these are for the sub-PR approval gather (#2494).
      pull-requests: read
      issues: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER_LOGIN: ${{ vars.PIPELINE_OWNER || 'pmcp' }}
          DISPATCH_BRANCH: ${{ github.event.inputs.epic_branch }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo
            const OWNER = process.env.OWNER_LOGIN || 'pmcp'
            const ws = process.env.GITHUB_WORKSPACE
            const { parsePipelineBlock } = await import(`${ws}/scripts/pipeline-context.mjs`)
            const { parseEpicNumber, decideOpen, resolveEpicTarget, packagesApprovalCarry, closesNumbers, collectApprovalLines } = await import(`${ws}/scripts/epic-ready.mjs`)

            // Resolve (epicNumber, epicBranch) from either the closed child's pipeline block
            // or a manual dispatch's branch input. When no block/epic is recorded, default
            // epicNumber to the closed issue's OWN number — mirrors the EPIC="${EPIC:-$ISSUE}"
            // convention every other pipeline step uses for a solo leaf dispatched directly via
            // `work-this` (#1686) rather than through a real multi-child epic. Resolution must
            // not depend on the pipeline block surviving to close-time — empirically it often
            // doesn't (#2152).
            let epicNumber, epicBranch, closedIssueNumber = null, blockEpicNumber = null
            if (context.eventName === 'workflow_dispatch') {
              epicBranch = process.env.DISPATCH_BRANCH
              epicNumber = parseEpicNumber(epicBranch)
              if (!epicNumber) { core.info(`could not resolve an epic number from ${epicBranch}; skip.`); return }
            } else {
              const closed = context.payload.issue
              closedIssueNumber = closed.number
              const block = parsePipelineBlock(closed.body || '')
              blockEpicNumber = block.epic
              epicNumber = block.epic ?? closed.number
              epicBranch = block.epic_branch
            }

            // Fall back to matching-refs if the block carried no branch (older children, or a
            // solo leaf whose block never persisted).
            if (!epicBranch) {
              try {
                const refs = await github.paginate('GET /repos/{owner}/{repo}/git/matching-refs/heads/{prefix}',
                  { owner, repo, prefix: `epic/${epicNumber}-` })
                epicBranch = refs[0] ? refs[0].ref.replace('refs/heads/', '') : null
              } catch (e) { core.warning(`matching-refs epic/${epicNumber}-: ${e.message}`) }
            }
            if (!epicBranch) { core.info(`no epic branch for #${epicNumber}; skip.`); return }

            // 1) the epic's DIRECT sub-issues
            let subIssues = []
            try {
              subIssues = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                { owner, repo, issue_number: epicNumber, per_page: 100 })
            } catch (e) { core.warning(`sub-issues for #${epicNumber}: ${e.message}`); return }

            // #2152: a genuine multi-child epic that closed directly (not via a sub-issue's PR
            // merging) is NOT this workflow's job — it closes via /close-epic (#856), so keep the
            // original skip. But a SOLO leaf using itself as its own integration branch (#1686)
            // also resolves epicNumber to its own number, with zero real sub-issues — that used to
            // be indistinguishable from the genuine-epic case and always skipped. Treat it as its
            // epic's one completed child instead.
            if (closedIssueNumber !== null) {
              const { isSolo } = resolveEpicTarget({ closedIssueNumber, blockEpicNumber, subIssueCount: subIssues.length })
              if (epicNumber === closedIssueNumber) {
                if (!isSolo) { core.info(`#${closedIssueNumber} is a genuine epic (${subIssues.length} sub-issue(s)) — closed via /close-epic, not here; skip.`); return }
                core.info(`#${closedIssueNumber} is a solo leaf (its own epic branch, no real sub-issues) — treating its own closure as the completion signal.`)
                subIssues = [{ number: closedIssueNumber, state: 'closed' }]
              }
            }

            // 2) any existing OPEN epic→main PR (idempotency guard)
            const existing = await github.paginate(github.rest.pulls.list,
              { owner, repo, state: 'open', head: `${owner}:${epicBranch}`, base: 'main', per_page: 100 })

            // 3) commits the epic branch is ahead of main
            let aheadCount = 0
            try {
              const cmp = (await github.rest.repos.compareCommitsWithBasehead(
                { owner, repo, basehead: `main...${epicBranch}` })).data
              aheadCount = cmp.ahead_by || 0
            } catch (e) { core.warning(`compare main...${epicBranch}: ${e.message}`); return }

            const { open, reason } = decideOpen({ subIssues, existingEpicMainPrs: existing, aheadCount })
            core.info(`epic #${epicNumber} (${epicBranch}): ${open ? 'OPEN' : 'skip'} — ${reason}`)
            if (!open) return

            // ── Shared-code sign-off carry (#2494) ─────────────────────────────────────────
            // #2481 failed "Packages edit declared" although the owner had approved all four
            // sub-PRs, and the attestation line had to be added by hand. Gather every merged
            // sub-PR into this epic branch; for the ones that touched packages/**, look for the
            // owner's approval on the PR (comment or APPROVED review) or on its `Closes #NN`
            // issue. The decision is the pure, unit-tested packagesApprovalCarry(); only the
            // fetching lives here. Any lookup failure degrades to "not approved" (the guard then
            // asks, as before) — never to a false declaration.
            const epicBody = (await github.rest.issues.get({ owner, repo, issue_number: epicNumber })).data.body || ''
            const carryInput = []
            try {
              const merged = (await github.paginate(github.rest.pulls.list,
                { owner, repo, state: 'closed', base: epicBranch, per_page: 100 })).filter(p => p.merged_at)
              for (const p of merged) {
                const files = (await github.paginate(github.rest.pulls.listFiles,
                  { owner, repo, pull_number: p.number, per_page: 100 })).map(f => f.filename)
                const comments = []
                const pick = c => comments.push({ login: c.user?.login, body: c.body })
                ;(await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: p.number, per_page: 100 })).forEach(pick)
                for (const n of closesNumbers(p.body)) {
                  try {
                    ;(await github.paginate(github.rest.issues.listComments,
                      { owner, repo, issue_number: n, per_page: 100 })).forEach(pick)
                  } catch (e) { core.warning(`comments on #${n} (closed by #${p.number}): ${e.message}`) }
                }
                const reviews = (await github.paginate(github.rest.pulls.listReviews,
                  { owner, repo, pull_number: p.number, per_page: 100 })).map(r => ({ login: r.user?.login, state: r.state }))
                carryInput.push({ number: p.number, files, comments, reviews })
              }
            } catch (e) { core.warning(`sub-PR approval gather for ${epicBranch}: ${e.message} — the shared-code check will ask`) }
            const carry = packagesApprovalCarry({ subPrs: carryInput, owner: OWNER })
            core.info(`packages sign-off carry: touched=${JSON.stringify(carry.packagesPrs)} approved=${JSON.stringify(carry.approved)} unapproved=${JSON.stringify(carry.unapproved)}`)
            // #2748: approvals already written as `Packages-approved:` lines on the epic or its
            // children are copied too (de-duplicated), so a hand-approved epic passes the guard.
            const declared = collectApprovalLines([epicBody, ...subIssues.map(s => s.body)])
              .filter(l => l !== carry.line)
            const declaredSection = declared.length ? `\n\n${declared.join('\n')}\n` : ''
            const carrySection = declaredSection + (carry.packagesPrs.length === 0 ? '' :
              carry.line
                ? `\n\n${carry.line}\n`
                : `\n\n## 🔒 Shared code not yet signed off\n` +
                  `These sub-PRs changed \`packages/**\` without an approval from @${OWNER} on the PR or its issue: ` +
                  `${carry.unapproved.map(n => `#${n}`).join(', ')}. The "Packages edit declared" check stays red until you ` +
                  `add the \`packages:approved\` label here or a \`Packages-approved:\` line. (#2494)\n`)

            // Reference the epic WITHOUT closing it (postmortem gate, #856).
            const epic = (await github.rest.issues.get({ owner, repo, issue_number: epicNumber })).data
            const childList = subIssues.map(s => `- #${s.number} ${s.title}`).join('\n')
            const cleanTitle = epic.title.replace(/^Epic:\s*/i, '')
            const title = `Epic #${epicNumber}: ${cleanTitle}`.slice(0, 250)
            const body =
              `Assembles epic #${epicNumber} — all ${subIssues.length} children closed and merged into ` +
              `\`${epicBranch}\`, ready for \`main\`.\n\n` +
              `> Referenced, not \`Closes\` — the epic closes via the \`/close-epic\` postmortem flow (#856), ` +
              `not on this merge.\n\n` +
              `## 👤 For humans\n${cleanTitle}\n\n**Children (${subIssues.length}):**\n${childList}\n\n` +
              `## 🧪 How to test\nReview the assembled \`${epicBranch}\` → \`main\` diff; CI runs on this PR. ` +
              `Reply \`ok\` and it merges itself once green — you are the review gate. (\`not ok: what's wrong\` sends it back.)` + carrySection + `\n\n` +
              `<sub>🤖 agent pipeline (CI) · epic→main assembler (#1815) · review requested from @${OWNER}</sub>`

            let pr
            try {
              pr = (await github.rest.pulls.create({ owner, repo, head: epicBranch, base: 'main', title, body })).data
            } catch (e) { core.setFailed(`create epic→main PR failed: ${e.message}`); return }
            core.info(`Opened epic→main PR #${pr.number} (${epicBranch} → main).`)

            try {
              await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers: [OWNER] })
              core.info(`Requested review from @${OWNER}.`)
            } catch (e) { core.warning(`requestReviewers @${OWNER}: ${e.message}`) }

  cleanup-epic-branch:
    # (#2788) An epic's integration branch is deleted when the epic CLOSES, and only if it is fully
    # contained in main (zero loss). The epic→main merge half lives in on-pr-close.yml.
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { shouldKeepEpicBranch } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/epic-branch-keep.mjs`)
            // Epic closed: find its integration branch(es) by prefix.
            const n = context.payload.issue.number
            const epicState = 'closed'
            const refs = await github.paginate(github.rest.git.listMatchingRefs, { ...context.repo, ref: `heads/epic/${n}-` })
            const branches = refs.map(r => r.ref.replace('refs/heads/', ''))
            if (!branches.length) core.info(`No epic/${n}-* branch to clean up.`)
            for (const branch of branches) {
              if (shouldKeepEpicBranch(branch, epicState)) {
                core.info(`Keeping ${branch}: its epic is still open (or state unknown).`)
                continue
              }
              // Closed epic: only drop the branch if main already contains all of it.
              const cmp = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `main...${branch}` })
              if (cmp.data.ahead_by > 0) {
                core.warning(`Keeping ${branch}: ${cmp.data.ahead_by} commit(s) not in main.`)
                continue
              }
              try {
                await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${branch}` })
                core.info(`🧹 Deleted epic branch ${branch} (epic closed).`)
              } catch (e) {
                // Already gone (e.g. "delete branch on merge" beat us) — not an error.
                core.warning(`Could not delete ${branch}: ${e.message}`)
              }
            }

  release:
    # Lift a wait: every dependent whose `Blocked-by:` blockers are now all closed (gated on the
    # epic branch not being red), then every ticket parked by the scope-label traffic check.
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      checks: read
    steps:
      # App token (not GITHUB_TOKEN): the released label must cascade into work-issue-pidev.yml.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_PRIVATE_KEY }}
          owner: FriendlyInternet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const ws = process.env.GITHUB_WORKSPACE
            const { releaseReady } = await import(`${ws}/scripts/wave-release.mjs`)
            const { releaseWaiting } = await import(`${ws}/scripts/traffic-control.mjs`)

            // Blocked-by: dependents only react to a CLOSE; unlabelled only frees traffic.
            if (context.payload.action === 'closed') {
              core.info(`Completed workstream: #${context.payload.issue.number}`)
              await releaseReady({ github, context, core }, { onlyBlockedBy: context.payload.issue.number })
            }
            const released = await releaseWaiting({ github, context })
            core.info(released.length ? `traffic released: ${released.map((n) => '#' + n).join(', ')}` : 'traffic: nothing to release')
